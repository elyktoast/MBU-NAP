<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Helvetica,Arial,sans-serif"><rect width="760" height="300" rx="10" fill="#0b1411"/><text x="20" y="28" fill="#e9f3ee" font-size="16" font-weight="700">Capnogram phases</text><text x="20" y="48" fill="#9fb8ad" font-size="12">One breath with the lecture's letter labels</text><polyline fill="none" stroke="#f2d64b" stroke-width="2.5" stroke-linejoin="round" points="60,250 200,250 230,110 470,95 490,250 640,250"/><text x="52" y="272" fill="#5fd0ff" font-size="15">A</text><text x="196" y="272" fill="#5fd0ff" font-size="15">B</text><text x="222" y="102" fill="#5fd0ff" font-size="15">C</text><text x="466" y="86" fill="#5fd0ff" font-size="15">D</text><text x="488" y="272" fill="#5fd0ff" font-size="15">E</text><text x="95" y="238" fill="#9fb8ad" font-size="12">dead space (no CO2)</text><text x="240" y="140" fill="#9fb8ad" font-size="12">expiratory upstroke</text><text x="300" y="86" fill="#9fb8ad" font-size="12">alveolar plateau</text><text x="500" y="160" fill="#9fb8ad" font-size="12">inspiratory</text><text x="500" y="175" fill="#9fb8ad" font-size="12">downstroke</text></svg>
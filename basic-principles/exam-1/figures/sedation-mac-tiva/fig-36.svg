<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Helvetica,Arial,sans-serif"><rect width="760" height="320" rx="10" fill="#0b1411"/><text x="20" y="30" fill="#e9f3ee" font-size="16" font-weight="700">Processed EEG (BIS) scale</text><rect x="80" y="60.0" width="60" height="23.0" fill="#3fae7a"/><text x="160" y="76.5" fill="#e9f3ee" font-size="14">100–90: Awake</text><rect x="80" y="83.0" width="60" height="69.0" fill="#7aa34a"/><text x="160" y="122.5" fill="#e9f3ee" font-size="14">90–60: Sedation</text><rect x="80" y="152.0" width="60" height="46.0" fill="#d9a93a"/><text x="160" y="180.0" fill="#e9f3ee" font-size="14">60–40: General anesthesia range</text><rect x="80" y="198.0" width="60" height="46.0" fill="#d9743a"/><text x="160" y="226.0" fill="#e9f3ee" font-size="14">40–20: Deep hypnotic state</text><rect x="80" y="244.0" width="60" height="46.0" fill="#c0443d"/><text x="160" y="272.0" fill="#e9f3ee" font-size="14">20–0: Excessively deep / burst suppression</text><text x="44" y="64.0" fill="#9fb8ad" font-size="12">100</text><text x="44" y="110.0" fill="#9fb8ad" font-size="12">80</text><text x="44" y="156.0" fill="#9fb8ad" font-size="12">60</text><text x="44" y="202.0" fill="#9fb8ad" font-size="12">40</text><text x="44" y="248.0" fill="#9fb8ad" font-size="12">20</text><text x="44" y="294.0" fill="#9fb8ad" font-size="12">0</text><text x="470" y="120" fill="#9fb8ad" font-size="12">Lecture notes: awake 90–100;</text><text x="470" y="138" fill="#9fb8ad" font-size="12">below 20 = too deep.</text><text x="470" y="170" fill="#9fb8ad" font-size="12">Most useful during TIVA with</text><text x="470" y="188" fill="#9fb8ad" font-size="12">neuromuscular blockade, when</text><text x="470" y="206" fill="#9fb8ad" font-size="12">movement cannot signal light depth.</text></svg>
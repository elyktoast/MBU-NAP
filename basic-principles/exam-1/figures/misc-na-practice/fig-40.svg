<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Helvetica,Arial,sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker></defs><rect width="760" height="300" rx="10" fill="#0b1411"/><text x="20" y="28" fill="#e9f3ee" font-size="16" font-weight="700">Swiss cheese model</text><text x="20" y="48" fill="#9fb8ad" font-size="12">Each slice is a safety layer; holes are system flaws that line up</text><polygon points="110,70 170,90 170,250 110,230" fill="#f2d64b" stroke="#c9ad2e"/><ellipse cx="140" cy="105" rx="12" ry="15" fill="#0b1411"/><ellipse cx="140" cy="200" rx="9" ry="12" fill="#0b1411"/><ellipse cx="140" cy="160" rx="11" ry="14" fill="#0b1411"/><text x="100" y="275" fill="#9fb8ad" font-size="11">Preop checklist</text><polygon points="260,70 320,90 320,250 260,230" fill="#f2d64b" stroke="#c9ad2e"/><ellipse cx="290" cy="128" rx="10" ry="13" fill="#0b1411"/><ellipse cx="290" cy="193" rx="14" ry="17" fill="#0b1411"/><ellipse cx="290" cy="160" rx="11" ry="14" fill="#0b1411"/><text x="250" y="275" fill="#9fb8ad" font-size="11">Med double-check</text><polygon points="410,70 470,90 470,250 410,230" fill="#f2d64b" stroke="#c9ad2e"/><ellipse cx="440" cy="105" rx="12" ry="15" fill="#0b1411"/><ellipse cx="440" cy="200" rx="9" ry="12" fill="#0b1411"/><ellipse cx="440" cy="160" rx="11" ry="14" fill="#0b1411"/><text x="400" y="275" fill="#9fb8ad" font-size="11">Monitoring alarms</text><polygon points="560,70 620,90 620,250 560,230" fill="#f2d64b" stroke="#c9ad2e"/><ellipse cx="590" cy="128" rx="10" ry="13" fill="#0b1411"/><ellipse cx="590" cy="193" rx="14" ry="17" fill="#0b1411"/><ellipse cx="590" cy="160" rx="11" ry="14" fill="#0b1411"/><text x="550" y="275" fill="#9fb8ad" font-size="11">Time-out</text><line x1="40" y1="160" x2="720" y2="160" stroke="#ff6b6b" stroke-width="3" marker-end="url(#a)"/><text x="30" y="150" fill="#ff6b6b" font-size="12">hazard</
name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: snar-quality-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  quality:
    name: Validate architecture and budgets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate repository architecture
        shell: bash
        run: |
          set +e
          npm run validate 2>&1 | tee validation.log
          status=${PIPESTATUS[0]}
          {
            echo '### Repository validation'
            echo '```text'
            cat validation.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Validate question content integrity
        run: npm run test:content
      - name: Run semantic content audit
        run: npm run test:semantic
      - name: Enforce performance and architecture budgets
        run: npm run test:perf
      - name: Analyze question-bank balance
        run: npm run analyze:questions
      - name: Verify content review queue
        run: npm run test:review-queue
      - name: Simulate precalibration CAT behavior
        run: npm run test:cat

  browser:
    name: Browser regression
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regression suite
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7


  pages:
    name: Publish verified site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: browser
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Stamp deployed build with commit SHA
        shell: bash
        run: |
          rm -rf _site
          mkdir _site
          rsync -a --exclude '.git' --exclude '_site' ./ _site/
          printf '{"build":"%s"}\n' "${GITHUB_SHA}" > _site/equipment/build.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload verified site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4

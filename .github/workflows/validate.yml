name: Validate quiz repository
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: repository-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate banks, assets, Studio sources, and build manifest
        run: node scripts/validate-repo.mjs

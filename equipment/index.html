<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Equipment | MBU-NAP</title>

<style>
:root {
    --navy:#1a365d;
    --blue:#2b6cb0;
    --bg:#edf2f7;
    --card:#ffffff;
    --text:#2d3748;
    --muted:#718096;
    --border:#cbd5e0;
}

* { box-sizing:border-box; }

body {
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

.container {
    max-width:1100px;
    margin:auto;
    padding:30px 20px;
}

.back {
    display:inline-block;
    color:var(--blue);
    text-decoration:none;
    font-weight:700;
    margin-bottom:18px;
}

header {
    border-bottom:2px solid var(--border);
    padding-bottom:20px;
    margin-bottom:28px;
}

h1 {
    margin:0;
    color:var(--navy);
    font-size:32px;
}

.subtitle {
    color:var(--muted);
    margin-top:6px;
}

.grid {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:18px;
}

.card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:22px;
    box-shadow:0 3px 10px rgba(0,0,0,.05);
}

.card h2 {
    margin:0 0 8px;
    color:var(--navy);
}

.card p {
    color:var(--muted);
    min-height:48px;
}

.btn {
    display:inline-block;
    background:var(--navy);
    color:white;
    text-decoration:none;
    padding:11px 18px;
    border-radius:7px;
    font-weight:700;
}

.btn:hover {
    background:var(--blue);
}

.disabled {
    opacity:.55;
}

.disabled .btn {
    background:#a0aec0;
    pointer-events:none;
}

@media(max-width:600px) {
    .container { padding:20px 14px; }
    h1 { font-size:27px; }
}
</style>
<link rel="stylesheet" href="assets/site-nav.css?v=2">
<script defer src="assets/site-nav.js?v=4" data-page="equipment"></script>
</head>

<body>

<div class="container">



<header>
    <h1>Equipment</h1>
    <div class="subtitle">Exam preparation and question banks</div>
</header>

<div class="grid">

    <div class="card">
        <h2>Exam 1</h2>
        <p>3 comprehensive quiz banks available.</p>
        <a class="btn" href="exam-1/">Open Exam 1 Dashboard →</a>
    </div>

    <div class="card disabled">
        <h2>Exam 2</h2>
        <p>Quiz banks will be added here.</p>
        <span class="btn">Coming Soon</span>
    </div>

    <div class="card disabled">
        <h2>Final Exam</h2>
        <p>Comprehensive final review banks will be added here.</p>
        <span class="btn">Coming Soon</span>
    </div>

</div>

</div>


<!-- MBU_BUILD:2026-09-24-dashboard-autoupdate-v2-watch8-ui-v2-u11 -->
<script src="assets/auto-update.js?v=11"></script>
</body>
</html>

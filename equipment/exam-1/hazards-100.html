<script>
const QUESTIONS=[{"id": 1, "type": "single", "stem": "A technician removes the index pins from an oxygen cylinder yoke because a cylinder will not fit. What safety function has been defeated?", "options": ["Prevention of two vaporizers being activated", "Prevention of excessive scavenger suction", "Prevention of mounting the wrong gas cylinder", "Prevention of connecting the wrong pipeline hose"], "answer": [2], "explanation": "The Pin Index Safety System uses gas-specific pin positions. Removing the pins defeats that protection and can permit the wrong cylinder to be attached.", "citation": "Anesthesia Workstation Hazards, Slide 7"}, {"id": 2, "type": "single", "stem": "A pipeline hose is being connected to the workstation. Which feature prevents an oxygen hose from being attached to a different medical-gas inlet?", "options": ["Gas-specific DISS diameter and threading", "Common gas outlet 15/22-mm fitting", "Disconnected gas hose", "Disconnect the oxygen pipeline from the machine"], "answer": [0], "explanation": "DISS uses noninterchangeable gas-specific diameter and threading at pipeline connections.", "citation": "Anesthesia Workstation Hazards, Slide 6"}, {"id": 3, "type": "single", "stem": "A full oxygen cylinder enters the workstation at approximately 2200 psi. Which component FIRST reduces this variable high pressure to approximately 45 psi?", "options": ["First-stage pressure regulator", "The oxygen cylinder regulator outputs 45 psi", "The cylinder regulator will raise pipeline pressure above 55 psi", "Pipeline regulator"], "answer": [0], "explanation": "The first-stage cylinder regulator converts variable high cylinder pressure to a constant lower output near 45 psi.", "citation": "Anesthesia Workstation Hazards, Slides 9–10"}, {"id": 4, "type": "single", "stem": "At very low fresh gas flow through a Thorpe tube, a replacement flowmeter calibrated for a gas with different physical properties is installed. Which property most affects accuracy in this low-flow range?", "options": ["The oxygen flowmeter is downstream", "Viscosity", "Remove the tube and stop gas flow simultaneously", "Whether the oxygen flowmeter is rightmost"], "answer": [1], "explanation": "Low flow is predominantly laminar, so viscosity is the important gas property.", "citation": "Anesthesia Workstation Hazards, Slide 12"}, {"id": 5, "type": "single", "stem": "At high flow through a Thorpe tube, which gas property becomes the dominant determinant of flow?", "options": ["Prevention of mounting the wrong gas cylinder", "Remove the tube and stop gas flow simultaneously", "Gas-tight seal at the cylinder connection", "Density"], "answer": [3], "explanation": "At high turbulent flow, density becomes the dominant gas property.", "citation": "Anesthesia Workstation Hazards, Slide 12"}, {"id": 6, "type": "single", "stem": "A leak develops in a flowmeter tube upstream from the oxygen flowmeter. Which design feature most directly decreases the chance of delivering a hypoxic mixture?", "options": ["The common gas outlet has a 22-mm outer diameter", "The oxygen cylinder regulator outputs 45 psi", "The hanger yoke contains a filter", "Oxygen is positioned downstream of the other flowmeters"], "answer": [3], "explanation": "Downstream oxygen placement helps preserve oxygen delivery if an upstream flowmeter leaks.", "citation": "Anesthesia Workstation Hazards, Slide 12"}, {"id": 7, "type": "single", "stem": "Oxygen and nitrous oxide are linked by the workstation proportioning system. Air is then added to the fresh gas mixture. Which statement is most accurate?", "options": ["The system guarantees at least 25% oxygen regardless of all gases used", "The proportioning system directly measures final inspired oxygen concentration", "A hypoxic mixture can still occur because the proportioning system governs only oxygen and nitrous oxide", "Adding air disables nitrous oxide delivery completely"], "answer": [2], "explanation": "The lecture emphasizes that the proportioning system only links oxygen and nitrous oxide and does not guarantee a safe final oxygen concentration when other gases are added.", "citation": "Anesthesia Workstation Hazards, Slide 14"}, {"id": 8, "type": "single", "stem": "A machine with a common-gas-outlet check valve is being tested for a low-pressure leak. Which test principle is required?", "options": ["Apply negative pressure to the low-pressure system", "Pressurize the cylinder above pipeline pressure", "Close the scavenger relief ports", "Apply only positive pressure at the common gas outlet"], "answer": [0], "explanation": "The lecture states that machines with outlet check valves require negative-pressure testing for low-pressure leaks.", "citation": "Anesthesia Workstation Hazards, Slide 15"}, {"id": 9, "type": "select-2", "stem": "Which TWO fittings are correct for the workstation common gas outlet? (Select 2)", "options": ["22-mm female internal fitting", "30-mm female fitting", "22-mm male external fitting", "15-mm male external fitting", "15-mm female internal fitting", "19-mm male fitting"], "answer": [2, 4], "explanation": "The common gas outlet is 15-mm female internally and 22-mm male externally; 19- and 30-mm conical fittings are reserved for scavenging.", "citation": "Anesthesia Workstation Hazards, Slide 15"}, {"id": 10, "type": "single", "stem": "A provider is rushed, distracted by conversation, and skips part of the machine check. Which concept from the lecture BEST characterizes the resulting risk?", "options": ["Anesthesia adverse events are often multifactorial and strongly influenced by human factors", "Disconnect the oxygen pipeline from the machine", "Ignition and grounding", "Fuel and oxidizer"], "answer": [0], "explanation": "The lecture emphasizes multifactorial events and human contributors including distraction, haste, fatigue, and unfamiliarity.", "citation": "Anesthesia Workstation Hazards, Slides 16–18"}, {"id": 11, "type": "select-3", "stem": "Which THREE human factors are specifically emphasized as aggravating contributors to anesthesia adverse events? (Select 3)", "options": ["Fatigue", "Haste", "Anesthesia adverse events are often multifactorial and strongly influenced by human factors", "Tipping converts AC current to DC current", "Both equipment and power supply are grounded exactly as in a home", "Inattention/distraction"], "answer": [0, 1, 5], "explanation": "Inattention/distraction, haste, and fatigue are specifically discussed as aggravating factors.", "citation": "Anesthesia Workstation Hazards, Slide 18"}, {"id": 12, "type": "single", "stem": "A spontaneously breathing intubated patient is transported using a Mapleson A system. Minute ventilation is 8 L/min. What is the minimum fresh gas flow identified by this lecture?", "options": ["Approximately 8 L/min", "Approximately 5.6 L/min", "Approximately 16 L/min", "Approximately 2 L/min"], "answer": [1], "explanation": "Mapleson A requires fresh gas flow of at least 0.7 × minute ventilation: 0.7 × 8 = 5.6 L/min.", "citation": "Anesthesia Workstation Hazards, Slide 21"}, {"id": 13, "type": "single", "stem": "A Mapleson B/C-type system is used for transport. Minute ventilation is 8 L/min. Which fresh gas flow range best matches the lecture?", "options": ["Approximately 24–32 L/min", "Approximately 5.6–8 L/min", "Approximately 12–20 L/min", "Approximately 4–6 L/min"], "answer": [2], "explanation": "The lecture gives 1.5–2.5 × minute ventilation for Mapleson B/C: 12–20 L/min when minute ventilation is 8 L/min.", "citation": "Anesthesia Workstation Hazards, Slide 21"}, {"id": 14, "type": "single", "stem": "A freestanding PEEP valve is added to an older transport circuit. Immediately afterward ventilation becomes difficult. What should be checked FIRST?", "options": ["Whether the DISS connector is color coded", "Whether the oxygen cylinder pressure is exactly 2200 psi", "Whether the PEEP connector itself was positioned incorrectly and obstructed flow", "Whether the vaporizer was filled"], "answer": [2], "explanation": "The lecture warns that an incorrectly placed freestanding PEEP connector can itself obstruct the breathing system.", "citation": "Anesthesia Workstation Hazards, Slide 22"}, {"id": 15, "type": "single", "stem": "During neck surgery, the patient's face and airway connections are hidden beneath drapes. Delivered ventilation suddenly falls. Which equipment problem deserves immediate consideration?", "options": ["The oxygen flowmeter has moved downstream", "Breathing-circuit or endotracheal-tube connection has become disconnected", "Grounded equipment", "Discard the tube and drapes immediately"], "answer": [1], "explanation": "The lecture highlights circuit disconnection during neck surgery because drapes can hide the airway and ET-tube connection.", "citation": "Anesthesia Workstation Hazards, Slide 23"}, {"id": 16, "type": "single", "stem": "A vaporizer is tipped while being moved between machines. Why should it not simply be returned upright and used?", "options": ["Tipping can alter agent delivery and expose the patient to excessive anesthetic", "Tipping disables the DISS connector", "Tipping converts AC current to DC current", "Tipping permanently closes the APL valve"], "answer": [0], "explanation": "The lecture specifically warns that tipping a vaporizer can increase anesthetic dose to the patient.", "citation": "Anesthesia Workstation Hazards, Slide 24"}, {"id": 17, "type": "select-2", "stem": "The operating room loses main electrical power. Which TWO preparations are emphasized while workstation battery power remains? (Select 2)", "options": ["Common gas outlet geometry", "Set up an alternative ventilation method such as a Mapleson system", "Open the APL valve and discontinue all ventilation", "Disconnected gas hose", "Document only if the patient sustained an injury", "Prepare an intravenous anesthetic technique if gas delivery becomes unavailable"], "answer": [1, 5], "explanation": "The lecture recommends using the limited battery interval to prepare alternative ventilation and IV anesthesia such as propofol/TIVA.", "citation": "Anesthesia Workstation Hazards, Slide 32"}, {"id": 18, "type": "single", "stem": "A workstation loses wall power. Before deciding how long normal anesthesia can continue, what information is MOST important to know?", "options": ["Charged backup battery", "Only the anesthesia workstation is ungrounded", "Which machine functions actually operate on its backup battery", "Backup battery charged"], "answer": [2], "explanation": "The lecture emphasizes that machines differ in what remains powered; providers should know which monitors, alarms, and ventilator functions are battery-supported.", "citation": "Anesthesia Workstation Hazards, Slide 25"}, {"id": 19, "type": "single", "stem": "Which statement BEST describes the electrical safety configuration presented for the operating room?", "options": ["Equipment is grounded while the OR power supply is ungrounded", "Both equipment and power supply are grounded exactly as in a home", "Only the anesthesia workstation is ungrounded", "Neither equipment nor power supply is grounded"], "answer": [0], "explanation": "The lecture describes OR power as ungrounded while equipment is grounded.", "citation": "Anesthesia Workstation Hazards, Slides 29–30"}, {"id": 20, "type": "single", "stem": "An electrosurgical return pad has only partial contact with the patient's skin. Which complication is the primary concern?", "options": ["Hypercarbia from increased apparatus dead space", "Hypoxic mixture from flowmeter leakage", "Patient burn from concentrated current density at the poor-contact area", "Cylinder transfilling through the yoke"], "answer": [2], "explanation": "Poor return-pad contact can concentrate current and cause thermal injury.", "citation": "Anesthesia Workstation Hazards, Slide 31"}, {"id": 21, "type": "select-3", "stem": "Which THREE elements must coexist for an operating-room fire? (Select 3)", "options": ["The scavenging system must be occluded", "Ignition source", "The absorbent may be exhausted and should be considered as a source of rebreathing", "Oxidizer", "Ignition and grounding", "Fuel"], "answer": [1, 3, 5], "explanation": "The classic fire triangle consists of ignition, oxidizer, and fuel.", "citation": "Anesthesia Workstation Hazards, Slide 33"}, {"id": 22, "type": "single", "stem": "During facial surgery under nasal-cannula oxygen, electrocautery will be used near the airway. Which intervention BEST reduces fire risk?", "options": ["Increase FiO2 immediately before cautery", "Use the lowest tolerated FiO2 and prevent oxygen accumulation beneath the drapes", "Use the lowest FiO2 tolerated during open oxygen delivery near the airway", "Seal the drapes tightly around the cannula to retain oxygen"], "answer": [1], "explanation": "The lecture recommends allowing prep to dry, avoiding oxygen pooling, and using the lowest FiO2 tolerated during open oxygen delivery near the surgical field.", "citation": "Anesthesia Workstation Hazards, Slide 35"}, {"id": 23, "type": "select-3", "stem": "Which THREE actions are appropriate fire-prevention measures from the lecture? (Select 3)", "options": ["Keep drapes elevated to reduce oxygen pooling", "Use the lowest tolerated FiO2 and prevent oxygen accumulation beneath the drapes", "Use the lowest FiO2 tolerated during open oxygen delivery near the airway", "Allow skin preparation solution to dry before draping", "Increase oxygen flow before electrocautery", "Cover wet prep immediately with occlusive drapes"], "answer": [0, 2, 3], "explanation": "Dry prep, prevention of oxygen pooling, and minimizing FiO2 as tolerated are emphasized prevention measures.", "citation": "Anesthesia Workstation Hazards, Slide 35"}, {"id": 24, "type": "single", "stem": "During airway surgery, the provider hears a pop and sees a flash at the endotracheal tube. What should occur FIRST?", "options": ["Close the APL valve before disconnecting anything", "Leave the tube in place and pour saline through the connector", "Increase fresh gas flow to wash smoke from the circuit", "Remove the tube and stop gas flow simultaneously"], "answer": [3], "explanation": "A pop, flash, or smoke can indicate fire. For an airway fire, the lecture emphasizes removing the tube and stopping gas flow simultaneously.", "citation": "Anesthesia Workstation Hazards, Slide 36"}, {"id": 25, "type": "single", "stem": "After the burning endotracheal tube is removed and gas flow is stopped, what is the most appropriate NEXT action from the lecture sequence?", "options": ["Reconnect the original circuit before assessing injury", "Restart oxygen at 100% before inspecting the airway", "Discard the tube and drapes immediately", "Pour saline into the airway and remove burning material"], "answer": [3], "explanation": "After stopping gases and removing the tube, saline is used to extinguish residual fire and burning material is removed before ventilation and airway reassessment.", "citation": "Anesthesia Workstation Hazards, Slide 36"}, {"id": 26, "type": "single", "stem": "A drape fire occurs on the patient's chest without airway involvement. Which sequence BEST matches the lecture?", "options": ["Extinguish → continue surgery → stop gases after closure", "Stop gases → remove burning drapes/material → extinguish → assess patient", "Assess patient → increase oxygen → remove drapes → extinguish", "Remove monitors → evacuate → leave burning material in place"], "answer": [1], "explanation": "The lecture's patient-fire sequence is stop gases, remove burning material, extinguish, then assess the patient.", "citation": "Anesthesia Workstation Hazards, Slide 37"}, {"id": 27, "type": "single", "stem": "During electrosurgery, alcohol-based prep has not fully dried and supplemental oxygen is pooling under the drapes. Which elements of the fire triangle are being increased?", "options": ["Resistance and capacitance", "Pressure and current", "Fuel and oxidizer", "Ignition and grounding"], "answer": [2], "explanation": "Wet/flammable prep contributes fuel and pooled oxygen increases the oxidizer component; electrocautery can provide ignition.", "citation": "Anesthesia Workstation Hazards, Slides 33–35"}, {"id": 28, "type": "single", "stem": "A fire occurs and is extinguished without obvious patient injury. Which statement BEST reflects the lecture's risk-management approach?", "options": ["Discard the tube and drapes immediately", "Discard involved equipment if the patient is stable", "Document only if the patient sustained an injury", "Preserve the scene and notify risk management even if immediate injury appears absent"], "answer": [3], "explanation": "The lecture emphasizes preserving the scene, notifying the hospital risk manager, and following reporting requirements after a fire event.", "citation": "Anesthesia Workstation Hazards, Slide 39"}, {"id": 29, "type": "single", "stem": "During induction, the hospital oxygen pipeline becomes contaminated. The reserve E-cylinder is full and already open, but the pipeline remains connected. What is the BEST immediate workstation action?", "options": ["Activate the oxygen flush continuously", "Close the cylinder and increase air flow", "Disconnect the oxygen pipeline immediately regardless of its status", "Disconnect the oxygen pipeline from the machine"], "answer": [3], "explanation": "Pipeline oxygen is normally 50–55 psi while cylinder gas is regulated to about 40–45 psi. The pipeline must be disconnected to ensure use of the cylinder when the pipeline source is contaminated.", "citation": "Anesthesia Workstation Hazards, Slide 4"}, {"id": 30, "type": "single", "stem": "A provider completes the morning machine check and leaves the oxygen E-cylinder open. Several hours later the central oxygen pipeline fails. What hazard does this practice create?", "options": ["Pressurize the cylinder above pipeline pressure", "The cylinder regulator will raise pipeline pressure above 55 psi", "The reserve cylinder may be depleted before the pipeline failure is recognized", "The common gas outlet will automatically vent cylinder oxygen"], "answer": [2], "explanation": "Leaving the cylinder open can allow it to supply gas after pipeline failure, potentially depleting the reserve before the provider recognizes the failure. The lecture recommends closing it after checking pressure.", "citation": "Anesthesia Workstation Hazards, Slide 4"}, {"id": 31, "type": "single", "stem": "A workstation receives pipeline oxygen at 52 psi and regulated cylinder oxygen at 45 psi. Both sources are connected. Which source should supply the machine under normal conditions?", "options": ["Cylinder oxygen until pressure falls below 45 psi", "Cylinder oxygen because cylinder gas has priority", "Pipeline oxygen because its pressure is higher", "High pipeline pressure"], "answer": [2], "explanation": "The deliberate pressure difference causes preferential use of pipeline gas.", "citation": "Anesthesia Workstation Hazards, Slide 4"}, {"id": 32, "type": "select-3", "stem": "Which findings should a proper pre-use machine check identify before they produce hypoxemia? (Select 3)", "options": ["Disconnected gas hose", "Absent backup oxygen reserve", "Unattached or unopened oxygen cylinder", "Charged backup battery", "Normal downstream oxygen flowmeter position", "Open the reserve oxygen cylinder for the entire case"], "answer": [0, 1, 2], "explanation": "The lecture specifically lists disconnected hoses, absent backup oxygen, and cylinder problems among hypoxemia hazards that a proper check should catch.", "citation": "Anesthesia Workstation Hazards, Slide 19"}, {"id": 33, "type": "single", "stem": "The workstation repeatedly fails the breathing-circuit leak check despite reseating visible connections. What is the most appropriate NEXT step emphasized in the lecture?", "options": ["Close the APL valve and increase pipeline pressure", "Open the reserve oxygen cylinder for the entire case", "Replace the breathing circuit and repeat the check", "Disable the leak alarm and proceed"], "answer": [2], "explanation": "The instructor specifically notes that swapping the circuit often resolves a persistent breathing-circuit leak.", "citation": "Anesthesia Workstation Hazards, Slide 19"}, {"id": 34, "type": "single", "stem": "After intubation, bilateral breath sounds and end-tidal carbon dioxide are confirmed. Five minutes later carbon dioxide is progressively rising and the patient is not breathing spontaneously. What should be checked FIRST?", "options": ["Whether the vaporizer interlock is engaged", "Whether the oxygen cylinder was closed after the machine check", "Whether mechanical ventilation was started", "Whether the pipeline pressure exceeds cylinder pressure"], "answer": [2], "explanation": "The lecture identifies forgetting to turn on the ventilator after intubation as the most common delivery-system cause of hypercarbia in this scenario.", "citation": "Anesthesia Workstation Hazards, Slide 20"}, {"id": 35, "type": "select-3", "stem": "A mechanically ventilated patient develops progressive hypercarbia. Which THREE workstation/circuit problems from the lecture can cause this finding? (Select 3)", "options": ["Exhausted carbon dioxide absorbent", "Added apparatus dead space", "Hypercarbia from increased apparatus dead space", "Increased apparatus dead space", "Correctly functioning unidirectional valve", "Incompetent unidirectional valve"], "answer": [0, 1, 5], "explanation": "Exhausted absorbent, incompetent valves, and added dead space can all increase inspired/rebreathed carbon dioxide.", "citation": "Anesthesia Workstation Hazards, Slide 20"}, {"id": 36, "type": "single", "stem": "A patient develops hypercarbia after several tubing extensions are added between the Y-piece and airway. The ventilator is functioning and the absorbent is fresh. Which mechanism BEST explains the change?", "options": ["Increased apparatus dead space", "The change proves the ventilator is functioning normally", "The color change confirms the absorbent is fresh", "Added apparatus dead space"], "answer": [0], "explanation": "The lecture identifies tubing extensions and added dead space as a cause of hypercarbia.", "citation": "Anesthesia Workstation Hazards, Slide 20"}, {"id": 37, "type": "single", "stem": "During manual ventilation immediately after induction, airway pressure rapidly rises and the reservoir bag becomes very tense. The circuit is not kinked. Which error should be suspected FIRST?", "options": ["Reserve oxygen cylinder left closed", "Open the APL valve and discontinue all ventilation", "APL valve left closed", "Tipping permanently closes the APL valve"], "answer": [2], "explanation": "An APL valve left closed after induction can cause excessive breathing-system pressure.", "citation": "Anesthesia Workstation Hazards, Slide 23"}, {"id": 38, "type": "single", "stem": "After replacing a breathing circuit, no gas reaches the patient despite normal machine pressures. Inspection reveals no kink. Which overlooked setup error from the lecture is most likely?", "options": ["Replace the breathing circuit and repeat the check", "Plastic wrapping remains over a circuit connector", "Increase fresh gas flow to wash smoke from the circuit", "Disconnect the oxygen pipeline from the machine"], "answer": [1], "explanation": "Unremoved plastic wrapping can occlude a connector and should be detected during the machine check.", "citation": "Anesthesia Workstation Hazards, Slide 22"}, {"id": 39, "type": "select-2", "stem": "Which TWO features of the hanger-yoke assembly directly reduce gas-delivery hazards? (Select 2)", "options": ["Gas-tight seal at the cylinder connection", "Incompetent unidirectional valve", "Prevention of mounting the wrong gas cylinder", "Unidirectional flow/check-valve function", "Correctly functioning unidirectional valve", "Flow-control needle valve"], "answer": [0, 3], "explanation": "The hanger yoke provides a gas-tight seal and contains a unidirectional valve that reduces leakage/backflow hazards.", "citation": "Anesthesia Workstation Hazards, Slide 9"}, {"id": 40, "type": "single", "stem": "A flowmeter bank is damaged upstream from the oxygen tube. Which arrangement provides the safest gas path?", "options": ["Oxygen tube positioned furthest downstream", "Oxygen tube positioned furthest upstream", "All tubes positioned in parallel with no downstream order", "Nitrous oxide tube downstream of oxygen"], "answer": [0], "explanation": "The lecture emphasizes downstream oxygen placement to reduce hypoxic-mixture risk from upstream leaks.", "citation": "Anesthesia Workstation Hazards, Slide 12"}, {"id": 41, "type": "single", "stem": "A clinician assumes the oxygen–nitrous proportioning linkage guarantees a safe inspired oxygen concentration. Which scenario disproves that assumption?", "options": ["Closing the reserve cylinder increases nitrous oxide concentration", "Adding another gas such as helium can still permit oxygen concentration below 21%", "Oxygen proportioning linkage", "Automatic oxygen concentration analysis"], "answer": [1], "explanation": "The proportioning system does not protect against every gas combination; the lecture specifically warns about additional gases such as helium or air.", "citation": "Anesthesia Workstation Hazards, Slide 14"}, {"id": 42, "type": "single", "stem": "A machine without a common-gas-outlet check valve is evaluated for a low-pressure leak. Which general test direction is supported by the lecture?", "options": ["Cylinder pressure must be increased above 2200 psi", "The scavenging system must be occluded", "Positive pressure can be applied at the common gas outlet", "Only negative pressure can detect the leak"], "answer": [2], "explanation": "The lecture contrasts machines without an outlet check valve, which can be tested with positive pressure, with machines having a check valve, which require negative pressure.", "citation": "Anesthesia Workstation Hazards, Slide 15"}, {"id": 43, "type": "single", "stem": "A patient is being ventilated with a transport circuit that permits rebreathing if fresh gas flow is inadequate. Which strategy from the lecture is safest for Mapleson B/C systems?", "options": ["Prevention of mounting the wrong gas cylinder", "Reduce flow below minute ventilation to conserve oxygen", "Close the APL valve completely", "Run high fresh gas flow within the required multiple of minute ventilation"], "answer": [3], "explanation": "The lecture recommends high flow for Mapleson B/C because they require approximately 1.5–2.5 times minute ventilation.", "citation": "Anesthesia Workstation Hazards, Slide 21"}, {"id": 44, "type": "single", "stem": "A machine check is delegated to an anesthesia technician. What responsibility remains with the anesthesia provider according to the lecture?", "options": ["Confirm that the machine check was actually completed", "Leave the reserve cylinder open to prove the check occurred", "Bypass the circuit leak test if the technician signed the room sheet", "Assume delegation eliminates the need to verify readiness"], "answer": [0], "explanation": "The lecture explicitly says to confirm the morning machine check was actually completed even when delegated.", "citation": "Anesthesia Workstation Hazards, Slide 19"}, {"id": 45, "type": "select-2", "stem": "Which TWO breathing-system assembly errors from the lecture can contribute to hypercarbia? (Select 2)", "options": ["Increase electrocautery output to test the isolated power system", "Equipment grounded in the OR", "Hoses connected to incorrect outlets or inlets", "Apply negative pressure to the low-pressure system", "Place the reservoir bag between the patient and unidirectional valves", "Reservoir bag positioned incorrectly relative to inspiratory/expiratory valves"], "answer": [2, 5], "explanation": "The lecture advises confirming hoses are on the correct outlets/inlets and that the reservoir bag is not incorrectly positioned in the valve pathway.", "citation": "Anesthesia Workstation Hazards, Slide 20"}, {"id": 46, "type": "single", "stem": "A provider sees a color change in the carbon dioxide absorbent during a case with rising carbon dioxide. Which interpretation is most appropriate based on the lecture?", "options": ["The color change confirms the absorbent is fresh", "The change proves the ventilator is functioning normally", "The absorbent may be exhausted and should be considered as a source of rebreathing", "The change indicates pipeline oxygen contamination"], "answer": [2], "explanation": "The lecture specifically says to watch for the absorbent color change as a clue to exhaustion in hypercarbia troubleshooting.", "citation": "Anesthesia Workstation Hazards, Slide 20"}, {"id": 47, "type": "single", "stem": "A workstation power failure occurs during volatile anesthesia. The backup battery is expected to last roughly 40 minutes on this machine. What is the BEST planning principle?", "options": ["Transition to a sustainable alternative well before battery depletion", "Charged backup battery", "Use the full 40 minutes before preparing an alternative", "Only the anesthesia workstation is ungrounded"], "answer": [0], "explanation": "The lecture emphasizes using the battery window to establish an alternative and having the patient safely covered before battery power is exhausted.", "citation": "Anesthesia Workstation Hazards, Slide 32"}, {"id": 48, "type": "single", "stem": "an operating-room fire has been extinguished. Which action is most appropriate for subsequent risk investigation?", "options": ["Discard the tube and drapes immediately", "Clean and return the circuit to service", "Preserve the ET tube, circuit, drapes, and other involved equipment", "Document only if the patient sustained an injury"], "answer": [2], "explanation": "The lecture instructs providers to preserve the scene and equipment and follow institutional/regulatory reporting procedures.", "citation": "Anesthesia Workstation Hazards, Slide 39"}, {"id": 49, "type": "single", "stem": "During a room fire that cannot be extinguished promptly, which action becomes appropriate according to the lecture?", "options": ["Activate the fire alarm and consider evacuation", "Continue the procedure until the battery fails", "Leave all drapes on the patient during evacuation", "Disable the leak alarm and proceed"], "answer": [0], "explanation": "The lecture notes that failure to extinguish the fire should prompt alarm activation and consideration of evacuation.", "citation": "Anesthesia Workstation Hazards, Slide 38"}, {"id": 50, "type": "single", "stem": "Which finding BEST distinguishes a cylinder-supply safety feature from a pipeline-supply safety feature?", "options": ["Both systems regulate cylinder pressure to 45 psi", "DISS controls cylinders while PISS controls wall hoses", "PISS uses pin positions at the cylinder yoke, whereas DISS uses gas-specific diameter/threading at pipeline connections", "Cylinder transfilling through the yoke"], "answer": [2], "explanation": "PISS is the cylinder-yoke indexing system; DISS is the noninterchangeable pipeline connector system.", "citation": "Anesthesia Workstation Hazards, Slides 6–7"}, {"id": 51, "type": "single", "stem": "Wall O2 is 52 psi and cylinder O2 is regulated to 45 psi. Which source supplies the machine first?", "options": ["Whichever was opened last", "Both equally", "Pipeline O2", "Cylinder O2"], "answer": [2], "explanation": "Pipeline pressure is intentionally higher, so the machine preferentially draws from the pipeline.", "citation": "Anesthesia Workstation Hazards, Slide 4"}, {"id": 52, "type": "single", "stem": "You need cylinder O2 because the hospital O2 supply is contaminated. What must you do?", "options": ["Increase cylinder pressure", "Disconnect the pipeline", "Open the APL valve", "Close the cylinder"], "answer": [1], "explanation": "The pipeline must be disconnected or its higher pressure will remain the preferred source.", "citation": "Anesthesia Workstation Hazards, Slide 4"}, {"id": 53, "type": "single", "stem": "Why is the O2 cylinder closed after its pressure is checked?", "options": ["To preserve reserve O2 and reveal pipeline failure", "To test the DISS fitting", "To raise pipeline pressure", "To prevent vaporizer back pressure"], "answer": [0], "explanation": "Closing the cylinder preserves the reserve and allows a pipeline failure to become apparent before the cylinder is depleted.", "citation": "Anesthesia Workstation Hazards, Slide 4"}, {"id": 54, "type": "single", "stem": "Which region is downstream of the first-stage regulator but upstream of the flow-control valves?", "options": ["Low-pressure system", "High-pressure system", "Intermediate-pressure system", "Scavenging system"], "answer": [2], "explanation": "The intermediate-pressure system lies between the first-stage regulator and the flow-control valves.", "citation": "Anesthesia Workstation Hazards, Slide 5"}, {"id": 55, "type": "single", "stem": "Which region begins downstream of the flow-control valves?", "options": ["Cylinder-supply system", "High-pressure system", "Low-pressure system", "Intermediate-pressure system"], "answer": [2], "explanation": "The lecture defines the low-pressure system as all components downstream of the flow-control valves.", "citation": "Anesthesia Workstation Hazards, Slide 5"}, {"id": 56, "type": "single", "stem": "A pipeline hose cannot fit the wrong gas inlet because of which system?", "options": ["APL", "CGO", "PISS", "DISS"], "answer": [3], "explanation": "DISS uses gas-specific diameters and threading for pipeline connections.", "citation": "Anesthesia Workstation Hazards, Slide 6"}, {"id": 57, "type": "single", "stem": "Removing the index pins from a cylinder yoke creates what hazard?", "options": ["Pipeline cross-connection", "Excessive scavenging", "Wrong cylinder attachment", "Vaporizer overfilling"], "answer": [2], "explanation": "Removing the pins bypasses PISS and can allow the wrong gas cylinder to be mounted.", "citation": "Anesthesia Workstation Hazards, Slide 7"}, {"id": 58, "type": "single", "stem": "A Bourdon gauge senses pressure by movement of what component?", "options": ["Tapered glass tube", "Solenoid valve", "Flexible reservoir bag", "Coiled metal tube"], "answer": [3], "explanation": "Pressure straightens the coiled Bourdon tube and moves the gauge pointer.", "citation": "Anesthesia Workstation Hazards, Slide 8"}, {"id": 59, "type": "single", "stem": "Which hanger-yoke feature permits cylinder replacement while the machine remains in use?", "options": ["Pressure-relief valve", "Oxygen analyzer", "Unidirectional valve", "Flow-control valve"], "answer": [2], "explanation": "The unidirectional valve reduces leakage from an empty yoke and permits cylinder replacement during use.", "citation": "Anesthesia Workstation Hazards, Slide 9"}, {"id": 60, "type": "single", "stem": "A cylinder regulator receives variable high pressure. What should its output be?", "options": ["Variable higher pressure", "Atmospheric pressure", "Negative pressure", "Constant lower pressure"], "answer": [3], "explanation": "A pressure regulator converts variable high-pressure input to a constant lower-pressure output.", "citation": "Anesthesia Workstation Hazards, Slide 10"}, {"id": 61, "type": "single", "stem": "An O2 cylinder is full at about 2200 psi. What pressure leaves its first-stage regulator?", "options": ["About 5 psi", "About 220 psi", "About 45 psi", "About 2200 psi"], "answer": [2], "explanation": "The lecture gives a typical regulated cylinder output near 45 psi.", "citation": "Anesthesia Workstation Hazards, Slide 10"}, {"id": 62, "type": "single", "stem": "At low flow through a Thorpe tube, flow is most influenced by gas:", "options": ["Viscosity", "Humidity", "Solubility", "Density"], "answer": [0], "explanation": "Low flow is laminar, making viscosity the dominant gas property.", "citation": "Anesthesia Workstation Hazards, Slide 12"}, {"id": 63, "type": "single", "stem": "At high flow through a Thorpe tube, flow is most influenced by gas:", "options": ["Density", "Solubility", "Humidity", "Viscosity"], "answer": [0], "explanation": "High flow is turbulent, making density the dominant gas property.", "citation": "Anesthesia Workstation Hazards, Slide 12"}, {"id": 64, "type": "single", "stem": "Why is O2 positioned downstream in the flowmeter bank?", "options": ["To reduce hypoxic-mixture risk after an upstream leak", "To activate the fail-safe valve", "To increase cylinder pressure", "To improve scavenging"], "answer": [0], "explanation": "Downstream oxygen placement reduces the chance that an upstream leak removes oxygen from the final mixture.", "citation": "Anesthesia Workstation Hazards, Slide 12"}, {"id": 65, "type": "single", "stem": "Which feature helps identify the O2 flow-control knob by touch?", "options": ["Larger diameter and ridges", "Recessed position", "Smaller diameter and smooth surface", "Square shape"], "answer": [0], "explanation": "The oxygen knob is larger and more ridged, providing tactile differentiation.", "citation": "Anesthesia Workstation Hazards, Slide 13"}, {"id": 66, "type": "single", "stem": "The O2–N2O proportioning system primarily protects against low O2 when using:", "options": ["Air alone", "O2 and N2O", "O2 and helium", "Air and helium"], "answer": [1], "explanation": "The proportioning linkage functions between oxygen and nitrous oxide, not all possible gases.", "citation": "Anesthesia Workstation Hazards, Slide 14"}, {"id": 67, "type": "single", "stem": "Why can a hypoxic mixture still occur despite an O2–N2O proportioning system?", "options": ["It disables the O2 analyzer", "It measures cylinder pressure only", "It controls the APL valve", "Other gases can bypass its protection"], "answer": [3], "explanation": "The lecture warns that gases such as helium or air can allow a hypoxic mixture despite the O2–N2O linkage.", "citation": "Anesthesia Workstation Hazards, Slide 14"}, {"id": 68, "type": "single", "stem": "A machine has a CGO check valve. Which leak-test approach is required?", "options": ["Negative pressure", "Scavenger suction", "Positive pressure only", "Cylinder pressure"], "answer": [0], "explanation": "With a common-gas-outlet check valve, negative pressure must be used to test the low-pressure system.", "citation": "Anesthesia Workstation Hazards, Slide 15"}, {"id": 69, "type": "single", "stem": "Which fitting combination identifies the common gas outlet?", "options": ["15-mm male and 22-mm female", "15-mm female and 22-mm male", "19-mm female and 30-mm male", "19-mm male and 22-mm female"], "answer": [1], "explanation": "The CGO is 15 mm female internally and 22 mm male externally.", "citation": "Anesthesia Workstation Hazards, Slide 15"}, {"id": 70, "type": "single", "stem": "Why are rare anesthesia complications difficult to manage well?", "options": ["They never affect outcomes", "Providers get little real-event experience", "They are caused only by equipment", "They always occur in isolation"], "answer": [1], "explanation": "The lecture notes that rarity limits experience and training for these events.", "citation": "Anesthesia Workstation Hazards, Slide 16"}, {"id": 71, "type": "single", "stem": "Most anesthesia adverse events described in the lecture are:", "options": ["Purely electrical", "Multifactorial", "Purely mechanical", "Unavoidable"], "answer": [1], "explanation": "Adverse events commonly combine system problems, human factors, and technical failures.", "citation": "Anesthesia Workstation Hazards, Slide 17"}, {"id": 72, "type": "select-3", "stem": "Which THREE human factors can contribute to an anesthesia adverse event? (Select 3)", "options": ["Haste", "Fatigue", "Distraction", "Downstream O2 placement", "DISS threading", "CGO diameter"], "answer": [0, 1, 2], "explanation": "The lecture emphasizes distraction, haste, and fatigue as human contributors.", "citation": "Anesthesia Workstation Hazards, Slide 18"}, {"id": 73, "type": "single", "stem": "A breathing-circuit leak persists during the machine check. What is the BEST next step?", "options": ["Ignore the leak", "Close the APL permanently", "Replace the circuit", "Open the O2 cylinder"], "answer": [2], "explanation": "The lecture specifically notes that swapping the circuit often resolves a failed leak check.", "citation": "Anesthesia Workstation Hazards, Slide 19"}, {"id": 74, "type": "single", "stem": "After intubation, ETCO2 rises because the patient is not breathing. What should be checked FIRST?", "options": ["Bovie pad is attached", "Cylinder is full", "Vaporizer is upright", "Ventilator is turned on"], "answer": [3], "explanation": "Forgetting to start the ventilator after intubation is emphasized as the common delivery-system cause of hypercarbia.", "citation": "Anesthesia Workstation Hazards, Slide 20"}, {"id": 75, "type": "select-3", "stem": "Which THREE can cause delivery-system hypercarbia? (Select 3)", "options": ["Correct O2 flowmeter position", "Added dead space", "Charged battery", "Incompetent unidirectional valve", "Exhausted CO2 absorbent", "Closed backup O2 cylinder"], "answer": [1, 3, 4], "explanation": "Added dead space, valve failure, and exhausted absorbent can all promote rebreathing and hypercarbia.", "citation": "Anesthesia Workstation Hazards, Slide 20"}, {"id": 76, "type": "single", "stem": "A Mapleson A is used for a spontaneously breathing patient with MV 10 L/min. Minimum FGF?", "options": ["20 L/min", "5 L/min", "10 L/min", "7 L/min"], "answer": [3], "explanation": "Mapleson A requires at least 0.7 × minute ventilation: 0.7 × 10 = 7 L/min.", "citation": "Anesthesia Workstation Hazards, Slide 21"}, {"id": 77, "type": "single", "stem": "A Mapleson B/C is used with MV 8 L/min. Which FGF range matches the lecture?", "options": ["5.6–8 L/min", "24–32 L/min", "12–20 L/min", "4–8 L/min"], "answer": [2], "explanation": "Mapleson B/C requires about 1.5–2.5 × minute ventilation, or 12–20 L/min for an 8-L/min MV.", "citation": "Anesthesia Workstation Hazards, Slide 21"}, {"id": 78, "type": "single", "stem": "No gas reaches the patient after a new circuit is attached. Tubing is not kinked. What should be checked?", "options": ["Battery voltage", "Cylinder color", "Bovie pad", "Plastic wrap on a connector"], "answer": [3], "explanation": "Leftover plastic wrap can occlude a connector and should be found during the machine check.", "citation": "Anesthesia Workstation Hazards, Slide 22"}, {"id": 79, "type": "single", "stem": "High circuit pressure develops just after induction. Which setup error is most likely?", "options": ["Battery fully charged", "APL valve left closed", "CGO check valve present", "O2 cylinder closed"], "answer": [1], "explanation": "An APL valve left closed can produce dangerously high breathing-system pressure.", "citation": "Anesthesia Workstation Hazards, Slide 23"}, {"id": 80, "type": "single", "stem": "Why is circuit disconnection especially concerning during neck surgery?", "options": ["The vaporizer tips", "Pipeline pressure falls", "The battery drains faster", "Drapes can hide the airway connection"], "answer": [3], "explanation": "Drapes may cover the face and ET-tube connection, making disconnection less obvious.", "citation": "Anesthesia Workstation Hazards, Slide 23"}, {"id": 81, "type": "single", "stem": "A vaporizer is tipped while being moved. What hazard is emphasized?", "options": ["Excess anesthetic delivery", "Low cylinder pressure", "Scavenger obstruction", "Loss of DISS protection"], "answer": [0], "explanation": "The lecture warns that tipping a vaporizer can increase anesthetic dose.", "citation": "Anesthesia Workstation Hazards, Slide 24"}, {"id": 82, "type": "single", "stem": "Typical workstation backup-battery time in the lecture is about:", "options": ["5 minutes", "8 hours", "40 minutes", "24 hours"], "answer": [2], "explanation": "The lecture gives about 40 minutes as typical, with some machines lasting 1–2 hours.", "citation": "Anesthesia Workstation Hazards, Slide 25"}, {"id": 83, "type": "single", "stem": "Why must you know exactly what the workstation battery powers?", "options": ["Battery power raises cylinder pressure", "Battery power controls the fire extinguisher", "Battery power changes DISS threads", "Ventilator, alarms, and monitors may differ by machine"], "answer": [3], "explanation": "The lecture emphasizes that battery-supported functions vary by workstation.", "citation": "Anesthesia Workstation Hazards, Slide 25"}, {"id": 84, "type": "single", "stem": "Electrical power is calculated as:", "options": ["Resistance × time", "Voltage × current", "Voltage × resistance", "Current × time"], "answer": [1], "explanation": "The lecture gives power in watts as voltage multiplied by current.", "citation": "Anesthesia Workstation Hazards, Slide 26"}, {"id": 85, "type": "single", "stem": "Electrical energy in joules equals:", "options": ["Impedance × voltage", "Volts × resistance", "Current × resistance", "Watts × time"], "answer": [3], "explanation": "The lecture gives energy as power multiplied by time.", "citation": "Anesthesia Workstation Hazards, Slide 26"}, {"id": 86, "type": "single", "stem": "Compared with AC, approximately how much more DC is required to cause ventricular fibrillation?", "options": ["Ten times more", "Two times more", "The same amount", "Three times more"], "answer": [3], "explanation": "The lecture states it takes about three times more DC than AC to cause ventricular fibrillation.", "citation": "Anesthesia Workstation Hazards, Slide 27"}, {"id": 87, "type": "single", "stem": "In an AC circuit, resistance plus capacitance and inductance is called:", "options": ["Conductance", "Power", "Impedance", "Capacitance"], "answer": [2], "explanation": "Impedance is the AC opposition that includes resistance, capacitance, and inductance.", "citation": "Anesthesia Workstation Hazards, Slide 27"}, {"id": 88, "type": "single", "stem": "A capacitor consists of:", "options": ["Two conductors separated by an insulator", "A coil around an iron core", "One conductor connected to ground", "Two resistors in series"], "answer": [0], "explanation": "The lecture defines a capacitor as two parallel conductors separated by an insulator.", "citation": "Anesthesia Workstation Hazards, Slide 28"}, {"id": 89, "type": "single", "stem": "Which statement matches OR electrical safety?", "options": ["Neither is grounded", "Power is ungrounded; equipment is grounded", "Power is grounded; equipment is ungrounded", "Power and equipment are both grounded"], "answer": [1], "explanation": "The lecture contrasts the OR with home wiring: OR power is ungrounded while equipment is grounded.", "citation": "Anesthesia Workstation Hazards, Slides 29–30"}, {"id": 90, "type": "single", "stem": "Poor contact of the electrosurgical return pad primarily risks:", "options": ["Patient burn", "Hypoxic mixture", "Cylinder transfilling", "Hypercarbia"], "answer": [0], "explanation": "Poor pad contact can concentrate current and burn the patient.", "citation": "Anesthesia Workstation Hazards, Slide 31"}, {"id": 91, "type": "single", "stem": "During a power failure, what should be prepared before battery depletion?", "options": ["Alternative ventilation and IV anesthesia", "A second Bovie pad", "A new CO2 absorber only", "A second DISS hose"], "answer": [0], "explanation": "The lecture recommends preparing a Mapleson-type alternative and IV anesthesia while battery power remains.", "citation": "Anesthesia Workstation Hazards, Slide 32"}, {"id": 92, "type": "select-3", "stem": "Which THREE form the OR fire triangle? (Select 3)", "options": ["APL valve", "Fuel", "Battery", "Ignition source", "Scavenger", "Oxidizer"], "answer": [1, 3, 5], "explanation": "Fire requires ignition, oxidizer, and fuel.", "citation": "Anesthesia Workstation Hazards, Slide 33"}, {"id": 93, "type": "single", "stem": "During facial surgery with open O2, which action BEST lowers fire risk?", "options": ["Increase O2 before cautery", "Seal O2 under drapes", "Use the lowest tolerated FiO2", "Drape before prep dries"], "answer": [2], "explanation": "The lecture recommends minimizing FiO2 as tolerated and preventing oxygen pooling.", "citation": "Anesthesia Workstation Hazards, Slide 35"}, {"id": 94, "type": "single", "stem": "A pop, flash, and smoke occur during airway surgery. What should be assumed?", "options": ["Fire", "Normal cautery artifact", "Vaporizer leak", "Pipeline crossover"], "answer": [0], "explanation": "A pop, flash, or smoke are warning signs of an OR fire.", "citation": "Anesthesia Workstation Hazards, Slide 36"}, {"id": 95, "type": "single", "stem": "An ET tube ignites. Which actions should occur simultaneously?", "options": ["Increase O2 and remove drapes", "Remove the tube and stop gas flow", "Disconnect scavenging and increase FGF", "Close APL and continue ventilation"], "answer": [1], "explanation": "Current teaching in the lecture is to remove the tube and stop gas flow simultaneously.", "citation": "Anesthesia Workstation Hazards, Slide 36"}, {"id": 96, "type": "single", "stem": "After the airway fire is extinguished, what comes after removing burning material?", "options": ["Increase nitrous oxide", "Discard all equipment", "Mask ventilate and assess the airway", "Restart cautery"], "answer": [2], "explanation": "The lecture proceeds to mask ventilation and assessment for reintubation or emergency tracheostomy.", "citation": "Anesthesia Workstation Hazards, Slide 36"}, {"id": 97, "type": "single", "stem": "A fire is on the patient's drapes, not in the airway. What is the FIRST priority sequence?", "options": ["Increase oxygen and call PACU", "Continue surgery while extinguishing", "Stop gases and remove burning material", "Leave drapes and assess first"], "answer": [2], "explanation": "For a patient fire, the lecture starts with stopping gases and removing drapes/burning material.", "citation": "Anesthesia Workstation Hazards, Slide 37"}, {"id": 98, "type": "single", "stem": "Who usually identifies the extinguisher location during timeout?", "options": ["Circulating nurse", "Surgeon only", "Anesthesia technician", "PACU nurse"], "answer": [0], "explanation": "The lecture states the circulating nurse usually identifies the fire extinguisher location.", "citation": "Anesthesia Workstation Hazards, Slide 38"}, {"id": 99, "type": "single", "stem": "After an OR fire, what should happen to the involved ET tube and circuit?", "options": ["Sterilize and reuse them", "Preserve them in place", "Send them to PACU", "Discard them"], "answer": [1], "explanation": "The lecture says to preserve the equipment and scene for risk-management review.", "citation": "Anesthesia Workstation Hazards, Slide 39"}, {"id": 100, "type": "single", "stem": "During a case, technician removes the index pins from an oxygen cylinder yoke because a cylinder will not fit. What safety function has been defeated?", "options": ["Prevention of mounting the wrong gas cylinder", "Prevention of excessive scavenger suction", "Prevention of two vaporizers being activated", "Prevention of connecting the wrong pipeline hose"], "answer": [0], "explanation": "The Pin Index Safety System uses gas-specific pin positions. Removing the pins defeats that protection and can permit the wrong cylinder to be attached.", "citation": "Anesthesia Workstation Hazards, Slide 7"}];
const KEY="hazards100-v1"; let state=JSON.parse(localStorage.getItem(KEY)||"null")||{i:0,answers:{},graded:{},flags:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function q(){return QUESTIONS[state.i]}
function render(){
 const x=q(), multi=x.type.startsWith("select");
 document.getElementById("qnum").textContent=`Question ${state.i+1} of 100${multi?" • Select all that apply":""}`;
 document.getElementById("stem").textContent=x.stem;
 const chosen=state.answers[x.id]||[]; const graded=state.graded[x.id];
 document.getElementById("options").innerHTML=x.options.map((o,i)=>`<button class="option ${chosen.includes(i)?"selected":""} ${graded?(x.answer.includes(i)?"correct":chosen.includes(i)?"wrong":""):""}" onclick="pick(${i})" ${graded?"disabled":""}>${String.fromCharCode(65+i)}. ${o}</button>`).join("");
 const fb=document.getElementById("feedback");
 if(graded){const ok=same(chosen,x.answer);fb.className="feedback "+(ok?"good":"bad");fb.textContent=(ok?"Correct. ":"Incorrect. ")+x.explanation+" — "+x.citation;}
 else{fb.className="feedback";fb.textContent="";}
 document.getElementById("submit").style.display=graded?"none":"inline-block";
 document.getElementById("next").style.display=graded&&!same(chosen,x.answer)?"inline-block":"none";
 const g=Object.keys(state.graded).length, c=Object.keys(state.graded).filter(id=>state.graded[id]&&same(state.answers[id]||[],QUESTIONS[id-1].answer)).length;
 document.getElementById("score").textContent=`${c} correct • ${g} answered`;
 document.getElementById("bar").style.width=`${g}%`;
 renderNav(); save();
}
function pick(i){const x=q();if(state.graded[x.id])return;let a=state.answers[x.id]||[];if(x.type==="single")a=[i];else a=a.includes(i)?a.filter(v=>v!==i):[...a,i];state.answers[x.id]=a;render()}
function same(a,b){return JSON.stringify([...a].sort((x,y)=>x-y))===JSON.stringify([...b].sort((x,y)=>x-y))}
function submitAnswer(){const x=q(),a=state.answers[x.id]||[];if(!a.length)return;state.graded[x.id]=true;render();if(same(a,x.answer)&&state.i<99)setTimeout(()=>{state.i++;render()},650)}
function nextQ(){if(state.i<99){state.i++;render()}} function prevQ(){if(state.i>0){state.i--;render()}}
function go(i){state.i=i;render()} function toggleFlag(){state.flags[q().id]=!state.flags[q().id];render()}
function renderNav(){document.getElementById("nav").innerHTML=QUESTIONS.map((x,i)=>{let cl=[];if(i===state.i)cl.push("cur");if(state.flags[x.id])cl.push("flag");if(state.graded[x.id])cl.push(same(state.answers[x.id]||[],x.answer)?"ok":"no");return `<button class="${cl.join(" ")}" onclick="go(${i})">${i+1}${state.flags[x.id]?"⚑":""}</button>`}).join("")}
function restart(){if(confirm("Restart this 100-question quiz?")){state={i:0,answers:{},graded:{},flags:{}};render()}}
function toggleCalc(){const c=document.getElementById("calc");c.style.display=c.style.display==="block"?"none":"block"}
function calc(){try{const s=document.getElementById("calcIn").value;if(!/^[0-9+\-*/().\s]+$/.test(s))throw 0;document.getElementById("calcOut").textContent=Function('"use strict";return ('+s+')')()}catch(e){document.getElementById("calcOut").textContent="Invalid expression"}}
render();

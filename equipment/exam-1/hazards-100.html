*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}body{margin:0;background:var(--bg);color:var(--t);line-height:1.5;padding:20px}.wrap{max-width:1040px;margin:auto}.panel{background:white;border-radius:10px;box-shadow:0 4px 12px #00000012;padding:28px}.hero{display:flex;justify-content:space-between;align-items:end;border-bottom:2px solid var(--b);padding-bottom:18px;margin-bottom:22px}.hero h1{margin:0;color:#1a202c}.hero p{margin:4px 0 0;color:var(--mut)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{border:1px solid var(--b);border-radius:9px;padding:18px;background:#fff}.card h3{margin:0 0 6px}.mini{color:var(--mut);font-size:.9rem}.bar{height:9px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin:12px 0}.bar>span{display:block;height:100%;background:var(--pl)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:6px;background:var(--p);color:white;padding:10px 16px;font-weight:700;cursor:pointer}.btn:hover{filter:brightness(1.08)}.btn.out{background:white;color:var(--p);border:1.5px solid var(--p)}.btn.bad{background:#9b2c2c}.btn:disabled{background:#cbd5e0;color:white;border-color:#cbd5e0;cursor:not-allowed}.header{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:2px solid var(--b);padding-bottom:14px;margin-bottom:18px}.badge{background:var(--p);color:#fff;padding:5px 14px;border-radius:999px;font-size:.85rem;font-weight:800}.progress{font-weight:700;color:#4a5568}.stats{display:flex;gap:22px;flex-wrap:wrap;background:var(--soft);border:1px solid var(--b);padding:12px 16px;border-radius:7px;margin-bottom:20px}.type{font-size:.84rem;color:#b7791f;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}.stem{font-size:1.12rem;font-weight:650;color:#1a202c;margin-bottom:18px}.image{display:flex;justify-content:center;margin:15px 0 20px}.options{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}.opt{display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 16px;border:1.5px solid var(--b);border-radius:6px;background:white;text-align:left;font-size:.98rem;cursor:pointer}.opt:hover:not(.locked){background:var(--soft);border-color:var(--pl)}.opt.selected{border-color:var(--p);background:#ebf8ff;font-weight:650}.opt.correct{background:var(--okbg)!important;border-color:var(--ok)!important;color:var(--ok)!important;font-weight:750}.opt.incorrect{background:var(--badbg)!important;border-color:var(--bad)!important;color:var(--bad)!important}.opt.strike{text-decoration:line-through;opacity:.45}.prefix{font-weight:800;min-width:26px}.explain{display:none;margin-top:18px;padding:18px;border-radius:6px;background:#f8fafc;border-left:5px solid var(--p);font-size:.95rem}.cite{margin-top:10px;font-size:.85rem;font-weight:750;color:#4a5568}.controls{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--b);padding-top:16px;margin-top:24px}.hidden{display:none!important}.mbu-choice-row{display:flex;gap:8px;align-items:stretch}.mbu-choice-row .opt{flex:1;min-width:0}.mbu-cross{flex:0 0 44px;border:1px solid #cbd5e0;border-radius:8px;background:#fff;color:#4a5568;font-size:18px;cursor:pointer}.mbu-cross[aria-pressed="true"]{background:#fff5f5;color:#9b2c2c;border-color:#e53e3e}.mbu-cross:disabled{opacity:.5;cursor:default}@media(max-width:650px){body{padding:10px}.panel{padding:18px}.hero,.header,.controls{align-items:flex-start;flex-direction:column}.controls .row{width:100%}.controls .btn{flex:1}.stats{gap:10px}}

<link rel="stylesheet" href="../assets/bank1-quiz-ui.css?v=62"><script defer src="../assets/site-nav.js?v=62" data-page="haz1"></script></head><body class="mbu-bank1-ui"><div class="wrap"><section id="dashboard" class="panel"><div class="hero mbu-dashboard-header"><div class="mbu-dashboard-title"><h1>Workstation Hazards Practice Set 1</h1><div class="mini mbu-dashboard-overall" id="overall"></div></div></div><div id="cards" class="grid"></div></section><section id="quiz" class="panel hidden"><div class="header"><div class="row"><span class="badge" id="set-badge"></span><button class="btn out" id="mbuFlagBtn" onclick="mbuToggleFlag(activeQuestion())">☆ Flag</button><button class="btn out" onclick="mbuReportQuestion(activeQuestion())">Report</button><button class="btn out" onclick="document.getElementById('mbuNavigator').classList.toggle('hidden')">Navigator</button><button class="btn out mbu-return" onclick="location.href='hazards.html'">← Hazards Practice Sets</button></div><div class="progress" id="progress"></div></div><div class="stats"><div>Completed: <strong id="completed">0</strong>/100</div><div>Score: <strong id="score">0</strong>%</div><div>Missed: <strong id="missed">0</strong></div></div><div id="mbuNavigator" class="row hidden" style="flex-wrap:wrap;gap:6px;margin:8px 0 14px;max-height:180px;overflow:auto;padding:3px"></div><div class="type" id="type"></div><div class="stem" id="stem"></div><div class="mbu-crossout-hint">Tip: Right-click an answer to cross it out.</div><div class="image hidden" id="image"></div><div class="options" id="options"></div><div class="row" id="multi-submit-row" style="display:none;margin:4px 0 18px;justify-content:flex-end!important"><button class="btn" id="submit-multi" onclick="submitAnswer()">Submit Answer</button></div><div class="explain" id="explain"><div id="explain-text"></div><div class="cite" id="citation"></div></div><div class="controls"><button class="btn out" id="prev" onclick="nav(-1)">Previous</button><div class="row"><button class="btn out" onclick="resetCurrent()">Reset</button><button class="btn" id="next" onclick="nav(1)">Next</button></div></div></section></div><script src="../assets/studio-sync.js?v=62"></script><script src="../assets/navigator.js?v=62"></script><script src="../assets/hazards-standard-engine.js?v=62"></script><script>const QUESTIONS=[{"id":1,"type":"single","stem":"A technician removes the index pins from an oxygen cylinder yoke because a cylinder will not fit. What safety function has been defeated?","options":["Pipeline pressure regulator","Scavenger interface","Prevention of mounting the wrong gas cylinder","Pipeline DISS connection"],"answer":[2],"explanation":"The Pin Index Safety System uses gas-specific pin positions. Removing the pins defeats that protection and can permit the wrong cylinder to be attached.","citation":"Anesthesia Workstation Hazards, Slide 7"},{"id":2,"type":"single","stem":"A pipeline hose is being connected to the workstation. Which feature prevents an oxygen hose from being attached to a different medical-gas inlet?","options":["Gas-specific DISS diameter and threading","Pin-index yoke pins","15/22-mm common gas outlet fitting","Flow-control knob shape"],"answer":[0],"explanation":"DISS uses noninterchangeable gas-specific diameter and threading at pipeline connections.","citation":"Anesthesia Workstation Hazards, Slide 6"},{"id":3,"type":"single","stem":"A full oxygen cylinder enters the workstation at approximately 2200 psi. Which component FIRST reduces this variable high pressure to approximately 45 psi?","options":["First-stage pressure regulator","Flow-control valve","Pipeline inlet check valve","Common gas outlet"],"answer":[0],"explanation":"The first-stage cylinder regulator converts variable high cylinder pressure to a constant lower output near 45 psi.","citation":"Anesthesia Workstation Hazards, Slides 9–10"},{"id":4,"type":"single","stem":"At very low fresh gas flow through a Thorpe tube, a replacement flowmeter calibrated for a gas with different physical properties is installed. Which property most affects accuracy in this low-flow range?","options":["Density","Viscosity","Vapor pressure","Critical temperature"],"answer":[1],"explanation":"Low flow is predominantly laminar, so viscosity is the important gas property.","citation":"Anesthesia Workstation Hazards, Slide 12"},{"id":5,"type":"single","stem":"At high flow through a Thorpe tube, which gas property becomes the dominant determinant of flow?","options":["Viscosity","Vapor pressure","Critical temperature","Density"],"answer":[3],"explanation":"At high turbulent flow, density becomes the dominant gas property.","citation":"Anesthesia Workstation Hazards, Slide 12"},{"id":6,"type":"single","stem":"A leak develops in a flowmeter tube upstream from the oxygen flowmeter. Which design feature most directly decreases the chance of delivering a hypoxic mixture?","options":["The common gas outlet has a 22-mm outer diameter","The oxygen cylinder regulator outputs 45 psi","The hanger yoke contains a filter","Oxygen is positioned downstream of the other flowmeters"],"answer":[3],"explanation":"Downstream oxygen placement helps preserve oxygen delivery if an upstream flowmeter leaks.","citation":"Anesthesia Workstation Hazards, Slide 12"},{"id":7,"type":"single","stem":"Oxygen and nitrous oxide are linked by the workstation proportioning system. Air is then added to the fresh gas mixture. Which statement is most accurate?","options":["The system guarantees at least 25% oxygen regardless of all gases used","The proportioning system directly measures final inspired oxygen concentration","A hypoxic mixture can still occur because the proportioning system governs only oxygen and nitrous oxide","Adding air disables nitrous oxide delivery completely"],"answer":[2],"explanation":"The lecture emphasizes that the proportioning system only links oxygen and nitrous oxide and does not guarantee a safe final oxygen concentration when other gases are added.","citation":"Anesthesia Workstation Hazards, Slide 14"},{"id":8,"type":"single","stem":"A machine with a common-gas-outlet check valve is being tested for a low-pressure leak. Which test principle is required?","options":["Apply negative pressure to the low-pressure system","Pressurize the cylinder above pipeline pressure","Close the scavenger relief ports","Apply only positive pressure at the common gas outlet"],"answer":[0],"explanation":"The lecture states that machines with outlet check valves require negative-pressure testing for low-pressure leaks.","citation":"Anesthesia Workstation Hazards, Slide 15"},{"id":9,"type":"select-2","stem":"Which TWO fittings are correct for the workstation common gas outlet? (Select 2)","options":["22-mm female internal fitting","30-mm female fitting","22-mm male external fitting","15-mm male external fitting","15-mm female internal fitting","19-mm male fitting"],"answer":[2,4],"explanation":"The common gas outlet is 15-mm female internally and 22-mm male externally; 19- and 30-mm conical fittings are reserved for scavenging.","citation":"Anesthesia Workstation Hazards, Slide 15"},{"id":10,"type":"single","stem":"A provider is rushed, distracted by conversation, and skips part of the machine check. Which concept from the lecture BEST characterizes the resulting risk?","options":["Anesthesia adverse events are often multifactorial and strongly influenced by human factors","Modern workstations eliminate most human-factor risk","Equipment failures are usually isolated from provider behavior","Only technical failures are relevant to machine-related events"],"answer":[0],"explanation":"The lecture emphasizes multifactorial events and human contributors including distraction, haste, fatigue, and unfamiliarity.","citation":"Anesthesia Workstation Hazards, Slides 16–18"},{"id":11,"type":"select-3","stem":"Which THREE human factors are specifically emphasized as aggravating contributors to anesthesia adverse events? (Select 3)","options":["Fatigue","Haste","Equipment standardization","Pipeline pressure","DISS indexing","Inattention/distraction"],"answer":[0,1,5],"explanation":"Inattention/distraction, haste, and fatigue are specifically discussed as aggravating factors.","citation":"Anesthesia Workstation Hazards, Slide 18"},{"id":12,"type":"single","stem":"A spontaneously breathing intubated patient is transported using a Mapleson A system. Minute ventilation is 8 L/min. What is the minimum fresh gas flow identified by this lecture?","options":["Approximately 8 L/min","Approximately 5.6 L/min","Approximately 16 L/min","Approximately 2 L/min"],"answer":[1],"explanation":"Mapleson A requires fresh gas flow of at least 0.7 × minute ventilation: 0.7 × 8 = 5.6 L/min.","citation":"Anesthesia Workstation Hazards, Slide 21"},{"id":13,"type":"single","stem":"A Mapleson B/C-type system is used for transport. Minute ventilation is 8 L/min. Which fresh gas flow range best matches the lecture?","options":["Approximately 24–32 L/min","Approximately 5.6–8 L/min","Approximately 12–20 L/min","Approximately 4–6 L/min"],"answer":[2],"explanation":"The lecture gives 1.5–2.5 × minute ventilation for Mapleson B/C: 12–20 L/min when minute ventilation is 8 L/min.","citation":"Anesthesia Workstation Hazards, Slide 21"},{"id":14,"type":"single","stem":"A freestanding PEEP valve is added to an older transport circuit. Immediately afterward ventilation becomes difficult. What should be checked FIRST?","options":["Whether the DISS connector is color coded","Whether the oxygen cylinder pressure is exactly 2200 psi","Whether the PEEP connector itself was positioned incorrectly and obstructed flow","Whether the vaporizer was filled"],"answer":[2],"explanation":"The lecture warns that an incorrectly placed freestanding PEEP connector can itself obstruct the breathing system.","citation":"Anesthesia Workstation Hazards, Slide 22"},{"id":15,"type":"single","stem":"During neck surgery, the patient's face and airway connections are hidden beneath drapes. Delivered ventilation suddenly falls. Which equipment problem deserves immediate consideration?","options":["The oxygen flowmeter has moved downstream","Breathing-circuit or endotracheal-tube connection has become disconnected","Grounded equipment","Discard the tube and drapes immediately"],"answer":[1],"explanation":"The lecture highlights circuit disconnection during neck surgery because drapes can hide the airway and ET-tube connection.","citation":"Anesthesia Workstation Hazards, Slide 23"},{"id":16,"type":"single","stem":"A vaporizer is tipped while being moved between machines. Why should it not simply be returned upright and used?","options":["Tipping can alter agent delivery and expose the patient to excessive anesthetic","Tipping disables the DISS connector","Tipping converts AC current to DC current","Tipping permanently closes the APL valve"],"answer":[0],"explanation":"The lecture specifically warns that tipping a vaporizer can increase anesthetic dose to the patient.","citation":"Anesthesia Workstation Hazards, Slide 24"},{"id":17,"type":"select-2","stem":"The operating room loses main electrical power. Which TWO preparations are emphasized while workstation battery power remains? (Select 2)","options":["Open the backup cylinder and leave the pipeline connected","Set up an alternative ventilation method such as a Mapleson system","Disable alarms to conserve battery","Increase reliance on electrically powered equipment","Continue unchanged until battery depletion","Prepare an intravenous anesthetic technique if gas delivery becomes unavailable"],"answer":[1,5],"explanation":"The lecture recommends using the limited battery interval to prepare alternative ventilation and IV anesthesia such as propofol/TIVA.","citation":"Anesthesia Workstation Hazards, Slide 32"},{"id":18,"type":"single","stem":"A workstation loses wall power. Before deciding how long normal anesthesia can continue, what information is MOST important to know?","options":["Total cylinder pressure","Whether the OR is isolated power","Which machine functions actually operate on its backup battery","The common gas outlet diameter"],"answer":[2],"explanation":"The lecture emphasizes that machines differ in what remains powered; providers should know which monitors, alarms, and ventilator functions are battery-supported.","citation":"Anesthesia Workstation Hazards, Slide 25"},{"id":19,"type":"single","stem":"Which statement BEST describes the electrical safety configuration presented for the operating room?","options":["Equipment is grounded while the OR power supply is ungrounded","Both equipment and power supply are grounded exactly as in a home","Only the anesthesia workstation is ungrounded","Neither equipment nor power supply is grounded"],"answer":[0],"explanation":"The lecture describes OR power as ungrounded while equipment is grounded.","citation":"Anesthesia Workstation Hazards, Slides 29–30"},{"id":20,"type":"single","stem":"An electrosurgical return pad has only partial contact with the patient's skin. Which complication is the primary concern?","options":["Hypercarbia from increased apparatus dead space","Hypoxic mixture from flowmeter leakage","Patient burn from concentrated current density at the poor-contact area","Cylinder transfilling through the yoke"],"answer":[2],"explanation":"Poor return-pad contact can concentrate current and cause thermal injury.","citation":"Anesthesia Workstation Hazards, Slide 31"},{"id":21,"type":"select-3","stem":"Which THREE elements must coexist for an operating-room fire? (Select 3)","options":["Scavenging suction","Ignition source","Pipeline pressure","Oxidizer","Electrical grounding","Fuel"],"answer":[1,3,5],"explanation":"The classic fire triangle consists of ignition, oxidizer, and fuel.","citation":"Anesthesia Workstation Hazards, Slide 33"},{"id":22,"type":"single","stem":"During facial surgery under nasal-cannula oxygen, electrocautery will be used near the airway. Which intervention BEST reduces fire risk?","options":["Increase FiO2 immediately before cautery","Use the lowest tolerated FiO2 and prevent oxygen accumulation beneath the drapes","Use the lowest FiO2 tolerated during open oxygen delivery near the airway","Seal the drapes tightly around the cannula to retain oxygen"],"answer":[1],"explanation":"The lecture recommends allowing prep to dry, avoiding oxygen pooling, and using the lowest FiO2 tolerated during open oxygen delivery near the surgical field.","citation":"Anesthesia Workstation Hazards, Slide 35"},{"id":23,"type":"select-3","stem":"Which THREE actions are appropriate fire-prevention measures from the lecture? (Select 3)","options":["Keep drapes elevated to reduce oxygen pooling","Use the lowest tolerated FiO2 and prevent oxygen accumulation beneath the drapes","Use the lowest FiO2 tolerated during open oxygen delivery near the airway","Allow skin preparation solution to dry before draping","Increase oxygen flow before electrocautery","Cover wet prep immediately with occlusive drapes"],"answer":[0,2,3],"explanation":"Dry prep, prevention of oxygen pooling, and minimizing FiO2 as tolerated are emphasized prevention measures.","citation":"Anesthesia Workstation Hazards, Slide 35"},{"id":24,"type":"single","stem":"During airway surgery, the provider hears a pop and sees a flash at the endotracheal tube. What should occur FIRST?","options":["Close the APL valve before disconnecting anything","Leave the tube in place and pour saline through the connector","Increase fresh gas flow to wash smoke from the circuit","Remove the tube and stop gas flow simultaneously"],"answer":[3],"explanation":"A pop, flash, or smoke can indicate fire. For an airway fire, the lecture emphasizes removing the tube and stopping gas flow simultaneously.","citation":"Anesthesia Workstation Hazards, Slide 36"},{"id":25,"type":"single","stem":"After the burning endotracheal tube is removed and gas flow is stopped, what is the most appropriate NEXT action from the lecture sequence?","options":["Reconnect the original circuit before assessing injury","Restart oxygen at 100% before inspecting the airway","Discard the tube and drapes immediately","Pour saline into the airway and remove burning material"],"answer":[3],"explanation":"After stopping gases and removing the tube, saline is used to extinguish residual fire and burning material is removed before ventilation and airway reassessment.","citation":"Anesthesia Workstation Hazards, Slide 36"},{"id":26,"type":"single","stem":"A drape fire occurs on the patient's chest without airway involvement. Which sequence BEST matches the lecture?","options":["Extinguish → continue surgery → stop gases after closure","Stop gases → remove burning drapes/material → extinguish → assess patient","Assess patient → increase oxygen → remove drapes → extinguish","Remove monitors → evacuate → leave burning material in place"],"answer":[1],"explanation":"The lecture's patient-fire sequence is stop gases, remove burning material, extinguish, then assess the patient.","citation":"Anesthesia Workstation Hazards, Slide 37"},{"id":27,"type":"single","stem":"During electrosurgery, alcohol-based prep has not fully dried and supplemental oxygen is pooling under the drapes. Which elements of the fire triangle are being increased?","options":["Resistance and capacitance","Pressure and current","Fuel and oxidizer","Ignition and grounding"],"answer":[2],"explanation":"Wet/flammable prep contributes fuel and pooled oxygen increases the oxidizer component; electrocautery can provide ignition.","citation":"Anesthesia Workstation Hazards, Slides 33–35"},{"id":28,"type":"single","stem":"A fire occurs and is extinguished without obvious patient injury. Which statement BEST reflects the lecture's risk-management approach?","options":["Discard the tube and drapes immediately","Discard involved equipment if the patient is stable","Document only if the patient sustained an injury","Preserve the scene and notify risk management even if immediate injury appears absent"],"answer":[3],"explanation":"The lecture emphasizes preserving the scene, notifying the hospital risk manager, and following reporting requirements after a fire event.","citation":"Anesthesia Workstation Hazards, Slide 39"},{"id":29,"type":"single","stem":"During induction, the hospital oxygen pipeline becomes contaminated. The reserve E-cylinder is full and already open, but the pipeline remains connected. What is the BEST immediate workstation action?","options":["Activate the oxygen flush continuously","Close the cylinder and increase air flow","Disconnect the oxygen pipeline immediately regardless of its status","Disconnect the oxygen pipeline from the machine"],"answer":[3],"explanation":"Pipeline oxygen is normally 50–55 psi while cylinder gas is regulated to about 40–45 psi. The pipeline must be disconnected to ensure use of the cylinder when the pipeline source is contaminated.","citation":"Anesthesia Workstation Hazards, Slide 4"},{"id":30,"type":"single","stem":"A provider completes the morning machine check and leaves the oxygen E-cylinder open. Several hours later the central oxygen pipeline fails. What hazard does this practice create?","options":["Pressurize the cylinder above pipeline pressure","The cylinder regulator will raise pipeline pressure above 55 psi","The reserve cylinder may be depleted before the pipeline failure is recognized","The common gas outlet will automatically vent cylinder oxygen"],"answer":[2],"explanation":"Leaving the cylinder open can allow it to supply gas after pipeline failure, potentially depleting the reserve before the provider recognizes the failure. The lecture recommends closing it after checking pressure.","citation":"Anesthesia Workstation Hazards, Slide 4"},{"id":31,"type":"single","stem":"A workstation receives pipeline oxygen at 52 psi and regulated cylinder oxygen at 45 psi. Both sources are connected. Which source should supply the machine under normal conditions?","options":["Cylinder oxygen until pressure falls below 45 psi","Cylinder oxygen because cylinder gas has priority","Pipeline oxygen because its pressure is higher","High pipeline pressure"],"answer":[2],"explanation":"The deliberate pressure difference causes preferential use of pipeline gas.","citation":"Anesthesia Workstation Hazards, Slide 4"},{"id":32,"type":"select-3","stem":"Which findings should a proper pre-use machine check identify before they produce hypoxemia? (Select 3)","options":["Disconnected gas hose","Absent backup oxygen reserve","Unattached or unopened oxygen cylinder","Charged backup battery","Normal downstream oxygen flowmeter position","Open the reserve oxygen cylinder for the entire case"],"answer":[0,1,2],"explanation":"The lecture specifically lists disconnected hoses, absent backup oxygen, and cylinder problems among hypoxemia hazards that a proper check should catch.","citation":"Anesthesia Workstation Hazards, Slide 19"},{"id":33,"type":"single","stem":"The workstation repeatedly fails the breathing-circuit leak check despite reseating visible connections. What is the most appropriate NEXT step emphasized in the lecture?","options":["Close the APL valve and increase pipeline pressure","Open the reserve oxygen cylinder for the entire case","Replace the breathing circuit and repeat the check","Disable the leak alarm and proceed"],"answer":[2],"explanation":"The instructor specifically notes that swapping the circuit often resolves a persistent breathing-circuit leak.","citation":"Anesthesia Workstation Hazards, Slide 19"},{"id":34,"type":"single","stem":"After intubation, bilateral breath sounds and end-tidal carbon dioxide are confirmed. Five minutes later carbon dioxide is progressively rising and the patient is not breathing spontaneously. What should be checked FIRST?","options":["Whether the vaporizer interlock is engaged","Whether the oxygen cylinder was closed after the machine check","Whether mechanical ventilation was started","Whether the pipeline pressure exceeds cylinder pressure"],"answer":[2],"explanation":"The lecture identifies forgetting to turn on the ventilator after intubation as the most common delivery-system cause of hypercarbia in this scenario.","citation":"Anesthesia Workstation Hazards, Slide 20"},{"id":35,"type":"select-3","stem":"A mechanically ventilated patient develops progressive hypercarbia. Which THREE workstation/circuit problems from the lecture can cause this finding? (Select 3)","options":["Exhausted carbon dioxide absorbent","Added apparatus dead space","Hypercarbia from increased apparatus dead space","Increased apparatus dead space","Correctly functioning unidirectional valve","Incompetent unidirectional valve"],"answer":[0,1,5],"explanation":"Exhausted absorbent, incompetent valves, and added dead space can all increase inspired/rebreathed carbon dioxide.","citation":"Anesthesia Workstation Hazards, Slide 20"},{"id":36,"type":"single","stem":"A patient develops hypercarbia after several tubing extensions are added between the Y-piece and airway. The ventilator is functioning and the absorbent is fresh. Which mechanism BEST explains the change?","options":["Increased apparatus dead space","The change proves the ventilator is functioning normally","The color change confirms the absorbent is fresh","Added apparatus dead space"],"answer":[0],"explanation":"The lecture identifies tubing extensions and added dead space as a cause of hypercarbia.","citation":"Anesthesia Workstation Hazards, Slide 20"},{"id":37,"type":"single","stem":"During manual ventilation immediately after induction, airway pressure rapidly rises and the reservoir bag becomes very tense. The circuit is not kinked. Which error should be suspected FIRST?","options":["Reserve oxygen cylinder left closed","Open the APL valve and discontinue all ventilation","APL valve left closed","Tipping permanently closes the APL valve"],"answer":[2],"explanation":"An APL valve left closed after induction can cause excessive breathing-system pressure.","citation":"Anesthesia Workstation Hazards, Slide 23"},{"id":38,"type":"single","stem":"After replacing a breathing circuit, no gas reaches the patient despite normal machine pressures. Inspection reveals no kink. Which overlooked setup error from the lecture is most likely?","options":["Replace the breathing circuit and repeat the check","Plastic wrapping remains over a circuit connector","Increase fresh gas flow to wash smoke from the circuit","Disconnect the oxygen pipeline from the machine"],"answer":[1],"explanation":"Unremoved plastic wrapping can occlude a connector and should be detected during the machine check.","citation":"Anesthesia Workstation Hazards, Slide 22"},{"id":39,"type":"select-2","stem":"Which TWO features of the hanger-yoke assembly directly reduce gas-delivery hazards? (Select 2)","options":["Gas-tight seal at the cylinder connection","Incompetent unidirectional valve","Prevention of mounting the wrong gas cylinder","Unidirectional flow/check-valve function","Correctly functioning unidirectional valve","Flow-control needle valve"],"answer":[0,3],"explanation":"The hanger yoke provides a gas-tight seal and contains a unidirectional valve that reduces leakage/backflow hazards.","citation":"Anesthesia Workstation Hazards, Slide 9"},{"id":40,"type":"single","stem":"A flowmeter bank is damaged upstream from the oxygen tube. Which arrangement provides the safest gas path?","options":["Oxygen tube positioned furthest downstream","Oxygen tube positioned furthest upstream","All tubes positioned in parallel with no downstream order","Nitrous oxide tube downstream of oxygen"],"answer":[0],"explanation":"The lecture emphasizes downstream oxygen placement to reduce hypoxic-mixture risk from upstream leaks.","citation":"Anesthesia Workstation Hazards, Slide 12"},{"id":41,"type":"single","stem":"A clinician assumes the oxygen–nitrous proportioning linkage guarantees a safe inspired oxygen concentration. Which scenario disproves that assumption?","options":["Closing the reserve cylinder increases nitrous oxide concentration","Adding another gas such as helium can still permit oxygen concentration below 21%","Oxygen proportioning linkage","Automatic oxygen concentration analysis"],"answer":[1],"explanation":"The proportioning system does not protect against every gas combination; the lecture specifically warns about additional gases such as helium or air.","citation":"Anesthesia Workstation Hazards, Slide 14"},{"id":42,"type":"single","stem":"A machine without a common-gas-outlet check valve is evaluated for a low-pressure leak. Which general test direction is supported by the lecture?","options":["Cylinder pressure must be increased above 2200 psi","The scavenging system must be occluded","Positive pressure can be applied at the common gas outlet","Only negative pressure can detect the leak"],"answer":[2],"explanation":"The lecture contrasts machines without an outlet check valve, which can be tested with positive pressure, with machines having a check valve, which require negative pressure.","citation":"Anesthesia Workstation Hazards, Slide 15"},{"id":43,"type":"single","stem":"A patient is being ventilated with a transport circuit that permits rebreathing if fresh gas flow is inadequate. Which strategy from the lecture is safest for Mapleson B/C systems?","options":["Prevention of mounting the wrong gas cylinder","Reduce flow below minute ventilation to conserve oxygen","Close the APL valve completely","Run high fresh gas flow within the required multiple of minute ventilation"],"answer":[3],"explanation":"The lecture recommends high flow for Mapleson B/C because they require approximately 1.5–2.5 times minute ventilation.","citation":"Anesthesia Workstation Hazards, Slide 21"},{"id":44,"type":"single","stem":"A machine check is delegated to an anesthesia technician. What responsibility remains with the anesthesia provider according to the lecture?","options":["Confirm that the machine check was actually completed","Leave the reserve cylinder open to prove the check occurred","Bypass the circuit leak test if the technician signed the room sheet","Assume delegation eliminates the need to verify readiness"],"answer":[0],"explanation":"The lecture explicitly says to confirm the morning machine check was actually completed even when delegated.","citation":"Anesthesia Workstation Hazards, Slide 19"},{"id":45,"type":"select-2","stem":"Which TWO breathing-system assembly errors from the lecture can contribute to hypercarbia? (Select 2)","options":["Increase electrocautery output to test the isolated power system","Equipment grounded in the OR","Hoses connected to incorrect outlets or inlets","Apply negative pressure to the low-pressure system","Place the reservoir bag between the patient and unidirectional valves","Reservoir bag positioned incorrectly relative to inspiratory/expiratory valves"],"answer":[2,5],"explanation":"The lecture advises confirming hoses are on the correct outlets/inlets and that the reservoir bag is not incorrectly positioned in the valve pathway.","citation":"Anesthesia Workstation Hazards, Slide 20"},{"id":46,"type":"single","stem":"A provider sees a color change in the carbon dioxide absorbent during a case with rising carbon dioxide. Which interpretation is most appropriate based on the lecture?","options":["The color change confirms the absorbent is fresh","The change proves the ventilator is functioning normally","The absorbent may be exhausted and should be considered as a source of rebreathing","The change indicates pipeline oxygen contamination"],"answer":[2],"explanation":"The lecture specifically says to watch for the absorbent color change as a clue to exhaustion in hypercarbia troubleshooting.","citation":"Anesthesia Workstation Hazards, Slide 20"},{"id":47,"type":"single","stem":"A workstation power failure occurs during volatile anesthesia. The backup battery is expected to last roughly 40 minutes on this machine. What is the BEST planning principle?","options":["Transition to a sustainable alternative well before battery depletion","Charged backup battery","Use the full 40 minutes before preparing an alternative","Only the anesthesia workstation is ungrounded"],"answer":[0],"explanation":"The lecture emphasizes using the battery window to establish an alternative and having the patient safely covered before battery power is exhausted.","citation":"Anesthesia Workstation Hazards, Slide 32"},{"id":48,"type":"single","stem":"an operating-room fire has been extinguished. Which action is most appropriate for subsequent risk investigation?","options":["Discard the tube and drapes immediately","Clean and return the circuit to service","Preserve the ET tube, circuit, drapes, and other involved equipment","Document only if the patient sustained an injury"],"answer":[2],"explanation":"The lecture instructs providers to preserve the scene and equipment and follow institutional/regulatory reporting procedures.","citation":"Anesthesia Workstation Hazards, Slide 39"},{"id":49,"type":"single","stem":"During a room fire that cannot be extinguished promptly, which action becomes appropriate according to the lecture?","options":["Activate the fire alarm and consider evacuation","Continue the procedure until the battery fails","Leave all drapes on the patient during evacuation","Disable the leak alarm and proceed"],"answer":[0],"explanation":"The lecture notes that failure to extinguish the fire should prompt alarm activation and consideration of evacuation.","citation":"Anesthesia Workstation Hazards, Slide 38"},{"id":50,"type":"single","stem":"Which finding BEST distinguishes a cylinder-supply safety feature from a pipeline-supply safety feature?","options":["Both systems regulate cylinder pressure to 45 psi","DISS controls cylinders while PISS controls wall hoses","PISS uses pin positions at the cylinder yoke, whereas DISS uses gas-specific diameter/threading at pipeline connections","Cylinder transfilling through the yoke"],"answer":[2],"explanation":"PISS is the cylinder-yoke indexing system; DISS is the noninterchangeable pipeline connector system.","citation":"Anesthesia Workstation Hazards, Slides 6–7"},{"id":51,"type":"single","stem":"Wall O2 is 52 psi and cylinder O2 is regulated to 45 psi. Which source supplies the machine first?","options":["Whichever was opened last","Both equally","Pipeline O2","Cylinder O2"],"answer":[2],"explanation":"Pipeline pressure is intentionally higher, so the machine preferentially draws from the pipeline.","citation":"Anesthesia Workstation Hazards, Slide 4"},{"id":52,"type":"single","stem":"You need cylinder O2 because the hospital O2 supply is contaminated. What must you do?","options":["Increase cylinder pressure","Disconnect the pipeline","Open the APL valve","Close the cylinder"],"answer":[1],"explanation":"The pipeline must be disconnected or its higher pressure will remain the preferred source.","citation":"Anesthesia Workstation Hazards, Slide 4"},{"id":53,"type":"single","stem":"Why is the O2 cylinder closed after its pressure is checked?","options":["To preserve reserve O2 and reveal pipeline failure","To test the DISS fitting","To raise pipeline pressure","To prevent vaporizer back pressure"],"answer":[0],"explanation":"Closing the cylinder preserves the reserve and allows a pipeline failure to become apparent before the cylinder is depleted.","citation":"Anesthesia Workstation Hazards, Slide 4"},{"id":54,"type":"single","stem":"Which region is downstream of the first-stage regulator but upstream of the flow-control valves?","options":["Low-pressure system","High-pressure system","Intermediate-pressure system","Scavenging system"],"answer":[2],"explanation":"The intermediate-pressure system lies between the first-stage regulator and the flow-control valves.","citation":"Anesthesia Workstation Hazards, Slide 5"},{"id":55,"type":"single","stem":"Which region begins downstream of the flow-control valves?","options":["Cylinder-supply system","High-pressure system","Low-pressure system","Intermediate-pressure system"],"answer":[2],"explanation":"The lecture defines the low-pressure system as all components downstream of the flow-control valves.","citation":"Anesthesia Workstation Hazards, Slide 5"},{"id":56,"type":"single","stem":"A pipeline hose cannot fit the wrong gas inlet because of which system?","options":["APL","CGO","PISS","DISS"],"answer":[3],"explanation":"DISS uses gas-specific diameters and threading for pipeline connections.","citation":"Anesthesia Workstation Hazards, Slide 6"},{"id":57,"type":"single","stem":"Removing the index pins from a cylinder yoke creates what hazard?","options":["Pipeline cross-connection","Excessive scavenging","Wrong cylinder attachment","Vaporizer overfilling"],"answer":[2],"explanation":"Removing the pins bypasses PISS and can allow the wrong gas cylinder to be mounted.","citation":"Anesthesia Workstation Hazards, Slide 7"},{"id":58,"type":"single","stem":"A Bourdon gauge senses pressure by movement of what component?","options":["Tapered glass tube","Solenoid valve","Flexible reservoir bag","Coiled metal tube"],"answer":[3],"explanation":"Pressure straightens the coiled Bourdon tube and moves the gauge pointer.","citation":"Anesthesia Workstation Hazards, Slide 8"},{"id":59,"type":"single","stem":"Which hanger-yoke feature permits cylinder replacement while the machine remains in use?","options":["Pressure-relief valve","Oxygen analyzer","Unidirectional valve","Flow-control valve"],"answer":[2],"explanation":"The unidirectional valve reduces leakage from an empty yoke and permits cylinder replacement during use.","citation":"Anesthesia Workstation Hazards, Slide 9"},{"id":60,"type":"single","stem":"The pipeline is disconnected and the O2 cylinder is open. Gas is heard escaping from the pipeline inlet. Which failure best explains this?","options":["Pipeline inlet check valve stuck open","Cylinder yoke check valve stuck closed","First-stage regulator set above 55 psi","DISS fitting preventing reverse flow"],"answer":[0],"explanation":"With the pipeline absent, the inlet check valve should prevent cylinder gas from escaping backward through the pipeline connection. A stuck-open valve permits that loss.","citation":"Anesthesia Workstation Hazards, Slide 6"},{"id":61,"type":"single","stem":"Two O2 cylinders are mounted on a dual yoke. One is full and one is nearly empty. Which component limits transfilling from the full cylinder into the low-pressure cylinder?","options":["Yoke check valve","First-stage regulator","Flow-control valve","Common gas outlet check valve"],"answer":[0],"explanation":"The unidirectional check valve at each yoke limits reverse flow and transfilling between cylinders.","citation":"Anesthesia Workstation Hazards, Slide 9"},{"id":62,"type":"single","stem":"An O2 cylinder is opened during the morning check and then left open with normal pipeline pressure. Why is this unsafe?","options":["A later pipeline failure may be masked while the cylinder silently empties","Cylinder pressure will raise pipeline pressure above 55 psi","The proportioning system will disable N2O","The flowmeter will read cylinder pressure instead of flow"],"answer":[0],"explanation":"The cylinder should be checked and then closed. If left open, it can supply the machine during pipeline failure and be depleted before the provider recognizes the problem.","citation":"Anesthesia Workstation Hazards, Slide 4"},{"id":63,"type":"single","stem":"After hospital pipeline maintenance, the O2 pipeline gauge reads 52 psi, but the inspired O2 concentration falls despite 100% O2 selected. What is the FIRST corrective sequence?","options":["Open the O2 cylinder, disconnect the pipeline, then verify inspired O2","Increase O2 flow and wait for the fail-safe","Open the O2 cylinder but leave the pipeline connected","Close the cylinder and use the O2 flush repeatedly"],"answer":[0],"explanation":"Normal pressure does not exclude pipeline contamination. Because pipeline pressure exceeds regulated cylinder pressure, the contaminated pipeline must be disconnected so the cylinder becomes the source.","citation":"Anesthesia Workstation Hazards, Slide 4"},{"id":64,"type":"single","stem":"Pipeline O2 is 52 psi and the backup cylinder is open at a regulated 45 psi. Which source does the workstation preferentially use?","options":["Pipeline O2 because its pressure is higher","Cylinder O2 because it is physically closer","Both equally because the regulator equalizes them","Whichever source was opened first"],"answer":[0],"explanation":"Pipeline pressure is intentionally higher than regulated cylinder pressure, so the machine preferentially uses the pipeline while it remains pressurized.","citation":"Anesthesia Workstation Hazards, Slide 4"},{"id":65,"type":"single","stem":"A flowmeter is accurate at low flow but increasingly inaccurate at high flow after the wrong gas-specific tube is installed. Which property now matters most?","options":["Density","Viscosity","Critical temperature","Vapor pressure"],"answer":[0],"explanation":"High flow is predominantly turbulent, making density the important gas property. Low laminar flow is more dependent on viscosity.","citation":"Anesthesia Workstation Hazards, Slide 12"},{"id":66,"type":"multi","stem":"A leak develops in a flowmeter tube positioned upstream from O2. Which statements are correct? Select 2.","options":["Downstream O2 placement reduces the chance of a hypoxic mixture","The O2 analyzer remains necessary because the design is not fail-proof","The proportioning system detects every downstream leak","Moving O2 upstream would make the arrangement safer","The fail-safe closes whenever a flowmeter tube leaks","The leak cannot affect delivered gas composition"],"answer":[0,1],"explanation":"Placing O2 downstream protects against loss through an upstream tube leak, but only an O2 analyzer verifies the final delivered oxygen concentration.","citation":"Anesthesia Workstation Hazards, Slides 12–14"},{"id":67,"type":"single","stem":"O2 and N2O are mechanically proportioned, but another gas is added. The final mixture becomes hypoxic. Why did the proportioning system not prevent it?","options":["It links O2 and N2O flows rather than measuring final inspired O2","It functions only when cylinder O2 is used","It is bypassed whenever total flow exceeds 5 L/min","It responds only to common gas outlet pressure"],"answer":[0],"explanation":"The proportioning system governs the O2:N2O relationship. It does not directly measure final inspired oxygen and cannot prevent every hypoxic mixture involving other gases.","citation":"Anesthesia Workstation Hazards, Slide 14"},{"id":68,"type":"single","stem":"O2 supply pressure falls enough to activate the pressure-sensor shutoff. Which statement is most accurate?","options":["N2O is reduced or interrupted, but a safe final O2 concentration is not guaranteed","All fresh gas flow stops immediately","The device measures inspired O2 and adds O2 automatically","Air is shut off before N2O"],"answer":[0],"explanation":"The pressure-sensor shutoff responds to O2 supply pressure by reducing or stopping N2O. It does not analyze the final gas mixture.","citation":"Anesthesia Workstation Hazards, Slide 14"},{"id":69,"type":"single","stem":"A low-pressure leak test is attempted with positive pressure at the common gas outlet, but the workstation has an outlet check valve. Why can the test miss a leak?","options":["The check valve can block transmitted positive pressure, so negative-pressure testing is required","Positive pressure closes every vaporizer automatically","The test evaluates only the high-pressure system","The check valve vents test pressure into scavenging"],"answer":[0],"explanation":"With a common-gas-outlet check valve, positive pressure may not adequately test the upstream low-pressure system. The lecture specifies a negative-pressure test.","citation":"Anesthesia Workstation Hazards, Slide 15"},{"id":70,"type":"multi","stem":"Which common gas outlet fittings match the lecture? Select 2.","options":["15-mm female internal fitting","22-mm male external fitting","19-mm male scavenging fitting","30-mm female scavenging fitting","15-mm male internal fitting","22-mm female external fitting"],"answer":[0,1],"explanation":"The common gas outlet is 15 mm female internally and 22 mm male externally. The 19- and 30-mm fittings are associated with scavenging.","citation":"Anesthesia Workstation Hazards, Slide 15"},{"id":71,"type":"single","stem":"A provider is unfamiliar with a workstation, is rushing, and skips part of the pre-use check. Which interpretation best matches the lecture?","options":["Human factors can combine with equipment and system problems to produce an adverse event","Modern workstations make skipped checks clinically unimportant","Only technical failure counts as an equipment-related adverse event","The risk is limited to the induction period"],"answer":[0],"explanation":"The lecture emphasizes that adverse events are often multifactorial, combining human factors, system problems, and technical failures.","citation":"Anesthesia Workstation Hazards, Slides 16–18"},{"id":72,"type":"multi","stem":"Which conditions increase the chance that a provider-related error contributes to an equipment event? Select 3.","options":["Fatigue","Haste","Distraction","Downstream O2 placement","DISS indexing","A charged backup battery"],"answer":[0,1,2],"explanation":"Fatigue, haste, and inattention/distraction are specifically emphasized human contributors.","citation":"Anesthesia Workstation Hazards, Slide 18"},{"id":73,"type":"single","stem":"The machine repeatedly fails its breathing-circuit leak check. Connections appear secure. What is the most efficient next step emphasized in the lecture?","options":["Replace the breathing circuit and repeat the check","Increase pipeline pressure","Close the APL valve and begin the case","Open the backup O2 cylinder"],"answer":[0],"explanation":"Breathing-circuit leaks are common, and the lecture notes that swapping the circuit often resolves a persistent failed leak check.","citation":"Anesthesia Workstation Hazards, Slide 19"},{"id":74,"type":"single","stem":"After intubation, breath sounds and ETCO2 initially confirm placement. ETCO2 then rises steadily and the patient is apneic. What should be checked FIRST?","options":["Whether the ventilator was actually started","Whether the vaporizer was tipped","Whether the O2 cylinder is full","Whether the Bovie return pad is attached"],"answer":[0],"explanation":"The lecture highlights failure to turn on the ventilator after intubation as a common delivery-system cause of hypercarbia.","citation":"Anesthesia Workstation Hazards, Slide 20"},{"id":75,"type":"multi","stem":"ETCO2 is rising and inspired CO2 is also above zero. Which equipment causes fit this pattern? Select 3.","options":["Exhausted CO2 absorbent","Incompetent unidirectional valve","Added apparatus dead space","Isolated pipeline O2 failure","Poor electrosurgical pad contact","A fully charged battery"],"answer":[0,1,2],"explanation":"Rebreathing and apparatus dead space can cause delivery-system hypercarbia. Exhausted absorbent and incompetent valves are classic rebreathing causes.","citation":"Anesthesia Workstation Hazards, Slide 20"},{"id":76,"type":"single","stem":"A spontaneously breathing patient has a minute ventilation of 10 L/min on a Mapleson A circuit. Which fresh gas flow meets the lecture's minimum?","options":["7 L/min","5 L/min","10 L/min","15 L/min"],"answer":[0],"explanation":"For spontaneous ventilation with Mapleson A, the lecture gives a minimum FGF of about 0.7 × minute ventilation: 7 L/min.","citation":"Anesthesia Workstation Hazards, Slide 21"},{"id":77,"type":"single","stem":"A Mapleson B/C circuit is used with minute ventilation 8 L/min. Which fresh gas flow range best limits rebreathing?","options":["12–20 L/min","5.6–8 L/min","4–6 L/min","24–32 L/min"],"answer":[0],"explanation":"The lecture gives approximately 1.5–2.5 × minute ventilation for Mapleson B/C systems: 12–20 L/min here.","citation":"Anesthesia Workstation Hazards, Slide 21"},{"id":78,"type":"single","stem":"A new breathing circuit passes visual inspection, but no gas reaches the patient. The tubing is not kinked. What overlooked setup error should be checked next?","options":["Plastic packaging left across a connector","A fully charged backup battery","The cylinder color code","The electrosurgical return pad"],"answer":[0],"explanation":"The lecture specifically warns that leftover plastic wrap can occlude a breathing-circuit connector.","citation":"Anesthesia Workstation Hazards, Slide 22"},{"id":79,"type":"single","stem":"Immediately after switching from manual ventilation, circuit pressure becomes dangerously high. Which setup error is most consistent with the lecture?","options":["APL valve left closed","O2 cylinder left closed","CGO check valve present","Scavenger reservoir bag partially filled"],"answer":[0],"explanation":"An APL valve left closed after induction can produce excessive breathing-system pressure.","citation":"Anesthesia Workstation Hazards, Slide 23"},{"id":80,"type":"single","stem":"During neck surgery, delivered tidal volume suddenly falls while the airway is hidden under drapes. What should be checked immediately?","options":["ETT and breathing-circuit connections","Cylinder pin index","Vaporizer fill port","Electrosurgical grounding pad"],"answer":[0],"explanation":"The lecture highlights hidden circuit or ETT disconnection during neck surgery because drapes obscure the airway connections.","citation":"Anesthesia Workstation Hazards, Slide 23"},{"id":81,"type":"single","stem":"A vaporizer was moved between rooms and briefly tipped. Soon after induction, agent concentration is unexpectedly high. What is the best explanation?","options":["Tipping altered vaporizer delivery and can cause excessive agent output","The DISS connection changed vaporizer pressure","The O2 proportioner increased agent concentration","The scavenger pulled liquid agent into the circuit"],"answer":[0],"explanation":"The lecture warns that tipping a vaporizer can increase anesthetic delivery.","citation":"Anesthesia Workstation Hazards, Slide 24"},{"id":82,"type":"single","stem":"Main electrical power fails. The workstation reports about 40 minutes of battery remaining. What should that number mean clinically?","options":["A limited window to establish a safe alternative plan, not permission to continue unchanged","All workstation functions are guaranteed for exactly 40 minutes","Gas delivery will stop immediately despite the battery","The ventilator is guaranteed to outlast every monitor"],"answer":[0],"explanation":"Typical battery duration is limited and machine-specific. The lecture frames it as time to prepare alternative ventilation and anesthetic delivery.","citation":"Anesthesia Workstation Hazards, Slides 25, 32"},{"id":83,"type":"single","stem":"Two workstation models both have charged batteries, but one loses its ventilator during a power failure. What lesson from the lecture explains the difference?","options":["Providers must know which specific functions each machine supports on battery","Battery power depends on pipeline pressure","DISS configuration determines battery-supported functions","The common gas outlet controls electrical backup"],"answer":[0],"explanation":"Battery-supported monitors, alarms, and ventilator functions vary by workstation, so the provider must know the specific machine.","citation":"Anesthesia Workstation Hazards, Slide 25"},{"id":84,"type":"single","stem":"A device draws 2 A from a 120-V source. What electrical power is being used?","options":["240 W","60 W","122 W","240 J"],"answer":[0],"explanation":"Power equals voltage × current: 120 V × 2 A = 240 W.","citation":"Anesthesia Workstation Hazards, Slide 26"},{"id":85,"type":"single","stem":"A 240-W device runs for 10 seconds. Which expression gives the energy used?","options":["240 W × 10 s","240 W ÷ 10 s","120 V ÷ 2 A","2 A × 10 s only"],"answer":[0],"explanation":"Electrical energy equals power multiplied by time.","citation":"Anesthesia Workstation Hazards, Slide 26"},{"id":86,"type":"single","stem":"Why is 60-Hz AC particularly relevant to electrical injury in the OR?","options":["Less AC than DC is required to provoke ventricular fibrillation","AC cannot pass through capacitive pathways","DC causes fibrillation at roughly one-third the current of AC","AC eliminates impedance from tissue"],"answer":[0],"explanation":"The lecture notes that approximately three times more DC than AC is required to cause ventricular fibrillation.","citation":"Anesthesia Workstation Hazards, Slide 27"},{"id":87,"type":"single","stem":"In an AC circuit, resistance alone does not describe opposition to current because capacitance and inductance also contribute. What is the combined quantity?","options":["Impedance","Conductance","Capacitance","Power"],"answer":[0],"explanation":"Impedance is the total opposition to AC current and includes resistance, capacitance, and inductance.","citation":"Anesthesia Workstation Hazards, Slide 27"},{"id":88,"type":"single","stem":"A capacitor is connected to a DC source and becomes charged. What happens next if no discharge path exists?","options":["Current falls after the brief charging period","Current rises continuously","The plates become direct conductors","The insulator converts DC to AC"],"answer":[0],"explanation":"A capacitor stores charge on two conductors separated by an insulator. With DC, current flows briefly during charging and then stops without a discharge path.","citation":"Anesthesia Workstation Hazards, Slide 28"},{"id":89,"type":"single","stem":"Which configuration distinguishes OR electrical distribution from typical grounded household power in this lecture?","options":["Ungrounded OR power with grounded equipment","Grounded OR power with ungrounded equipment","Both power and equipment intentionally ungrounded","Both configured exactly like household power"],"answer":[0],"explanation":"The lecture contrasts grounded household power with an ungrounded OR power system while equipment remains grounded.","citation":"Anesthesia Workstation Hazards, Slides 29–30"},{"id":90,"type":"single","stem":"The electrosurgical return pad lifts partially from the patient's skin during cautery. What complication becomes more likely?","options":["Thermal burn at the reduced contact area","Hypoxic mixture","Hypercarbia from added dead space","Cylinder transfilling"],"answer":[0],"explanation":"Reduced return-pad contact concentrates current density and increases burn risk.","citation":"Anesthesia Workstation Hazards, Slide 31"},{"id":91,"type":"multi","stem":"Wall power fails and the workstation is running on battery. Which preparations should occur before battery depletion? Select 2.","options":["Set up an independent ventilation option such as a Mapleson circuit","Prepare an IV anesthetic technique if volatile delivery becomes unavailable","Increase dependence on electrically powered accessories","Leave the case unchanged until the battery alarm stops","Close the backup O2 cylinder","Disable alarms to conserve power"],"answer":[0,1],"explanation":"The lecture recommends using the battery interval to establish alternative ventilation and an IV anesthetic plan before electrical support is lost.","citation":"Anesthesia Workstation Hazards, Slide 32"},{"id":92,"type":"multi","stem":"During airway surgery, which items represent the three sides of the fire triangle? Select 3.","options":["Electrocautery","Supplemental O2","Surgical drapes","Scavenging suction","CO2 absorbent","ECG electrodes"],"answer":[0,1,2],"explanation":"Electrocautery is an ignition source, oxygen is an oxidizer, and drapes are fuel.","citation":"Anesthesia Workstation Hazards, Slide 33"},{"id":93,"type":"single","stem":"Open O2 is being delivered during facial surgery and cautery is about to be used. Which change most directly reduces fire risk?","options":["Use the lowest tolerated FiO2 and prevent O2 pooling under drapes","Increase O2 flow immediately before cautery","Seal the drapes around the cannula","Drape before alcohol-based prep is fully dry"],"answer":[0],"explanation":"The lecture recommends the lowest tolerated FiO2, avoiding oxygen accumulation, and allowing prep to dry before draping.","citation":"Anesthesia Workstation Hazards, Slide 35"},{"id":94,"type":"single","stem":"A pop and flash are followed by smoke during airway surgery. What should the team assume until proven otherwise?","options":["An operating-room fire","Normal cautery artifact","Pipeline crossover","Vaporizer malfunction"],"answer":[0],"explanation":"Pop, flash, and smoke are warning signs of fire and require immediate action.","citation":"Anesthesia Workstation Hazards, Slide 36"},{"id":95,"type":"single","stem":"Flame is seen in the endotracheal tube during airway surgery. Which actions should occur simultaneously?","options":["Remove the ETT and stop gas flow","Increase O2 and remove the drapes","Close the APL valve and continue ventilation","Disconnect scavenging and increase fresh gas flow"],"answer":[0],"explanation":"The lecture's current teaching is to remove the burning tube and stop gas flow simultaneously.","citation":"Anesthesia Workstation Hazards, Slide 36"},{"id":96,"type":"single","stem":"After an airway fire is extinguished and burning material is removed, what is the next priority?","options":["Mask ventilate and assess the airway for reintubation or surgical airway","Restart cautery to confirm the source","Discard the ETT and circuit immediately","Increase N2O to reduce FiO2"],"answer":[0],"explanation":"After extinguishing the fire, the lecture directs mask ventilation and airway assessment, including possible reintubation or emergency tracheostomy.","citation":"Anesthesia Workstation Hazards, Slide 36"},{"id":97,"type":"single","stem":"A surgical drape ignites on the patient's chest, with no evidence of an airway fire. What is the FIRST response?","options":["Stop gases and remove burning drapes/material","Continue ventilation while the surgeon finishes cautery","Leave the drapes in place and assess the airway first","Increase O2 while saline is obtained"],"answer":[0],"explanation":"For fire on the patient, the lecture begins with stopping gases and removing the drapes or other burning material.","citation":"Anesthesia Workstation Hazards, Slide 37"},{"id":98,"type":"single","stem":"A fire occurs despite the team identifying the extinguisher during timeout. Which additional action may be required if the room itself is unsafe?","options":["Activate the fire response and consider evacuation","Continue the case until the battery fails","Close the scavenger and increase O2","Discard all involved equipment before leaving"],"answer":[0],"explanation":"The circulating nurse can activate the fire alarm, and an actual room fire may require evacuation.","citation":"Anesthesia Workstation Hazards, Slide 38"},{"id":99,"type":"multi","stem":"After an OR fire is controlled, which actions are appropriate? Select 2.","options":["Notify risk management/follow reporting procedures","Preserve the ETT, circuit, drapes, and involved equipment","Discard damaged items before they contaminate the room","Restart the case before documenting the event","Clean the scene before anyone inspects it","Return involved equipment to service immediately"],"answer":[0,1],"explanation":"The lecture emphasizes formal reporting and preservation of all involved equipment and materials for review.","citation":"Anesthesia Workstation Hazards, Slide 39"},{"id":100,"type":"single","stem":"A provider skips the machine check because another clinician used the workstation earlier. Later a disconnected hose causes hypoxemia. Which prevention principle best fits the lecture?","options":["Confirm the pre-use machine check was completed rather than assuming it","Rely on the O2 proportioner to detect disconnected hoses","Leave the backup cylinder open throughout every case","Use pulse oximetry as the substitute for equipment checks"],"answer":[0],"explanation":"The lecture emphasizes confirming the machine check was completed even when tasks are delegated or the machine was previously used.","citation":"Anesthesia Workstation Hazards, Slide 19"}];
const STORE='SRNA_HAZARDS_BANK_1_2026_V2';MBUHazardsStandardEngine.start({questions:QUESTIONS,store:STORE,bankKey:"h1",setNumber:1});</script><script src="../assets/calculator.js?v=62"></script><!-- MBU_BUILD:2026-09-24-hazards-review-retry-v2 --><script src="../assets/auto-update.js?v=62"></script></body></html>

ut, staff typically point out the fire extinguisher location, and some teams confirm bovie use, pad placement, and fire-risk precautions out loud. Preparation also includes training, drills, and assigning each person a task.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 34 (PDF p. 17)"], "concept": "Time-out fire preparation", "carry": false}, {"id": "HZ47", "num": 96, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "Besides adequate fresh gas flow, what design requirement does the lecture give for the Mapleson A tubing?", "c": ["Fitted with a unidirectional valve at the patient end", "Short enough that the bag attaches right at the mask", "Long enough that exhaled CO2 doesn't reach the reservoir bag", "Shorter than the patient's anatomic dead space volume"], "a": [2], "exp": "For Mapleson A: FGF at least 0.7 x minute ventilation, AND the hose between the patient and reservoir bag must be long enough that exhaled CO2 doesn't reach the bag.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 21 (PDF p. 11)"], "concept": "Mapleson A tubing length", "carry": false}, {"id": "HZ71", "num": 97, "lec": "Hazards & safety", "lk": "haz", "type": "multi", "n": 3, "q": "Which are fire-prevention measures listed in the lecture? Select 3.", "c": ["Tuck drapes tightly around the face during MAC", "Use N2O in place of O2 to lower flammability", "Configure drapes to avoid buildup of oxidizer", "Moisten gauze and sponges near the ignition source", "Let prep solutions pool so they stay moist", "Avoid N2O"], "a": [2, 3, 5], "exp": "Prevention: let flammable skin prep dry before draping, configure drapes to avoid oxidizer buildup, keep O2 as low as clinically possible, avoid N2O, notify the surgeon when oxidizer and ignition are close, and moisten gauze near the ignition source. N2O is an oxidizer, and tucking drapes traps O2.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 35 (PDF p. 18)"], "concept": "Fire prevention measures", "carry": false}, {"id": "HZ43", "num": 98, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "Some machines have an outlet check valve and a pressure relief valve near the common gas outlet. What do they protect?", "c": ["The scavenger, from excessive suction at the interface", "The patient's lungs, from O2 flush pressure surges", "The hospital pipeline, from backflow of anesthetic gas", "The vaporizers, from excess pressure during a downstream obstruction"], "a": [3], "exp": "The check valve and pressure relief valve prevent buildup of excessive pressure within the vaporizers in the event of a downstream obstruction.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 15 (PDF p. 8)"], "concept": "Outlet check and relief valves", "carry": false}, {"id": "HZ82", "num": 99, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "During facial surgery under MAC, the patient has O2 by nasal cannula and the surgeon is about to use cautery near the face. What does the lecture emphasize?", "c": ["Switch the cannula to N2O to lower the O2 concentration", "Tuck the drapes tightly around the face to contain the O2", "Keep FiO2 as low as tolerated and tell the surgeon where O2 flows", "Increase O2 flow to create a protective O2 layer"], "a": [2], "exp": "Be especially cautious with open O2 delivery near the airway: keep FiO2 as low as clinically possible, avoid N2O (also an oxidizer), configure drapes so oxidizer doesn't build up, and notify the surgeon when oxidizer and ignition source are close.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 35 (PDF p. 18)"], "concept": "Open O2 near the airway", "carry": false}, {"id": "HZ60", "num": 100, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "Per the lecture audio, why can't anesthesia complications be analyzed as isolated OR events?", "c": ["They can trace through pre-op, PACU, post-op, and the floor", "They're never reported outside the operating room", "Their causes are always found in the anesthesia equipment", "They occur only during induction and emergence phases"], "a": [0], "exp": "A complication often isn't isolated to the OR; it can trace through pre-op, PACU, post-op, and the floor. That, plus rarity and limited risk-management training, makes anesthesia risk harder to study.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 16 (PDF p. 8)"], "concept": "Complications beyond the OR", "carry": false}];

const KEY="hazards_practice3_progress_2026_V2";
const L="ABCDEF";
let S=load();let timer=null;let view=S.view||"quiz";
function fresh(){return{idx:0,ans:{},xo:{},prac:null,view:"quiz"}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&typeof o.idx==="number")return o}}catch(e){}return fresh()}
function save(){try{S.view=view;localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const byId=Object.fromEntries(BANK.map(q=>[q.id,q]));
const $=s=>document.querySelector(s);
function same(a,b){return a.length===b.length&&[...a].sort().join()===[...b].sort().join()}
function stats(){const v=BANK.map(q=>S.ans[q.id]).filter(Boolean),correct=v.filter(x=>x.ok).length,done=v.length,m=missed().length;
 $("#stats").innerHTML=`Completed <b>${done}</b> / ${BANK.length} · Score <b>${done?Math.round(100*correct/done):0}%</b> · Missed <b>${m}</b>`;
 $("#prog").style.width=(100*done/BANK.length)+"%";
 $("#bRev").textContent=`Review Missed${m?` (${m})`:``}`;$("#bRev").disabled=!m}
function missed(){return BANK.filter(q=>S.ans[q.id]&&!S.ans[q.id].ok)}
let cur={sel:[],done:false};
function ctx(){if(view==="prac"&&S.prac)return{list:S.prac.list,i:S.prac.i,store:S.prac.ans,mode:"prac"};return{list:BANK.map(q=>q.id),i:S.idx,store:S.ans,mode:"main"}}
function quizNavHTML(c){return `<div class="mbu-quiz-nav hidden" id="mbuQuizNav">${c.list.map((id,i)=>{const r=c.store[id],q=byId[id],cl=[i===c.i?"cur":"",r?(r.ok?"good":"bad"):"",window.MBUStudio&&MBUStudio.flagged('h3',q)?"flag":""].filter(Boolean).join(" ");return `<button type="button" class="${cl}" data-qnav="${i}">${i+1}</button>`}).join("")}</div>`}
function bindQuizNav(c){document.querySelectorAll("[data-qnav]").forEach(b=>b.onclick=()=>{const i=+b.dataset.qnav;if(c.mode==="prac")S.prac.i=i;else S.idx=i;save();render()})}
function prevQuestion(){const c=ctx();if(c.i<=0)return;if(c.mode==="prac")S.prac.i--;else S.idx--;save();render();window.scrollTo(0,0)}
function resetQuestion(){const c=ctx(),q=byId[c.list[c.i]];if(!q)return;delete c.store[q.id];delete S.xo[q.id];cur={sel:[],done:false};save();render()}
function goHazardsHome(){location.href="hazards.html"}
function questionChrome(active){
 const h=document.querySelector(".wrap>header"),b=document.querySelector(".wrap>.bar");
 if(h)h.classList.toggle("hidden",!!active);
 if(b)b.classList.toggle("hidden",!!active);
}
function render(){clearTimeout(timer);stats();
 if(view==="review"){questionChrome(false);return renderReview()}
 if(view==="summary"){questionChrome(false);return renderSummary()}
 const c=ctx();
 if(c.i>=c.list.length){questionChrome(false);if(c.mode==="prac")return renderPracDone();view="summary";save();return renderSummary()}
 questionChrome(true);const q=byId[c.list[c.i]],prev=c.store[q.id];
 cur={sel:prev?prev.sel.slice():[],done:!!prev};
 const xo=S.xo[q.id]||[],answered=BANK.map(x=>S.ans[x.id]).filter(Boolean),correct=answered.filter(x=>x.ok).length,miss=missed().length;
 const badge=c.mode==="prac"?"MISSED QUESTIONS REVIEW":"PRACTICE SET 3";
 let h=`<div class="panel"><div class="header"><div class="row"><span class="badge">${badge}</span><button class="btn out" id="qFlag" type="button">☆ Flag</button><button class="btn out" id="qReport" type="button">Report</button><button class="btn out" id="qNav" type="button">Navigator</button><button class="btn out mbu-return" id="qHome" type="button">← Hazards Home</button></div><div class="progress">${c.mode==="main"?`Question ${c.i+1} of ${BANK.length} · Q${q.num}`:`Question ${c.i+1} of ${c.list.length} · Original Q${q.num}`}</div></div>
 <div class="stats"><div>Completed: <strong>${answered.length}</strong>/${BANK.length}</div><div>Score: <strong>${answered.length?Math.round(100*correct/answered.length):0}</strong>%</div><div>Missed: <strong>${miss}</strong></div></div>
 ${quizNavHTML(c)}<div class="type">${q.type==="multi"?`Select ${q.n} Options`:"Single Best Answer"}</div>
 <p class="stem">${esc(q.q)}</p>`;
 if(q.img)h+=`<div class="fig"><img src="data:image/png;base64,${IMGS[q.img]}" alt="Figure for question ${q.num}"><small>Click image to enlarge</small></div>`;
 h+=`<div id="choices">`;
 q.c.forEach((t,i)=>{h+=`<div class="ch"><button class="opt${cur.sel.includes(i)?" sel":""}${xo.includes(i)?" x":""}" data-i="${i}"><span class="L">${L[i]}.</span><span class="t">${esc(t)}</span></button><button class="xo" data-x="${i}" aria-pressed="${xo.includes(i)}" title="Cross out (Shift+${L[i]})" aria-label="Cross out ${L[i]}">✕</button></div>`});
 h+=`</div><div class="row" style="display:flex;margin:4px 0 18px;justify-content:flex-end"><button class="btn" id="go">Submit Answer</button></div><div id="fb"></div>
 <div class="controls"><button class="btn out" id="qPrev" type="button">Previous</button><div class="row"><button class="btn out" id="qReset" type="button">Reset</button><button class="btn" id="qNext" type="button">Next</button></div></div></div>`;
 $("#main").innerHTML=h;
 document.querySelectorAll(".opt").forEach(b=>{b.onclick=()=>pick(q,+b.dataset.i);b.oncontextmenu=e=>{e.preventDefault();cross(q,+b.dataset.i)}});
 document.querySelectorAll(".xo").forEach(b=>b.onclick=()=>cross(q,+b.dataset.x));
 const im=document.querySelector(".fig img");if(im)im.onclick=()=>{$("#lb img").src=im.src;$("#lb").classList.add("on")};
 $("#go").onclick=()=>cur.done?next():submit(q);
 const qFlag=$("#qFlag");qFlag.textContent=window.MBUStudio&&MBUStudio.flagged('h3',q)?"★ Flagged":"☆ Flag";
 qFlag.onclick=()=>{if(!window.MBUStudio)return;MBUStudio.toggleFlag('h3',q);qFlag.textContent=MBUStudio.flagged('h3',q)?"★ Flagged":"☆ Flag";render()};
 $("#qReport").onclick=()=>window.MBUStudio&&MBUStudio.report('h3',q);
 $("#qNav").onclick=()=>$("#mbuQuizNav").classList.toggle("hidden");
 $("#qHome").onclick=goHazardsHome;$("#qPrev").onclick=prevQuestion;$("#qReset").onclick=resetQuestion;$("#qNext").onclick=next;
 $("#qPrev").disabled=c.i<=0;$("#qNext").disabled=c.i>=c.list.length-1;
 bindQuizNav(c);window.MBUCalculator?.besideFlag();
 if(prev)showResult(q,prev,true);else upd(q)}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function pick(q,i){if(cur.done)return;const s=cur.sel;
 if(q.type==="single"){cur.sel=[i]}else{const k=s.indexOf(i);if(k>=0)s.splice(k,1);else if(s.length<q.n)s.push(i);else{s.shift();s.push(i)}}
 document.querySelectorAll(".opt").forEach(b=>b.classList.toggle("sel",cur.sel.includes(+b.dataset.i)));upd(q)}
function cross(q,i){if(cur.done)return;const a=S.xo[q.id]=S.xo[q.id]||[];const k=a.indexOf(i);k>=0?a.splice(k,1):a.push(i);save();
 const b=document.querySelector(`.opt[data-i="${i}"]`);b.classList.toggle("x",a.includes(i));document.querySelector(`.xo[data-x="${i}"]`).setAttribute("aria-pressed",a.includes(i))}
function upd(q){const need=q.type==="multi"?q.n:1;const g=$("#go");g.style.display="";g.disabled=cur.sel.length!==need;g.textContent="Submit Answer";
 if(q.type==="multi")$("#hint").textContent=`${cur.sel.length} of ${q.n} selected. Keys: A–F select, Shift+letter cross out, Enter submit`}
function submit(q){const need=q.type==="multi"?q.n:1;if(cur.sel.length!==need||cur.done)return;
 const ok=same(cur.sel,q.a);const c=ctx();const rec={sel:cur.sel.slice(),ok};c.store[q.id]=rec;save();window.MBUStudio?.answer?.('h3',q,ok);stats();showResult(q,rec,false)}
function showResult(q,rec,restored){cur.done=true;
 document.querySelectorAll(".opt").forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.remove("sel");
  if(q.a.includes(i))b.classList.add(rec.sel.includes(i)?"ok":"miss");else if(rec.sel.includes(i))b.classList.add("no")});
 document.querySelectorAll(".xo").forEach(b=>b.disabled=true);
 const src=`<p class="src">Source: ${q.ref.map(esc).join("; ")}</p>`;
 const g=$("#go");g.style.display="none";
 if(rec.ok){$("#fb").innerHTML=`<div class="fb good"><p><b>Correct.</b> ${esc(q.exp)}</p>${src}</div>`;g.textContent="Next";g.disabled=false;
  if(!restored)timer=setTimeout(next,350)}
 else{const ks=q.a.map(i=>L[i]);const keys=ks.length<3?ks.join(" and "):ks.slice(0,-1).join(", ")+", and "+ks[ks.length-1];
  $("#fb").innerHTML=`<div class="fb badf"><p><b>Incorrect.</b> Correct answer: ${keys}.</p><p>${esc(q.exp)}</p>${q.disc?`<p class="disc"><b>Lecture discrepancy:</b> ${esc(q.disc)}</p>`:""}${q.supp?`<p class="disc"><b>Beyond the slide:</b> ${esc(q.supp)}</p>`:""}${src}</div>`;g.textContent="Next";g.disabled=false;g.focus()}}
function next(){clearTimeout(timer);if(view==="prac"&&S.prac){S.prac.i++}else{S.idx++}save();render();window.scrollTo(0,0)}
function renderSummary(){const v=BANK.filter(q=>S.ans[q.id]);const c=v.filter(q=>S.ans[q.id].ok).length;
 const by={};BANK.forEach(q=>{by[q.lec]=by[q.lec]||{t:0,a:0,c:0};by[q.lec].t++;if(S.ans[q.id]){by[q.lec].a++;if(S.ans[q.id].ok)by[q.lec].c++}});
 const m=missed();
 let h=`<div class="card"><h2>Hazards & safety complete</h2><p>Score: <b>${c} / ${v.length}</b> (${v.length?Math.round(100*c/v.length):0}%)</p>
 <table><tr><th>Lecture</th><th>Questions</th><th>Correct</th><th>%</th></tr>${Object.entries(by).map(([k,o])=>`<tr><td>${k}</td><td>${o.t}</td><td>${o.c}</td><td>${o.a?Math.round(100*o.c/o.a):0}%</td></tr>`).join("")}</table>`;
 if(m.length){h+=`<h2 style="margin-top:16px">Missed concepts</h2><ul class="concepts">${m.map(q=>`<li>${esc(q.concept)} <span class="pill">${q.lec}</span></li>`).join("")}</ul>
 <div class="act"><button class="primary" id="bP">Practice missed questions (${m.length})</button><button class="ghost" id="bR2">Missed review</button></div>`}
 else h+=`<p>No missed questions.</p>`;
 h+=`</div>`;$("#main").innerHTML=h;
 if(m.length){$("#bP").onclick=startPrac;$("#bR2").onclick=()=>{view="review";save();render()}}}
function startPrac(){const m=missed().map(q=>q.id);S.prac={list:m,i:0,ans:{}};view="prac";save();render()}
function renderPracDone(){const p=S.prac;const c=Object.values(p.ans).filter(x=>x.ok).length;
 $("#main").innerHTML=`<div class="card"><h2>Practice round done</h2><p>${c} / ${p.list.length} correct on retry. Your score is unchanged.</p><div class="act"><button class="primary" id="bB">Back to summary</button><button class="ghost" id="bA">Practice missed again</button></div></div>`;
 $("#bB").onclick=()=>{S.prac=null;view=S.idx>=BANK.length?"summary":"quiz";save();render()};$("#bA").onclick=startPrac}
function renderReview(){const m=missed();
 let h=`<div class="card"><h2>Missed-question review (${m.length})</h2><p class="hint">Green = keyed answer. Red = your incorrect choice. Dashed green = a correct choice you didn't pick.</p>
 <div class="act" style="margin-bottom:12px"><button class="primary" id="bBack">Back</button>${m.length?`<button class="ghost" id="bP2">Practice these</button>`:""}</div>`;
 m.forEach(q=>{const r=S.ans[q.id];h+=`<div class="rv"><p class="stem">Q${q.num}. ${esc(q.q)}</p>${q.img?`<div class="fig"><img src="data:image/png;base64,${IMGS[q.img]}" alt=""></div>`:""}`;
  q.c.forEach((t,i)=>{let cl=q.a.includes(i)?(r.sel.includes(i)?"ok":"miss"):(r.sel.includes(i)?"no":"");h+=`<div class="ch"><div class="opt ${cl}"><span class="L">${L[i]}</span><span class="t">${esc(t)}</span></div></div>`});
  h+=`<div class="fb badf"><p>${esc(q.exp)}</p>${q.disc?`<p class="disc"><b>Lecture discrepancy:</b> ${esc(q.disc)}</p>`:""}${q.supp?`<p class="disc"><b>Beyond the slide:</b> ${esc(q.supp)}</p>`:""}<p class="src">Source: ${q.ref.map(esc).join("; ")}</p></div></div>`});
 if(!m.length)h+=`<p>No missed questions yet.</p>`;
 h+=`</div>`;$("#main").innerHTML=h;
 document.querySelectorAll(".rv .fig img").forEach(im=>im.onclick=()=>{$("#lb img").src=im.src;$("#lb").classList.add("on")});
 $("#bBack").onclick=goHazardsHome;
 if(m.length)$("#bP2").onclick=startPrac}
$("#bRev").onclick=()=>{view="review";save();render()};
$("#bReset").onclick=()=>{if(confirm("Reset all Hazards & safety progress? This clears your answers and score.")){S=fresh();view="quiz";save();render()}};
$("#lb").onclick=()=>$("#lb").classList.remove("on");
document.addEventListener("keydown",e=>{if($("#lb").classList.contains("on")){if(e.key==="Escape")$("#lb").classList.remove("on");return}
 if(!(view==="quiz"||view==="prac"))return;const c=ctx();if(c.i>=c.list.length)return;const q=byId[c.list[c.i]];
 if(e.key==="Enter"){e.preventDefault();cur.done?next():submit(q);return}
 let k=e.key.toUpperCase();if(/^[1-6]$/.test(k))k=L[+k-1];const i=L.indexOf(k);
 if(i>=0&&i<q.c.length&&k.length===1){e.preventDefault();e.shiftKey?cross(q,i):pick(q,i)}});
if(new URLSearchParams(location.search).get('review')==='1'){view='review';save()}render();
</script><script src="../assets/site-nav.js?v=18" data-page="haz3"></script>
<script src="../assets/calculator.js?v=18"></script><script>window.MBUCalculator?.besideFlag()</script>
<script src="../assets/auto-update.js?v=18"></script>
</body></html>

<style>
:root{--paper:#edf2f7;--sheet:#fff;--ink:#2d3748;--mute:#718096;--rule:#cbd5e0;--o2:#22543d;--o2bg:#c6f6d5;--bad:#742a2a;--badbg:#fed7d7;--n2o:#1a365d;--sel:#ebf8ff;--air:#b7791f;--wagd:#7B3F8C}
@media (prefers-color-scheme:dark){:root{--paper:#0F1719;--sheet:#172226;--ink:#E4ECEA;--mute:#9AAAB0;--rule:#2A3A3F;--o2:#4CC08A;--o2bg:#12301F;--bad:#F2877D;--badbg:#3A1714;--n2o:#7FA6EE;--sel:#1C2B45}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.card{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;box-shadow:0 4px 12px #00000012;padding:28px}
.qmeta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--mute);margin-bottom:6px}

.opt{flex:1;display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--sheet);color:var(--ink);border:1.5px solid var(--rule);padding:8px 12px;line-height:1.35}

<script>
const BANK=[{"id": "HZ32", "num": 1, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "Agent dosage errors are rare with modern equipment. Which practice does the lecture say increases the risk?", "c": ["Filling vaporizers with the key fill system", "Keeping vaporizers mounted on one machine", "Frequently moving vaporizers between machines", "Using only one vaporizer at a time"], "a": [2], "exp": "Dosage and administration errors (liquid agent in fresh gas piping, dial design, incorrect filling, simultaneous vaporizers) are rare, largely because equipment is well designed. The risk rises when vaporizers are moved frequently, since a tipped vaporizer can increase the dose.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 24 (PDF p. 12)"], "concept": "Moving vaporizers", "carry": false}, {"id": "HZ48", "num": 2, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "A spontaneously breathing patient is transported on a Mapleson C. Compared with controlled ventilation on the same circuit, what is the added problem?", "c": ["The APL must be closed", "The patient does more work of breathing to overcome rebreathing", "FGF requirements fall to 0.7 x MV", "The patient can't rebreathe during spontaneous breathing"], "a": [1], "exp": "Mapleson B and C always permit rebreathing. To prevent hypercarbia, FGF of 1.5-2.5 x MV is used and the patient must hyperventilate; if spontaneously breathing, metabolic work increases. Controlled ventilation avoids that because the patient isn't doing the work. Instructor note: spontaneously breathing = Mapleson A.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 21 (PDF p. 11)"], "concept": "Spontaneous breathing on Mapleson C", "carry": false}, {"id": "HZ63", "num": 3, "lec": "Hazards & safety", "lk": "haz", "type": "multi", "n": 3, "q": "Which circle system arrangements must be avoided to prevent rebreathing? Select 3.", "c": ["Reservoir bag between the patient and either unidirectional valve", "Absorber in the inspiratory limb on the bag side", "Fresh gas inlet between the patient and the expiratory valve", "APL valve on the expiratory side near the bag", "Fresh gas inlet on the inspiratory side downstream of the absorber", "APL valve between the patient and the inspiratory valve"], "a": [0, 2, 5], "exp": "The three arrangements to avoid: fresh gas inlet between patient and expiratory valve; APL between patient and inspiratory valve; reservoir bag between patient and either valve. The absorber in the inspiratory limb on the bag side is the standard placement.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 20 (PDF p. 10)"], "concept": "Forbidden circle arrangements", "carry": false}, {"id": "HZ86", "num": 4, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "The lecture says grounding refers to two separate concepts that 'are not mutually exclusive.' What are they?", "c": ["Grounding of electrical power and grounding of electrical equipment", "Grounding of the patient and grounding of the provider", "Grounding of AC and grounding of DC", "Grounding of the ESU and grounding of the monitors"], "a": [0], "exp": "Grounding applies to the power (grounded or ungrounded) and to the equipment (grounded or ungrounded). Power can energize devices that are themselves grounded or not. At home, power is grounded; in the OR, power is ungrounded while equipment is grounded.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 29 (PDF p. 15)"], "concept": "Two meanings of grounding", "carry": false}, {"id": "HZ38", "num": 5, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "A technician removes the pins from an O2 hanger yoke so a cylinder with a damaged valve will fit. What is the main danger?", "c": ["The cylinder can no longer form a gas-tight seal", "A wrong-gas cylinder could be mounted, risking a hypoxic mixture", "The first-stage regulator will pass full cylinder pressure", "The yoke check valve will no longer seat properly"], "a": [1], "exp": "PISS can be bypassed by removing the pins, which the lecture calls out as not recommended because it could result in hypoxic gas mixtures. The pins are what stop a wrong cylinder from fitting.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 7 (PDF p. 4)"], "concept": "Bypassing PISS", "carry": false}, {"id": "HZ41", "num": 6, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "How do electronically controlled flow controllers vary gas flow?", "c": ["A bimetallic strip adjusts the orifice", "A needle valve is turned by hand", "A glass tube and float measure the flow", "A variable-position solenoid sets the orifice size"], "a": [3], "exp": "Electronic flow controllers are still variable-orifice devices, but the orifice size is controlled by a variable-position solenoid, with settings made through a computer interface on the workstation.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 12 (PDF p. 6)"], "concept": "Electronic flow controllers", "carry": false}, {"id": "HZ12", "num": 7, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "After intubation, breath sounds and ETCO2 were confirmed. Ten minutes later, ETCO2 has risen steadily, there's no chest rise, and the bag hangs empty. What is the MOST likely cause?", "c": ["Exhausted CO2 absorbent", "Increased apparatus dead space", "An incompetent expiratory valve", "The ventilator was never turned on"], "a": [3], "exp": "The lecture's most common hypercarbia cause: intubating, confirming breath sounds and ETCO2, then forgetting to turn the ventilator on, so the patient isn't breathing. No chest rise with rising CO2 points to apnea, not rebreathing.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 20 (PDF p. 10)"], "concept": "Most common hypercarbia cause", "carry": false}, {"id": "HZ37", "num": 8, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "A cylinder valve has a single pin-index hole in position 7. Which gas does the lecture's chart assign to it?", "c": ["Medical air", "Nitrous oxide", "Carbon dioxide", "Entonox"], "a": [3], "exp": "From the PISS chart: oxygen 2,5; nitrous oxide 3,5; air 1,5; carbon dioxide 1,6; Entonox (50% N2O / 50% O2) uses the single position 7.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 7 (PDF p. 4)"], "concept": "PISS: Entonox", "carry": false}, {"id": "HZ51", "num": 9, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "What does impedance (Z) include that simple resistance doesn't?", "c": ["Voltage and current", "Power and energy", "Only resistance at high voltage", "Capacitance and inductance"], "a": [3], "exp": "Impedance is the sum of the forces opposing electron movement in an AC circuit: resistance plus capacitance and inductance. For AC circuits, Ohm's law becomes E = I x Z.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 27 (PDF p. 14)"], "concept": "Impedance", "carry": false}, {"id": "HZ04", "num": 10, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "A cylinder valve has pin-index holes at positions 1 and 6. Per the lecture's PISS chart, which gas does it hold?", "c": ["Entonox", "Medical air", "Oxygen", "Carbon dioxide"], "a": [3], "exp": "The chart on slide 7: oxygen 2,5; nitrous oxide 3,5; air 1,5; carbon dioxide 1,6; Entonox 7. Air shares position 1 but pairs it with 5.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 7 (PDF p. 4)"], "concept": "PISS: carbon dioxide", "carry": false}, {"id": "HZ31", "num": 11, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "After induction, the patient is breathing spontaneously, and circuit pressure keeps climbing with each breath. What is the most common cause according to the lecture?", "c": ["The absorbent is exhausted", "The ventilator is running at too high a rate", "The O2 flowmeter is off", "The APL valve was left closed after induction"], "a": [3], "exp": "High breathing-system pressure during spontaneous ventilation can come from an APL that's partly or fully closed (often left closed after induction), kinked tubing to the scavenging interface, or a failed interface positive-pressure relief valve.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 23 (PDF p. 12)"], "concept": "APL left closed", "carry": false}, {"id": "HZ88", "num": 12, "lec": "Hazards & safety", "lk": "haz", "type": "multi", "n": 2, "q": "Which describe the anesthesia machine's main power supply, per the lecture? Select 2.", "c": ["90-130 V", "Radiofrequency current at 500 kHz", "Ungrounded equipment chassis", "Alternating current at 50-60 Hz", "A battery that lasts about 8 hours", "220-240 V direct current"], "a": [0, 3], "exp": "The power cord uses 90-130 V at 50-60 Hz alternating current. The backup battery lasts about 40 minutes (some 1-2 hours), radiofrequency is the ESU, and OR equipment is grounded.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 25 (PDF p. 13)"], "concept": "Machine power supply", "carry": false}, {"id": "HZ77", "num": 13, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "A fire starts on the patient's drapes. Which sequence matches the lecture's response?", "c": ["Assess the patient, turn off gases, extinguish, remove drapes", "Remove drapes, assess the patient, turn off gases, extinguish", "Turn off gases, remove drapes and burning materials, extinguish, assess the patient", "Extinguish, assess the patient, remove drapes, turn off gases"], "a": [2], "exp": "Fire on the patient: turn off gases, remove drapes and burning materials, extinguish flames with water, saline, or an extinguisher, then assess the patient's status, devise a care plan, and assess for smoke inhalation.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 37 (PDF p. 19)"], "concept": "Fire on the patient", "carry": false}, {"id": "HZI5", "num": 14, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "During an airway fire, the ETT is pulled and gases are stopped at the same moment. Which numbered elements of the fire triangle do these two actions remove?", "c": ["Elements 2 and 3", "Element 1 only", "Elements 1 and 2", "Element 2 only"], "a": [0], "exp": "Element 2 is the oxidizer (O2, controlled by anesthesia), removed by stopping gases. Element 3 is fuel, and the lecture lists tracheal tubes as fuel, so pulling the tube removes it. Element 1 is the ignition source (the surgeon's cautery or laser).", "disc": null, "supp": null, "img": "hz_fire", "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slides 33, 36 (PDF p. 17, 18)"], "concept": "Airway fire and the triangle", "carry": false}, {"id": "HZ06", "num": 15, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "Heliox and O2 are running, and N2O is then added. Why can the patient still receive a hypoxic mixture despite a working proportioning system?", "c": ["The proportioning system only links N2O and O2, not other gases", "The proportioning system shuts off when helium is detected", "Helium blocks the fail-safe valve", "The proportioning system only works below 2 L/min"], "a": [0], "exp": "The proportioning system functions only between N2O and O2. With helium or air also flowing, O2 can be a small share of the total; the lecture's example is heliox plus N2O dropping O2 below 21%.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 14 (PDF p. 7)"], "concept": "Proportioning limits with other gases", "carry": false}, {"id": "HZ18", "num": 16, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "In the OR fire triangle, which team member typically controls each element?", "c": ["Ignition: anesthesia; oxidizer: surgeon; fuel: nursing", "Ignition: nursing; oxidizer: anesthesia; fuel: surgeon", "Ignition: surgeon; oxidizer: nursing; fuel: anesthesia", "Ignition: surgeon; oxidizer: anesthesia; fuel: nursing"], "a": [3], "exp": "The ignition source is almost always the surgeon's cautery, lasers, or light cords; the oxidizer is controlled by anesthesia through the ETT, mask, or cannula; and fuel (drapes, gauze, prep) is labeled nursing, though fuel is everywhere. Instructor note: oxidizer (anesthesia) + ignition (surgeon) + fuel (anything).", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 33 (PDF p. 17)"], "concept": "Fire triangle roles", "carry": false}, {"id": "HZ39", "num": 17, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "Two O2 cylinders hang on a double yoke, one at 1900 psig and one at 800 psig, both open. What is transfilling?", "c": ["Gas flowing from the pipeline into the cylinders", "Liquid N2O moving into the O2 cylinder", "Gas flowing from the higher-pressure cylinder into the lower-pressure one", "Gas flowing from the machine back out an empty yoke"], "a": [2], "exp": "The lecture defines transfilling as gas flowing from a higher-pressure cylinder to a lower-pressure cylinder, which a double hanger yoke can allow. The unidirectional valve in each yoke limits leaking from an empty yoke and lets cylinders be changed during use.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 9 (PDF p. 5)"], "concept": "Transfilling", "carry": false}, {"id": "HZ89", "num": 18, "lec": "Hazards & safety", "lk": "haz", "type": "multi", "n": 2, "q": "Which electrical items should the machine check and your own preparation confirm? Select 2.", "c": ["That the ESU return pad is on the anesthesia machine", "That the vaporizers are electrically powered", "That the machine's power is grounded like a home outlet", "The backup battery is charged", "Which functions (monitors, alarms, ventilator) run on battery", "That the battery lasts at least 8 hours"], "a": [3, 4], "exp": "Instructor notes: make sure the battery is charged (machine check) and know what is powered by the battery; monitors, airway monitors, BP and HR, alarms, and the ventilator may or may not all share the same power source.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 25 (PDF p. 13)"], "concept": "Battery readiness", "carry": false}, {"id": "HZ20", "num": 19, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "With a constant 16 psi at the flow control valve inlet, what happens when the needle valve is opened further?", "c": ["Resistance rises, so flow decreases", "Pressure rises, so flow increases", "Flow stays constant, because inlet pressure is fixed", "Resistance falls, so flow increases"], "a": [3], "exp": "Flow = pressure / resistance. Opening the valve (turning left) enlarges the orifice and decreases resistance, so flow rises; the instructor notes 'Ohm's law can be proven true once again.'", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slides 5, 13 (PDF p. 3, 7)"], "concept": "Needle valve and resistance", "carry": false}, {"id": "HZ61", "num": 20, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "During a closed-system (very low-flow) anesthetic, SpO2 slowly falls. The circuit has no leaks, and the O2 analyzer shows FiO2 steadily dropping. Which highlighted hazard fits?", "c": ["Disconnected O2 hose at the wall outlet", "Closed-system anesthesia with inadequate fresh O2 supply", "Incompetent circuit unidirectional valves", "Crossed hospital O2 and N2O pipelines upstream"], "a": [1], "exp": "With very low flow, O2 added must at least match what the patient consumes; otherwise circuit O2 falls. That's a highlighted item on slide 19. Crossed pipelines would drop FiO2 regardless of flow, and a disconnected hose triggers supply alarms.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 19 (PDF p. 10)"], "concept": "Inadequate fresh O2 in closed system", "carry": false}, {"id": "HZ87", "num": 21, "lec": "Hazards & safety", "lk": "haz", "type": "multi", "n": 2, "q": "Which statements about current types are correct? Select 2.", "c": ["DC is harmless because it flows in one direction", "For DC circuits, Ohm's law is written E = I x Z", "Impedance applies only to DC circuits", "AC reverses direction at regular intervals", "AC flows in one direction only", "About three times as much DC as AC is needed to cause V-fib"], "a": [3, 5], "exp": "DC flows in one direction; AC reverses at regular intervals. It takes about three times as much DC as AC to cause V-fib, which doesn't make DC harmless. Impedance applies to AC, where E = I x Z.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 27 (PDF p. 14)"], "concept": "AC vs DC facts", "carry": false}, {"id": "HZ50", "num": 22, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "During neck surgery with the drape over the face, the low exhaled volume alarm sounds. What does the lecture say is especially common here?", "c": ["Ventilator malfunction from a failed bellows", "Disconnection at the ETT connection under the drape", "Absorbent exhaustion from high fresh gas flow", "Vaporizer tipping as the table is rotated"], "a": [1], "exp": "Circuit leaks and disconnections are especially common with neck surgery when the drape covers the face and the ET tube connection comes loose.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 23 (PDF p. 12)"], "concept": "Disconnection under drapes", "carry": false}, {"id": "HZ78", "num": 23, "lec": "Hazards & safety", "lk": "haz", "type": "multi", "n": 3, "q": "A fire isn't going out with initial measures. Which steps does the lecture list? Select 3.", "c": ["Increase FiO2 to protect the patient", "Continue the procedure until the fire department arrives", "Use a CO2 fire extinguisher", "Activate the fire alarm", "Reopen the room door to check on the fire", "Turn off the medical gas supply to the room"], "a": [2, 3, 5], "exp": "Failure to extinguish: use a CO2 fire extinguisher, activate the fire alarm, consider evacuating the room (close the door and don't reopen it), and turn off the medical gas supply to the room.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 38 (PDF p. 19)"], "concept": "Failure to extinguish", "carry": false}, {"id": "HZ22", "num": 24, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "A cylinder regulator has an inlet gauge and an outlet gauge. Which one changes as the cylinder empties?", "c": ["Both, equally", "The outlet gauge", "The inlet gauge", "Neither, because the regulator holds both steady"], "a": [2], "exp": "The regulator converts variable high-pressure input (0 to about 2200 psi) into a constant lower output (about 45 psi). The inlet gauge tracks cylinder pressure and falls as it empties; the outlet stays constant. This was the instructor's question on slide 10.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 10 (PDF p. 5)"], "concept": "Regulator gauges", "carry": false}, {"id": "HZ56", "num": 25, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "Why can't an air pipeline hose be connected to the machine's O2 inlet?", "c": ["The O2 inlet uses the pin-index system to reject air", "The fail-safe valve blocks air from entering the O2 line", "Each DISS fitting differs in nut size, thread, and internal inlet", "Air and O2 hoses differ only in their color coding"], "a": [2], "exp": "DISS gives each gas a different diameter inlet and threading; not only is the external nut differently sized and threaded, but internally the inlets are different and non-interchangeable. Color helps, but the physical fit prevents misconnection.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 6 (PDF p. 3)"], "concept": "DISS non-interchangeability", "carry": false}, {"id": "HZ23", "num": 26, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "On some older anesthesia machines, the O2 flow control knob can't be turned completely off. Why?", "c": ["To guarantee a minimal O2 flow", "To keep the fail-safe valve open", "To allow the flush valve to work", "To prevent needle valve damage"], "a": [0], "exp": "In some older machines, O2 can't be completely turned off at the control knob, allowing a minimal O2 flow as a safety feature.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 12 (PDF p. 6)"], "concept": "Minimum O2 flow", "carry": false}, {"id": "HZ07", "num": 27, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "A proposed common gas outlet adapter uses a 30 mm conical fitting. Why doesn't it meet workstation standards?", "c": ["Only 15 mm external fittings are allowed", "19 and 30 mm conical fittings are reserved for the scavenging system", "The standard requires a 22 mm internal diameter", "30 mm is too small for the breathing circuit"], "a": [1], "exp": "The standard allows one common gas outlet with a 15 mm internal (female) diameter and a 22 mm external (male) diameter. It can't have a 19 or 30 mm conical fitting because those sizes are specific to scavenging, which prevents misconnection.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 15 (PDF p. 8)"], "concept": "CGO fitting standards", "carry": false}, {"id": "HZ21", "num": 28, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "On a double-yoke machine where both O2 cylinders share one gauge, one cylinder is empty and the other full. What does the gauge show?", "c": ["The average of the two cylinder pressures", "Only the empty cylinder's pressure, near zero", "A single pressure that can't tell the two cylinders apart", "Two separate pressures on a split dial face"], "a": [2], "exp": "On a single-cylinder system the gauge is upstream of the check valve and shows that cylinder's pressure. In a two-cylinder system the shared gauge location means you can't differentiate the individual cylinder pressures.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 7 (PDF p. 4)"], "concept": "Shared yoke gauge", "carry": false}, {"id": "HZ54", "num": 29, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "A mixture of 50% O2 and 50% N2O is used near an ignition source. How does the lecture rate its fire risk?", "c": ["It suppresses combustion, since N2O isn't an oxidizer", "It supports combustion about as avidly as 100% O2", "It's no riskier than room air", "It supports combustion about half as much as 100% O2"], "a": [1], "exp": "O2 and N2O function equally well as oxidizers, so a 50% O2 / 50% N2O combination would support combustion about as avidly as 100% oxygen. That's why the prevention list says to avoid N2O.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 33 (PDF p. 17)"], "concept": "N2O as oxidizer", "carry": false}, {"id": "HZI4", "num": 30, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "Circuits 2 and 3 in the figure share which feature?", "c": ["Fresh gas enters near the patient; they need 1.5-2.5 x MV", "Fresh gas enters at the bag, so they need only 0.7 x MV", "They're designed for spontaneous breathing only", "They contain unidirectional valves and a CO2 absorber"], "a": [0], "exp": "Circuits 2 and 3 are Mapleson B and C: fresh gas enters near the patient end, and exhaled gas is directed into a blind pouch, so they always permit rebreathing and need FGF of 1.5-2.5 x MV. Controlled ventilation avoids the extra work for a spontaneously breathing patient.", "disc": null, "supp": null, "img": "hz_mapleson", "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 21 (PDF p. 11)"], "concept": "Mapleson B and C design", "carry": false}, {"id": "HZ62", "num": 31, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "A long elbow extension is added between the Y-piece and the ETT for positioning. ETCO2 slowly rises. What is the mechanism?", "c": ["Increased apparatus dead space", "Circuit leak", "Incompetent unidirectional valves", "Exhausted absorbent"], "a": [0], "exp": "Tubing extensions between the Y-piece and patient add apparatus dead space, a delivery-system cause of hypercarbia on slide 20. Exhausted absorbent and bad valves cause rebreathing through the circle; a leak lowers exhaled volume.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 20 (PDF p. 10)"], "concept": "Apparatus dead space", "carry": false}, {"id": "HZ09", "num": 32, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "Which pair of figures does the lecture give for gas delivery equipment problems?", "c": ["15 of about 6,000 claims; event incidence estimated at 0.02%", "115 of about 60,000 claims; event incidence estimated at 2-4%", "1,150 of about 6,000 claims; event incidence estimated at 19%", "115 of about 6,000 closed claims; event incidence estimated at 0.23-0.4%"], "a": [3], "exp": "The ASA closed claims database recorded 115 cases related to gas delivery equipment out of roughly 6,000 claims, and the incidence of such events has been estimated at 0.23-0.4%. Most adverse events are multifactorial, with human error responsible for the majority.", "disc": "The lecture audio links the two numbers ('115 of about 6,000, about 0.23-0.4%'), but 115 of 6,000 is about 1.9% of claims. The written notes present 0.23-0.4% as the estimated event incidence, a separate figure.", "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 17 (PDF p. 9)"], "concept": "Closed claims figures", "carry": false}, {"id": "HZ76", "num": 33, "lec": "Hazards & safety", "lk": "haz", "type": "multi", "n": 3, "q": "Which are the early warning signs of a surgical fire listed in the lecture? Select 3.", "c": ["A fall in SpO2", "A sudden rise in ETCO2", "A rise in peak airway pressure", "A pop", "A flash", "Smoke"], "a": [3, 4, 5], "exp": "Look for early warning signs of fire: a pop, a flash, or smoke. Then stop the procedure, and each team member immediately carries out their assigned task. The monitor changes listed aren't the lecture's fire warning signs.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 36 (PDF p. 18)"], "concept": "Fire warning signs", "carry": false}, {"id": "HZ42", "num": 34, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "Why is the O2 flow control knob larger in diameter with bigger ridges than the N2O and air knobs?", "c": ["To meet DISS requirements", "To allow a tactile safety check in addition to color", "To make O2 flow easier to fine-tune", "To withstand higher O2 pipeline pressure"], "a": [1], "exp": "Knobs are color coded (O2 green in the US) and touch coded, so a provider gets both a visual and a tactile check. The instructor's aviation comparison: someone somewhere once gave a hypoxic mixture by turning the wrong knob.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 13 (PDF p. 7)"], "concept": "Tactile O2 knob", "carry": false}, {"id": "HZ34", "num": 35, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "How does the current needed to cause ventricular fibrillation compare between DC and AC?", "c": ["About three times more AC than DC is needed", "They're equal", "About three times more DC than AC is needed", "DC can't cause ventricular fibrillation"], "a": [2], "exp": "It takes about three times as much DC as AC to cause V-fib, but that doesn't make DC harmless. AC reverses direction at regular intervals, and AC circuits add impedance (E = I x Z).", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 27 (PDF p. 14)"], "concept": "DC vs AC and V-fib", "carry": false}, {"id": "HZ83", "num": 36, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "An alcohol-based skin prep has pooled under the patient's flank just before draping. What is the correct action?", "c": ["Use cautery on the lowest setting", "Drape immediately so the prep stays sterile", "Let the prep dry fully before draping and using cautery", "Cover the pool with a dry towel and proceed"], "a": [2], "exp": "Flammable prep solutions such as alcohol and acetone can ignite when the ESU is used. The lecture's prevention list starts with allowing flammable skin preparations to dry before draping.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slides 31, 35 (PDF p. 16, 18)"], "concept": "Flammable prep", "carry": false}, {"id": "HZ30", "num": 37, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "A Mapleson C is used with a minute ventilation of 5 L/min. What fresh gas flow range does the lecture recommend to prevent rebreathing?", "c": ["3.5-5 L/min", "5-7.5 L/min", "7.5-12.5 L/min", "12.5-20 L/min"], "a": [2], "exp": "Mapleson B and C always permit rebreathing through their blind-pouch design and need FGF of 1.5-2.5 x minute ventilation: 1.5 x 5 = 7.5 and 2.5 x 5 = 12.5 L/min. 3.5 L/min is the 0.7 x MV Mapleson A value.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 21 (PDF p. 11)"], "concept": "Mapleson C FGF calculation", "carry": false}, {"id": "HZ90", "num": 38, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "Per the lecture audio, which aggravating factors are becoming increasingly common causes of adverse events?", "c": ["Equipment failures from aging anesthesia machines", "Inattention and distraction, often from phones or conversation", "Inexperience among senior, long-practicing providers", "Failure of hospital pipeline supply systems"], "a": [1], "exp": "Inattention and distraction are increasingly common causes, often from phone use or getting pulled into conversation with the surgical team. Haste is another major factor, and fatigue affects nearly everyone.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 18 (PDF p. 9)"], "concept": "Inattention and distraction", "carry": false}, {"id": "HZI2", "num": 39, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "On these unlabeled valves, which numbered valve has the pin-index holes that fit a nitrous oxide yoke (positions 3 and 5)?", "c": ["Valve 1", "Valve 2", "Valve 3", "Valve 4"], "a": [1], "exp": "Positions 3 and 5 are adjacent, so the N2O valve has its two holes close together, as on valve 2. O2 (2,5), air (1,5), and CO2 (1,6) have holes spaced farther apart.", "disc": null, "supp": null, "img": "hz_piss", "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 7 (PDF p. 4)"], "concept": "Reading PISS: nitrous oxide", "carry": false}, {"id": "HZ73", "num": 40, "lec": "Hazards & safety", "lk": "haz", "type": "multi", "n": 2, "q": "Total power is lost and the battery is exhausted. Which vaporizers can still deliver agent? Select 2.", "c": ["GE Aladin desflurane cassette", "GE Aladin sevoflurane cassette", "Variable bypass sevoflurane vaporizer", "Tec 6 desflurane vaporizer", "Drager D-Vapor desflurane vaporizer", "Variable bypass isoflurane vaporizer"], "a": [2, 5], "exp": "Once the battery is exhausted, only basic functions remain, including emergency O2 usable with a conventional mechanical (variable bypass) vaporizer. Desflurane vaporizers (Tec 6, D-Vapor) and electronic vaporizers like the GE Aladin can't deliver agent without electrical power.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 32 (PDF p. 16)"], "concept": "Vaporizers without power", "carry": false}, {"id": "HZ55", "num": 41, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "How many common gas outlets does the anesthesia workstation standard allow?", "c": ["One per vaporizer", "One", "Two, one for each breathing system", "As many as the manufacturer chooses"], "a": [1], "exp": "The standard requires only one common gas outlet, with a 15 mm internal and 22 mm external diameter; 19 and 30 mm conical fittings are reserved for scavenging.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 15 (PDF p. 8)"], "concept": "Single CGO", "carry": false}, {"id": "HZ91", "num": 42, "lec": "Hazards & safety", "lk": "haz", "type": "multi", "n": 3, "q": "Which are HYPERCARBIA hazards on the lecture's delivery-system list (as opposed to hypoxemia hazards)? Select 3.", "c": ["Exhausted CO2 absorbent or channeling", "Crossed hospital pipelines", "Closed O2 cylinder valve", "O2 flowmeter turned off", "Increased apparatus dead space", "Incorrectly assembled circle system"], "a": [0, 4, 5], "exp": "Hypercarbia hazards: apnea, increased apparatus dead space, missing or incompetent unidirectional valves, incorrectly assembled circle, exhausted absorbent or channeling, and inadequate FGF without absorption. A closed O2 cylinder, crossed pipelines, and a flowmeter left off are hypoxemia hazards on slide 19.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slides 19, 20 (PDF p. 10)"], "concept": "Hypercarbia vs hypoxemia hazards", "carry": false}, {"id": "HZ10", "num": 43, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "Running behind schedule, a new provider extubates a patient who isn't adequately awake. Which aggravating factor from the lecture does this illustrate?", "c": ["Failure to check equipment", "Fatigue", "Haste", "Lack of familiarity with equipment"], "a": [2], "exp": "The instructor's example of haste is exactly this: time pressure, especially early in a career, leading to errors like extubating before a patient is adequately awake. The other listed factors are failure to check equipment, unfamiliarity, inexperience, inattention, distraction, and fatigue.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 18 (PDF p. 9)"], "concept": "Haste as an aggravating factor", "carry": false}, {"id": "HZ92", "num": 44, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "A device draws 10 A from a 120 V source. Using Ohm's law, what is its resistance?", "c": ["1.2 ohms", "12 ohms", "130 ohms", "1,200 ohms"], "a": [1], "exp": "E = I x R, so R = E / I = 120 V / 10 A = 12 ohms. 1,200 would come from multiplying instead of dividing.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 26 (PDF p. 13)"], "concept": "Ohm's law calculation", "carry": false}, {"id": "HZ81", "num": 45, "lec": "Hazards & safety", "lk": "haz", "type": "multi", "n": 3, "q": "Which are IGNITION sources in the OR, per the lecture? Select 3.", "c": ["Nitrous oxide in the circuit", "Paper surgical drapes", "Lasers", "Electrosurgical unit", "Oxygen at high FiO2", "Ends of fiberoptic light cords"], "a": [2, 3, 5], "exp": "Ignition sources: the ESU, lasers, and the ends of fiberoptic light cords. O2 and N2O are oxidizers, and drapes are fuel.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 33 (PDF p. 17)"], "concept": "Ignition sources", "carry": false}, {"id": "HZ58", "num": 46, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "On an older machine with a chain linking the O2 and N2O valves, O2 is turned down below 25% of total flow. What happens?", "c": ["N2O flow decreases too", "O2 flow is automatically raised to 50%", "An alarm sounds but flows are unchanged", "The fail-safe valve closes"], "a": [0], "exp": "In older machines, the linkage was a mechanical chain between the O2 and N2O valves (14 and 28 teeth on the gears). If O2 is turned below 25% of total flow, N2O flow decreases as well. Modern machines do this electronically.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 14 (PDF p. 7)"], "concept": "Mechanical proportioning chain", "carry": false}, {"id": "HZ15", "num": 47, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "During a power failure, about how long does a typical anesthesia machine backup battery last?", "c": ["About 40 minutes", "Indefinitely, while alarms are muted", "About 5 minutes", "About 8 hours"], "a": [0], "exp": "The backup battery usually provides power for approximately 40 minutes (some machines 1-2 hours). Know exactly what runs on battery alone (monitors, alarms, ventilator), and confirm it's charged on the machine check.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 25 (PDF p. 13)"], "concept": "Backup battery duration", "carry": false}, {"id": "HZ45", "num": 48, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "The morning machine check was delegated to an anesthesia tech. What does the lecture advise before starting the first case?", "c": ["Skip it, since delegation makes it the tech's responsibility", "Check only the O2 cylinder pressure", "Confirm the check was actually completed", "Repeat only the vaporizer check"], "a": [2], "exp": "Most hypoxemia hazards trace back to an incomplete or skipped machine check. The lecture says to confirm the morning check was actually completed, especially when it's delegated to a tech.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 19 (PDF p. 10)"], "concept": "Verifying a delegated check", "carry": false}, {"id": "HZ16", "num": 49, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "In the lecture's analogy between Ohm's law (E = I x R) and hemodynamics (BP = CO x SVR), which pairing is correct?", "c": ["Voltage = BP; current = SVR; resistance = cardiac output", "Voltage = SVR; current = cardiac output; resistance = BP", "Voltage = cardiac output; current = BP; resistance = SVR", "Voltage = BP; current = cardiac output; resistance = SVR"], "a": [3], "exp": "E = I x R maps onto BP = CO x SVR: voltage corresponds to blood pressure, current to cardiac output, and resistance to systemic vascular resistance.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 26 (PDF p. 13)"], "concept": "Ohm's law analogy", "carry": false}, {"id": "HZI6", "num": 50, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "On this slide, the highlighted hypoxemia hazards share what feature, according to the instructor's notes?", "c": ["They're usually picked up on the machine check", "They can only be detected by pulse oximetry", "They're all caused by pipeline failures", "They all originate upstream of the workstation"], "a": [0], "exp": "The instructor's note: highlighted things are usually picked up on the machine check (crossed hoses, disconnected hose, failed backup O2, empty or closed cylinder, bad valves, circuit leak, inadequate fresh O2, inadequate ventilation). The upstream items (liquid reservoir, crossed hospital pipelines, closed pipeline valves) aren't highlighted.", "disc": null, "supp": null, "img": "hz_hypox", "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 19 (PDF p. 10)"], "concept": "Hazards caught by the machine check", "carry": false}, {"id": "HZ74", "num": 51, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "Mid-case, the machine switches to battery after a building power failure. What is the best use of the battery window?", "c": ["Wait for the low-battery alarm before changing anything", "Turn off the monitors to save battery for the ventilator", "Switch to desflurane, since it's independent of power", "Set up a Mapleson for ventilation and a TIVA infusion now"], "a": [3], "exp": "The battery buys roughly 40 minutes to 2 hours. The lecture says to use that window to set up alternatives, like a Mapleson for ventilation and an IV infusion such as propofol, so the patient is safely covered well before the battery runs out (generally within about an hour). Des vaporizers need power.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slides 25, 32 (PDF p. 13, 16)"], "concept": "Using the battery window", "carry": false}, {"id": "HZ28", "num": 52, "lec": "Hazards & safety", "lk": "haz", "type": "multi", "n": 3, "q": "Which hypoxemia hazards originate upstream of the workstation? Select 3.", "c": ["Closed pipeline valves", "Disconnected O2 hose in the OR", "Incompetent circuit unidirectional valves", "Liquid O2 reservoir empty or filled with nitrogen", "Crossed hospital pipelines", "Empty O2 cylinder on the machine"], "a": [0, 3, 4], "exp": "The slide lists these under 'upstream of the workstation': the liquid O2 reservoir, crossed hospital pipelines, and closed pipeline valves. An empty machine cylinder, a disconnected OR hose, and incompetent valves are at the workstation or circuit (and are among the highlighted items a machine check usually catches).", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 19 (PDF p. 10)"], "concept": "Upstream hypoxemia hazards", "carry": false}, {"id": "HZ84", "num": 53, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "After a case using an isolated ESU, the patient has a burn under the return pad, which had partly lifted. What explains this?", "c": ["The pad was placed too close to the surgical site", "The isolated ESU leaked standard 60 Hz current to the pad", "The ECG pads were placed too close to the return pad", "Poor pad contact concentrated the current; isolation doesn't prevent it"], "a": [3], "exp": "The return electrode disperses current over a large area. If the pad doesn't make proper contact, current concentrates and can burn. Although the isolated ESU adds safety, it's no foolproof protection against burns from an improperly applied pad. Placing the pad close to the site is recommended.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 31 (PDF p. 16)"], "concept": "Return pad burn", "carry": false}, {"id": "HZ93", "num": 54, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "A device draws 5 A at 120 V for 10 seconds. How much energy does it use?", "c": ["60 joules", "600 joules", "6,000 joules", "60,000 joules"], "a": [2], "exp": "Power P = E x I = 120 V x 5 A = 600 watts. Energy = watts x seconds = 600 x 10 = 6,000 joules (watt-seconds), the same unit used for defibrillator output. 600 is the power in watts, not the energy.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 26 (PDF p. 13)"], "concept": "Power and energy calculation", "carry": false}, {"id": "HZ13", "num": 55, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "A spontaneously breathing patient on a Mapleson A has a minute ventilation of 6 L/min. What is the minimum fresh gas flow per the lecture?", "c": ["About 2 L/min", "About 4.2 L/min", "About 9 L/min", "About 15 L/min"], "a": [1], "exp": "Mapleson A (Magill) is used with spontaneously breathing patients and needs FGF of at least 0.7 x minute ventilation: 0.7 x 6 = 4.2 L/min. 9-15 L/min is the 1.5-2.5 x MV range for Mapleson B and C.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 21 (PDF p. 11)"], "concept": "Mapleson A FGF calculation", "carry": false}, {"id": "HZ02", "num": 56, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "Why is pipeline O2 pressure (50-55 psi) deliberately set higher than the cylinder regulator output (40-45 psi)?", "c": ["So the machine draws from the pipeline and keeps the cylinder in reserve", "So the fail-safe can sense which source is in use", "So both sources mix to keep flow constant", "So the cylinder supplies the machine and the pipeline stays in reserve"], "a": [0], "exp": "The difference is deliberate: when both are connected, gas is preferentially drawn from the pipeline, leaving the cylinder as backup. That's also why the pipeline must be disconnected to use the cylinder when the pipeline supply is contaminated.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 4 (PDF p. 2)"], "concept": "Deliberate pressure difference", "carry": false}, {"id": "HZ65", "num": 57, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "During spontaneous ventilation, circuit pressure rises even though the APL is fully open. What else does the lecture list as a cause?", "c": ["Kinked tubing between the APL and scavenging interface", "A disconnected O2 hose", "An open negative-pressure relief valve", "High fresh gas flow with an open APL"], "a": [0], "exp": "High pressure during spontaneous ventilation can come from APL closure, kinking or occlusion of the tubing between the APL and scavenging interface, or malfunction of the interface's positive-pressure relief valve. Gas that can't leave through the APL backs up into the circuit.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 23 (PDF p. 12)"], "concept": "Kinked scavenger tubing", "carry": false}, {"id": "HZ36", "num": 58, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "An airway fire flashes in the ETT. What does current teaching say about removing the tube and stopping gas flow?", "c": ["Stop gases first, then remove the tube", "Pour saline first, then decide", "Do both simultaneously", "Remove the tube first, then stop gases"], "a": [2], "exp": "For an airway fire: simultaneously remove the tracheal tube and stop gases or disconnect the circuit, pour saline into the airway, remove burning material, then mask ventilate, assess injury, consider bronchoscopy, and reintubate.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 36 (PDF p. 18)"], "concept": "Airway fire: simultaneous steps", "carry": false}, {"id": "HZ49", "num": 59, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "On an older field machine, a freestanding PEEP valve is attached in the wrong position. Where does the lecture say it can cause obstruction?", "c": ["In the inspiratory limb of a circle system", "At the scavenging interface", "In the expiratory limb of a circle system", "At the common gas outlet"], "a": [0], "exp": "A freestanding PEEP valve may cause obstruction if it's incorrectly placed in the inspiratory limb. These valves are rarely used now since PEEP is built into most machines.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 22 (PDF p. 11)"], "concept": "Misplaced PEEP valve", "carry": false}, {"id": "HZ80", "num": 60, "lec": "Hazards & safety", "lk": "haz", "type": "multi", "n": 3, "q": "Which are fire PREPARATION steps, as opposed to response or aftermath steps? Select 3.", "c": ["Pour saline into the airway", "Assign each person a task in advance", "Practice responses with fire drills", "Preserve the scene for the risk manager", "Train personnel in OR fire management", "Turn off the medical gas supply to the room"], "a": [1, 2, 4], "exp": "Preparation: train personnel, practice fire drills, ensure equipment is available, identify high-risk situations, decide how to prevent and manage a fire, and assign each person a task. Turning off room gases is a failure-to-extinguish step, saline in the airway is airway fire management, and preserving the scene comes after.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slides 34, 36, 38, 39 (PDF p. 17, 18, 19, 20)"], "concept": "Fire preparation vs response", "carry": false}, {"id": "HZ68", "num": 61, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "A defibrillator delivers 200 joules. How is that energy expressed in the lecture's terms?", "c": ["200 watt-seconds", "200 volts", "200 amperes", "200 ohms"], "a": [0], "exp": "Power (watts) = voltage x current, and electrical work = watts x time. The watt-second (joule) is the unit for energy expended, which is how defibrillator discharge is measured.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 26 (PDF p. 13)"], "concept": "Joules as watt-seconds", "carry": false}, {"id": "HZ44", "num": 62, "lec": "Hazards & safety", "lk": "haz", "type": "multi", "n": 3, "q": "Which of these are aggravating factors in anesthesia adverse events, per the lecture? Select 3.", "c": ["Lack of familiarity with equipment", "Routine fire drills", "Failure to check equipment", "Redundant alarm systems", "Inattention", "Standardized connector sizes"], "a": [0, 2, 4], "exp": "The listed aggravating factors: failure to check equipment, lack of familiarity with equipment, inexperience, haste, inattention, distraction, and fatigue. Standardized connectors, redundant alarms, and fire drills are protective measures.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 18 (PDF p. 9)"], "concept": "Aggravating factors", "carry": false}, {"id": "HZ33", "num": 63, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "During a prolonged power failure, why does the machine cut all power when battery voltage falls below about 10 V?", "c": ["To prevent deep discharge of the battery", "To protect the O2 fail-safe valve", "To force the ventilator into manual mode", "To reset the circuit breakers"], "a": [0], "exp": "When battery voltage drops below about 10 V, all power to the machine ceases to prevent deep discharge. Failure of the battery stops the monitors, alarms, and ventilator, so plan an alternative well before that point.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 25 (PDF p. 13)"], "concept": "Battery cutoff", "carry": false}, {"id": "HZ05", "num": 64, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "A machine has two flowmeter tubes for O2 connected in series. What is the purpose of the first tube?", "c": ["Measurement of high flows only", "Calibration of the second tube", "Accurate measurement of low flows", "A backup if the second tube cracks"], "a": [2], "exp": "When two flowmeters are present, the first permits accurate measurement of low flows and the second measures higher flows. The Thorpe tube is tapered, narrower at the bottom, with a ball or bobbin float.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 12 (PDF p. 6)"], "concept": "Fine and coarse flowmeters", "carry": false}, {"id": "HZ53", "num": 65, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "ESU current (500 kHz to 1 MHz) can pass across the precordium. Why doesn't it cause ventricular fibrillation?", "c": ["OR power is ungrounded, which blocks cardiac current", "Its high frequency has low tissue penetration and doesn't excite heart cells", "The return pad blocks the current from reaching the chest", "The ESU uses DC, which needs three times more current"], "a": [1], "exp": "The ESU generates radiofrequency current that behaves differently from standard 60 Hz AC: it has low tissue penetration and doesn't excite contractile cells, so it can pass through the precordium without causing V-fib.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 31 (PDF p. 16)"], "concept": "Why ESU doesn't cause V-fib", "carry": false}, {"id": "HZI3", "num": 66, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "A spontaneously breathing patient needs transport, and you plan FGF of 0.7 x minute ventilation. Which numbered circuit is appropriate?", "c": ["Circuit 1", "Circuit 2", "Circuit 3", "Any of the three at that flow"], "a": [0], "exp": "Circuit 1 is the Mapleson A (Magill): fresh gas enters at the bag end, with the relief valve near the patient. It's the circuit for spontaneous breathing and needs FGF of at least 0.7 x MV. Circuits 2 and 3 are Mapleson B and C, which need 1.5-2.5 x MV.", "disc": null, "supp": null, "img": "hz_mapleson", "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 21 (PDF p. 11)"], "concept": "Identifying Mapleson A", "carry": false}, {"id": "HZ94", "num": 67, "lec": "Hazards & safety", "lk": "haz", "type": "multi", "n": 3, "q": "Which belong in an OR's contingency plan for a prolonged power failure during a desflurane anesthetic? Select 3.", "c": ["A Mapleson system for ventilation", "Waiting for the low-battery alarm before acting", "Relying on the Tec 6 vaporizer while on battery", "Having the plan in place well before the battery runs out", "Switching to an Aladin cassette for agent delivery", "An IV anesthetic infusion such as propofol"], "a": [0, 3, 5], "exp": "Every OR needs a contingency plan. Use the battery window to set up a Mapleson for ventilation and a TIVA infusion, and have the patient covered well before the battery is gone (generally within about an hour). The Tec 6 and Aladin both depend on electrical power.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 32 (PDF p. 16)"], "concept": "Power failure contingency plan", "carry": false}, {"id": "HZI1", "num": 68, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "These cylinder valves are shown with their gas labels removed. Which numbered valve belongs to an Entonox cylinder?", "c": ["Valve 1", "Valve 3", "Valve 4", "Valve 5"], "a": [3], "exp": "Entonox uses a single pin-index position (7), and valve 5 is the only one with a single hole. The two-hole valves are O2 (2,5), N2O (3,5), air (1,5), and CO2 (1,6).", "disc": null, "supp": null, "img": "hz_piss", "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 7 (PDF p. 4)"], "concept": "Reading PISS: Entonox", "carry": false}, {"id": "HZ27", "num": 69, "lec": "Hazards & safety", "lk": "haz", "type": "multi", "n": 2, "q": "Which statements about adverse events in anesthesia practice match the lecture? Select 2.", "c": ["Most are multifactorial", "Human error is responsible for the majority", "Most are caused by isolated equipment failures", "Most involve a single root cause", "Most occur only during induction", "Equipment problems are too rare to matter"], "a": [0, 1], "exp": "Most adverse events are multifactorial, combining system problems, human factors, and technical failures, and human error is responsible for the majority. The instructor stressed that low incidence doesn't mean equipment issues are safe to ignore.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 17 (PDF p. 9)"], "concept": "Nature of adverse events", "carry": false}, {"id": "HZ24", "num": 70, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "Why does a machine need a proportioning system in addition to the O2 fail-safe valve?", "c": ["It doesn't function at all on modern electronic machines", "It measures inspired O2, which responds too slowly", "It only cuts N2O when O2 pressure falls; it can't stop a bad flow ratio", "It only works while the machine runs on cylinder O2"], "a": [2], "exp": "The pressure-sensor shut-off (fail-safe) only interrupts or reduces N2O when O2 pressure falls; it doesn't prevent a hypoxic mixture reaching the common gas outlet when O2 pressure is normal but flow settings are wrong. The proportioning system addresses the flow ratio.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 14 (PDF p. 7)"], "concept": "Why proportioning is needed", "carry": false}, {"id": "HZ46", "num": 71, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "Which hypercarbia hazard applies to a system WITHOUT carbon dioxide absorption?", "c": ["Absorbent desiccation", "Inadequate fresh gas flow", "Channeling in the canister", "Exhausted absorbent"], "a": [1], "exp": "In a system without CO2 absorption, fresh gas flow is what clears CO2, so inadequate FGF causes rebreathing. Exhausted absorbent and channeling are hazards of systems WITH an absorber.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 20 (PDF p. 10)"], "concept": "Hypercarbia without absorption", "carry": false}, {"id": "HZ67", "num": 72, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "What protects the machine's AC power supply, battery, and convenience receptacles?", "c": ["The ESU return pad", "Circuit breakers", "The backup battery", "The line isolation monitor"], "a": [1], "exp": "The workstation's electrical portion has several circuit breakers, which generally protect circuits for the AC supply, the battery, and the convenience receptacles. The power cord runs 90-130 V AC at 50-60 Hz.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 25 (PDF p. 13)"], "concept": "Machine circuit breakers", "carry": false}, {"id": "HZ08", "num": 73, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "Which sequence matches the lecture's risk management steps?", "c": ["Define problems, estimate likelihood, weigh resources, apply solutions, monitor", "Monitor, define problems, weigh resources, apply solutions, estimate likelihood", "Estimate likelihood, apply solutions, define problems, monitor, weigh resources", "Apply solutions, define problems, monitor, estimate likelihood, weigh resources"], "a": [0], "exp": "Risk management: define potential problems, estimate the likelihood of occurrence, weigh the benefits of expending available resources, apply solutions, and monitor.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 16 (PDF p. 8)"], "concept": "Risk management steps", "carry": false}, {"id": "HZ59", "num": 74, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "After the machine check, the O2 cylinder is left open. At 2 a.m., the pipeline fails during an emergency case. When does the O2 supply alarm sound?", "c": ["Immediately when pipeline pressure starts to fall", "Only after the cylinder has quietly emptied", "Never, because the cylinder takes over permanently", "When the fail-safe valve closes the N2O line"], "a": [1], "exp": "With the cylinder open, the machine starts drawing from it as soon as pipeline pressure drops, so supply pressure stays up and no alarm sounds until the cylinder is empty. That's why the cylinder should be closed after checking it: the alarm then warns you at the pipeline failure while a full backup is still available.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 4 (PDF p. 2)"], "concept": "Open cylinder delays the alarm", "carry": false}, {"id": "HZ29", "num": 75, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "A circle system is assembled with the fresh gas inlet between the patient and the expiratory unidirectional valve. What is the problem?", "c": ["The APL can no longer vent", "Fresh gas bypasses the patient, promoting rebreathing", "The absorber is bypassed entirely", "Fresh gas pressure closes the inspiratory valve"], "a": [1], "exp": "The circle must be arranged to prevent rebreathing, and three arrangements must be avoided: fresh gas inlet between the patient and expiratory valve, APL between the patient and inspiratory valve, and reservoir bag between the patient and either valve. Misplacing the inlet sends fresh gas out the expiratory side instead of to the patient.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 20 (PDF p. 10)"], "concept": "Misplaced fresh gas inlet", "carry": false}, {"id": "HZ75", "num": 76, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "After the workstation battery is fully exhausted, which functions remain available?", "c": ["The ventilator and monitors on reduced power", "Nothing; all O2 delivery stops", "Emergency O2 and conventional mechanical vaporizers", "Electronic flow control and alarms"], "a": [2], "exp": "Once the battery is exhausted, only basic functions remain: emergency oxygen, which can be used with a conventional variable bypass vaporizer. The ventilator, monitors, and alarms are lost.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 32 (PDF p. 16)"], "concept": "Functions after battery exhaustion", "carry": false}, {"id": "HZ25", "num": 77, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "A machine has an outlet check valve. How must the low-pressure system be tested for leaks?", "c": ["With the O2 flush while occluding the Y-piece", "It can't be tested for leaks", "With positive pressure at the common gas outlet", "With negative pressure"], "a": [3], "exp": "Without a check valve, low-pressure leaks can be found by applying positive pressure at the common gas outlet. With a check valve, positive pressure can't reach the upstream components, so negative pressure must be applied.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 15 (PDF p. 8)"], "concept": "Leak test with check valve", "carry": false}, {"id": "HZ66", "num": 78, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "Which agent-delivery hazard does the lecture list along with dial design and incorrect filling?", "c": ["Low O2 supply pressure at the inlet", "Crossed pipeline supply hoses", "Exhausted CO2 absorbent granules", "Liquid agent in the fresh gas piping"], "a": [3], "exp": "Anesthetic agent dosage and administration problems: liquid agent in the fresh gas piping, concentration dial design, incorrect filling, and simultaneous use of more than one vaporizer. Tipping a vaporizer can put liquid where it doesn't belong.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 24 (PDF p. 12)"], "concept": "Liquid agent in piping", "carry": false}, {"id": "HZ03", "num": 79, "lec": "Hazards & safety", "lk": "haz", "type": "multi", "n": 3, "q": "Which are functions of the cylinder hanger yoke? Select 3.", "c": ["Ensures unidirectional flow into the machine", "Links O2 and N2O flows", "Reduces cylinder pressure to about 45 psi", "Orients the cylinder", "Provides a gas-tight seal", "Displays the cylinder's remaining volume"], "a": [0, 3, 4], "exp": "The hanger yoke orients the cylinder, provides a gas-tight seal, and ensures unidirectional flow into the machine; it also contains a filter. Reducing pressure is the regulator's job just distal to the yoke, the gauge shows pressure, and the proportioning system links O2 and N2O.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 9 (PDF p. 5)"], "concept": "Hanger yoke functions", "carry": false}, {"id": "HZ11", "num": 80, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "The machine check keeps failing the leak test, and no single loose component can be found. Per the instructor's notes, what usually fixes it?", "c": ["Recalibrating the O2 analyzer", "Replacing the scavenging interface", "Replacing the O2 cylinder", "Swapping the breathing circuit"], "a": [3], "exp": "Breathing circuit leaks are a common failure point, and the note says swapping the circuit usually fixes a failed leak check. Circuit leaks are one of the highlighted hypoxemia hazards usually caught on the machine check.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 19 (PDF p. 10)"], "concept": "Failed leak check: swap circuit", "carry": false}, {"id": "HZ01", "num": 81, "lec": "Hazards & safety", "lk": "haz", "type": "multi", "n": 3, "q": "Which components are part of the lecture's definition of the anesthesia workstation? Select 3.", "c": ["Wall suction regulator", "Anesthetic gas scavenging system", "Gas delivery system", "Operating room ventilation system", "Hospital bulk liquid O2 tank", "Anesthesia ventilator"], "a": [1, 2, 5], "exp": "The workstation is defined as the gas delivery system, breathing system, scavenging system, vapor delivery system, ventilator, and associated monitoring and protection devices. The bulk O2 tank and OR ventilation are facility systems upstream of or around the workstation.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 2 (PDF p. 1)"], "concept": "Workstation definition", "carry": false}, {"id": "HZ26", "num": 82, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "Why does the lecture say risk management is especially difficult in anesthesia?", "c": ["Equipment failures cause the majority of adverse events", "Complications are frequent enough to overwhelm reporting", "Complications only occur inside the operating room", "Complications are rare, so providers get little practice responding"], "a": [3], "exp": "The difficulty is the rarity of events: it's hard to develop solutions for events that rarely happen, and that rarity creates its own hazard because providers aren't experienced or trained to respond. Complications also aren't isolated to the OR; they can trace through pre-op, PACU, and the floor.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 16 (PDF p. 8)"], "concept": "Why anesthesia risk is hard to manage", "carry": false}, {"id": "HZ52", "num": 83, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "A capacitor in a DC circuit is connected to a battery. What happens to current flow?", "c": ["Only a momentary current flows while the plates charge", "Current flows continuously through the insulator", "Current reverses direction at regular intervals", "No current flows at any time"], "a": [0], "exp": "A capacitor is two parallel conductors separated by an insulator. In a DC circuit, the plates charge with only a momentary current flow; no further current flows unless a resistance connects the plates and discharges the capacitor.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 28 (PDF p. 14)"], "concept": "Capacitor in a DC circuit", "carry": false}, {"id": "HZ79", "num": 84, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "After an airway fire is controlled, a staff member starts throwing the burned ETT and circuit in the trash. What does the lecture say?", "c": ["Keep only the ETT; the circuit can be discarded", "Discard everything promptly to prevent a second fire", "That's fine once photos of the scene are taken", "Stop; preserve the scene, including tube, circuit, and drapes"], "a": [3], "exp": "Risk management after a fire: preserve the scene, notify the hospital risk manager, follow reporting requirements, treat it as an adverse event, and run fire drills. Leave everything in place, including the ET tube, circuit, and pulled drapes.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 39 (PDF p. 20)"], "concept": "Preserving the scene", "carry": false}, {"id": "HZ17", "num": 85, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "How does grounding in the operating room differ from grounding at home?", "c": ["Both power and equipment are ungrounded in the OR", "OR power is ungrounded while equipment is grounded", "Both power and equipment are grounded in the OR", "OR power is grounded while equipment is ungrounded"], "a": [1], "exp": "At home, electrical power is grounded and equipment may or may not be. In the OR it's the opposite: power is usually ungrounded, and the equipment is grounded.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 29 (PDF p. 15)"], "concept": "Grounding: OR vs home", "carry": false}, {"id": "HZ69", "num": 86, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "Why is power supplied to most ORs ungrounded?", "c": ["So OR equipment can run safely without being grounded", "To isolate current from ground potential, protecting against macroshock", "So the ESU can work without a dispersive return pad", "To lower electrical costs for high-draw OR equipment"], "a": [1], "exp": "With many devices, cords, and spilled fluids, the OR is an electrically hazardous environment. Ungrounded power isolates current from ground potential, an additional measure of protection from macroshock.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 30 (PDF p. 15)"], "concept": "Why OR power is ungrounded", "carry": false}, {"id": "HZ64", "num": 87, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "Which items does the lecture list as reported causes of total occlusion of the breathing circuit?", "c": ["An APL valve left fully open during ventilation", "Loose vaporizer filler caps on the manifold", "Filters, misconnected humidifiers, and defective tubing", "Exhausted absorbent and channeling in the canister"], "a": [2], "exp": "Filters in the circuit, incorrectly connected humidifiers, manufacturing defects in tubing, and failure to remove plastic wrapping have all been reported as causes of total breathing-circuit occlusion. Adapters also risk misconnections.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 22 (PDF p. 11)"], "concept": "Causes of circuit occlusion", "carry": false}, {"id": "HZ85", "num": 88, "lec": "Hazards & safety", "lk": "haz", "type": "multi", "n": 2, "q": "Which statements about ESU safety match the lecture? Select 2.", "c": ["ECG pads should be placed right next to the surgical site", "ESU current is standard 60 Hz AC", "An isolated ESU doesn't prevent pad-contact burns", "Prep solutions don't need to dry before cautery", "The return pad should be placed far from the surgical site", "Unit won't work unless pencil and pad are both connected"], "a": [2, 5], "exp": "The ESU requires both the pencil and the return pad to be connected, which acts as a built-in safety check, but an isolated ESU is no foolproof protection against pad burns. Place the pad close to the site and ECG pads far away. ESU current is radiofrequency (500 kHz-1 MHz), and prep must dry first.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 31 (PDF p. 16)"], "concept": "ESU safety facts", "carry": false}, {"id": "HZ57", "num": 89, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "In the cylinder regulator described in the lecture, how is output held at about 45 psi?", "c": ["Two linked diaphragms use negative feedback to close the inlet", "The fail-safe valve limits gas flow into the machine", "A bimetallic strip responds to cylinder temperature", "The provider adjusts a needle valve as pressure falls"], "a": [0], "exp": "Immediately distal to the hanger yoke, two diaphragms are connected by a rod. Gas entering pushes on the large diaphragm, which moves the small one to close the high-pressure inlet, a negative feedback loop that holds about 45 psi.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 9 (PDF p. 5)"], "concept": "Regulator mechanism", "carry": false}, {"id": "HZ70", "num": 90, "lec": "Hazards & safety", "lk": "haz", "type": "multi", "n": 3, "q": "Which devices can the ESU's high-frequency energy interfere with, per the lecture? Select 3.", "c": ["Pulse oximeters", "The O2 fail-safe valve", "ECG", "The pipeline check valves", "Variable bypass vaporizers", "Implanted cardiac pacemakers"], "a": [0, 2, 5], "exp": "Few things in the OR are immune to the Bovie: its high-frequency energy interferes with everything from the ECG signal to cardiac output computers, pulse oximeters, and implanted pacemakers. Pneumatic and mechanical components like the fail-safe, vaporizers, and check valves aren't affected.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 31 (PDF p. 16)"], "concept": "ESU interference", "carry": false}, {"id": "HZ35", "num": 91, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "Where should the ESU return pad and the ECG electrodes be placed relative to the surgical site?", "c": ["Both as far from the site as possible", "Both close to the surgical site", "Return pad far from the site; ECG pads close to it", "Return pad close to the site; ECG pads as far away as feasible"], "a": [3], "exp": "It's prudent to place the return plate as close as possible to the operative site, and ECG pads as far from the site as feasible, keeping the current path short and away from monitoring leads.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 31 (PDF p. 16)"], "concept": "Return pad and ECG placement", "carry": false}, {"id": "HZ19", "num": 92, "lec": "Hazards & safety", "lk": "haz", "type": "multi", "n": 2, "q": "Besides O2, N2O, and air, which pipeline connections on the lecture's DISS chart have their own gas-specific fittings? Select 2.", "c": ["Waste anesthetic gas disposal (WAGD)", "Carbon dioxide for insufflation", "Heliox mixture", "Helium for heliox", "Entonox (N2O/O2)", "Suction"], "a": [0, 5], "exp": "The DISS chart on slide 6 lists oxygen, nitrous oxide, air, suction, and WAGD, each with its own connector. CO2, helium, and Entonox appear on the cylinder (PISS) chart, not the DISS pipeline chart.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 6 (PDF p. 3)"], "concept": "DISS connections", "carry": false}, {"id": "HZ40", "num": 93, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "Why must each Thorpe tube flowmeter be calibrated for one specific gas?", "c": ["Each gas has a different critical temperature in the tube", "The float material reacts differently with each gas", "Gases differ in density and viscosity, which change the float position", "Each gas arrives at a different pipeline supply pressure"], "a": [2], "exp": "Float height depends on the pressure needed to support it: viscosity governs at low (laminar) flows and density at high (turbulent) flows. Because gases differ in these properties, each flowmeter is gas-specific, though gases with similar densities would read similarly.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 12 (PDF p. 6)"], "concept": "Gas-specific calibration", "carry": false}, {"id": "HZ14", "num": 94, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "A brand-new breathing circuit won't pass gas during the machine check; pressure builds with the flush and nothing reaches the mask. What should be checked first?", "c": ["Leftover plastic wrapping on a connector", "The O2 cylinder pressure", "The vaporizer filler cap", "The scavenger vacuum setting"], "a": [0], "exp": "Occlusions are usually from bent tubing, misconnections, or plastic wrapping not fully removed from breathing system components. Instructor note: watch for unremoved plastic wrapping; the machine check will catch it.", "disc": null, "supp": null, "img": null, "ref": ["Anesthesia Workstation Hazards & Safety (McPherson): slide 22 (PDF p. 11)"], "concept": "Plastic wrap occlusion", "carry": false}, {"id": "HZ72", "num": 95, "lec": "Hazards & safety", "lk": "haz", "type": "single", "n": 1, "q": "Which fire preparation step is typically done during the surgical time-out?", "c": ["Testing the ESU on a sponge", "Pointing out the fire extinguisher location", "Turning off room medical gases", "Performing a full fire drill"], "a": [1], "exp": "During time-o

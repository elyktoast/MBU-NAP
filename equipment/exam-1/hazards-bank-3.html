*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}body{margin:0;background:var(--bg);color:var(--t);line-height:1.5;padding:20px}.wrap{max-width:1040px;margin:auto}.panel{background:white;border-radius:10px;box-shadow:0 4px 12px #00000012;padding:28px}.hero{display:flex;justify-content:space-between;align-items:end;border-bottom:2px solid var(--b);padding-bottom:18px;margin-bottom:22px}.hero h1{margin:0;color:#1a202c}.hero p{margin:4px 0 0;color:var(--mut)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{border:1px solid var(--b);border-radius:9px;padding:18px;background:#fff}.card h3{margin:0 0 6px}.mini{color:var(--mut);font-size:.9rem}.bar{height:9px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin:12px 0}.bar>span{display:block;height:100%;background:var(--pl)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:6px;background:var(--p);color:white;padding:10px 16px;font-weight:700;cursor:pointer}.btn:hover{filter:brightness(1.08)}.btn.out{background:white;color:var(--p);border:1.5px solid var(--p)}.btn.bad{background:#9b2c2c}.btn:disabled{background:#cbd5e0;color:white;border-color:#cbd5e0;cursor:not-allowed}.header{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:2px solid var(--b);padding-bottom:14px;margin-bottom:18px}.badge{background:var(--p);color:#fff;padding:5px 14px;border-radius:999px;font-size:.85rem;font-weight:800}.progress{font-weight:700;color:#4a5568}.stats{display:flex;gap:22px;flex-wrap:wrap;background:var(--soft);border:1px solid var(--b);padding:12px 16px;border-radius:7px;margin-bottom:20px}.type{font-size:.84rem;color:#b7791f;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}.stem{font-size:1.12rem;font-weight:650;color:#1a202c;margin-bottom:18px}.image{display:flex;justify-content:center;margin:15px 0 20px}.options{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}.opt{display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 16px;border:1.5px solid var(--b);border-radius:6px;background:white;text-align:left;font-size:.98rem;cursor:pointer}.opt:hover:not(.locked){background:var(--soft);border-color:var(--pl)}.opt.selected{border-color:var(--p);background:#ebf8ff;font-weight:650}.opt.correct{background:var(--okbg)!important;border-color:var(--ok)!important;color:var(--ok)!important;font-weight:750}.opt.incorrect{background:var(--badbg)!important;border-color:var(--bad)!important;color:var(--bad)!important}.opt.strike{text-decoration:line-through;opacity:.45}.prefix{font-weight:800;min-width:26px}.explain{display:none;margin-top:18px;padding:18px;border-radius:6px;background:#f8fafc;border-left:5px solid var(--p);font-size:.95rem}.cite{margin-top:10px;font-size:.85rem;font-weight:750;color:#4a5568}.controls{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--b);padding-top:16px;margin-top:24px}.hidden{display:none!important}.mbu-choice-row{display:flex;gap:8px;align-items:stretch}.mbu-choice-row .opt{flex:1;min-width:0}.mbu-cross{flex:0 0 44px;border:1px solid #cbd5e0;border-radius:8px;background:#fff;color:#4a5568;font-size:18px;cursor:pointer}.mbu-cross[aria-pressed="true"]{background:#fff5f5;color:#9b2c2c;border-color:#e53e3e}.mbu-cross:disabled{opacity:.5;cursor:default}@media(max-width:650px){body{padding:10px}.panel{padding:18px}.hero,.header,.controls{align-items:flex-start;flex-direction:column}.controls .row{width:100%}.controls .btn{flex:1}.stats{gap:10px}}
</style><link rel="stylesheet" href="../assets/site-nav.css?v=2"><script defer src="../assets/site-nav.js?v=2" data-page="exam"></script></head><body><div class="wrap"><section id="dashboard" class="panel"><div class="hero"><div><h1>Workstation Hazards Practice Set 3</h1><p>100 questions from the uploaded Workstation Hazards & Safety question bank.</p></div><div class="mini" id="overall"></div></div><div id="cards" class="grid"></div></section><section id="quiz" class="panel hidden"><div class="header"><div class="row"><span class="badge" id="set-badge"></span><button class="btn out" id="mbuFlagBtn" onclick="mbuToggleFlag(QUESTIONS[currentIndex])">☆ Flag</button><button class="btn out" onclick="mbuReportQuestion(QUESTIONS[currentIndex])">Report</button><button class="btn out" onclick="document.getElementById('mbuNavigator').classList.toggle('hidden')">Navigator</button><button class="btn out mbu-return" onclick="goDashboard()">← Hazards Practice Sets</button></div><div class="progress" id="progress"></div></div><div class="stats"><div>Completed: <strong id="completed">0</strong>/100</div><div>Score: <strong id="score">0</strong>%</div><div>Missed: <strong id="missed">0</strong></div></div><div id="mbuNavigator" class="row hidden" style="flex-wrap:wrap;gap:6px;margin:8px 0 14px;max-height:180px;overflow:auto;padding:3px"></div><div class="type" id="type"></div><div class="stem" id="stem"></div><div class="image hidden" id="image"></div><div class="options" id="options"></div><div class="row" id="multi-submit-row" style="display:none;margin:4px 0 18px;justify-content:flex-end"><button class="btn" id="submit-multi" onclick="submitAnswer()">Submit Answer</button></div><div class="explain" id="explain"><div id="explain-text"></div><div class="cite" id="citation"></div></div><div class="controls"><button class="btn out" id="prev" onclick="nav(-1)">Previous</button><div class="row"><button class="btn out" onclick="resetCurrent()">Reset</button><button class="btn" id="next" onclick="nav(1)">Next</button></div></div></section></div><script src="../assets/studio-sync.js?v=1"></script><script>const QUESTIONS=[{"id":1,"type":"single","stem":"Agent dosage errors are rare with modern equipment. Which practice does the lecture say increases the risk?","options":["Filling vaporizers with the key fill system","Keeping vaporizers mounted on one machine","Frequently moving vaporizers between machines","Using only one vaporizer at a time"],"answer":[2],"explanation":"Dosage and administration errors (liquid agent in fresh gas piping, dial design, incorrect filling, simultaneous vaporizers) are rare, largely because equipment is well designed. The risk rises when vaporizers are moved frequently, since a tipped vaporizer can increase the dose.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 24 (PDF p. 12)"},{"id":2,"type":"single","stem":"A spontaneously breathing patient is transported on a Mapleson C. Compared with controlled ventilation on the same circuit, what is the added problem?","options":["The APL must be closed","The patient does more work of breathing to overcome rebreathing","FGF requirements fall to 0.7 x MV","The patient can't rebreathe during spontaneous breathing"],"answer":[1],"explanation":"Mapleson B and C always permit rebreathing. To prevent hypercarbia, FGF of 1.5-2.5 x MV is used and the patient must hyperventilate; if spontaneously breathing, metabolic work increases. Controlled ventilation avoids that because the patient isn't doing the work. Instructor note: spontaneously breathing = Mapleson A.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 21 (PDF p. 11)"},{"id":3,"type":"select-3","stem":"Which circle system arrangements must be avoided to prevent rebreathing? Select 3.","options":["Reservoir bag between the patient and either unidirectional valve","Absorber in the inspiratory limb on the bag side","Fresh gas inlet between the patient and the expiratory valve","APL valve on the expiratory side near the bag","Fresh gas inlet on the inspiratory side downstream of the absorber","APL valve between the patient and the inspiratory valve"],"answer":[0,2,5],"explanation":"The three arrangements to avoid: fresh gas inlet between patient and expiratory valve; APL between patient and inspiratory valve; reservoir bag between patient and either valve. The absorber in the inspiratory limb on the bag side is the standard placement.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 20 (PDF p. 10)"},{"id":4,"type":"single","stem":"The lecture says grounding refers to two separate concepts that 'are not mutually exclusive.' What are they?","options":["Grounding of electrical power and grounding of electrical equipment","Grounding of the patient and grounding of the provider","Grounding of AC and grounding of DC","Grounding of the ESU and grounding of the monitors"],"answer":[0],"explanation":"Grounding applies to the power (grounded or ungrounded) and to the equipment (grounded or ungrounded). Power can energize devices that are themselves grounded or not. At home, power is grounded; in the OR, power is ungrounded while equipment is grounded.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 29 (PDF p. 15)"},{"id":5,"type":"single","stem":"A technician removes the pins from an O2 hanger yoke so a cylinder with a damaged valve will fit. What is the main danger?","options":["The cylinder can no longer form a gas-tight seal","A wrong-gas cylinder could be mounted, risking a hypoxic mixture","The first-stage regulator will pass full cylinder pressure","The yoke check valve will no longer seat properly"],"answer":[1],"explanation":"PISS can be bypassed by removing the pins, which the lecture calls out as not recommended because it could result in hypoxic gas mixtures. The pins are what stop a wrong cylinder from fitting.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 7 (PDF p. 4)"},{"id":6,"type":"single","stem":"How do electronically controlled flow controllers vary gas flow?","options":["A bimetallic strip adjusts the orifice","A needle valve is turned by hand","A glass tube and float measure the flow","A variable-position solenoid sets the orifice size"],"answer":[3],"explanation":"Electronic flow controllers are still variable-orifice devices, but the orifice size is controlled by a variable-position solenoid, with settings made through a computer interface on the workstation.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 12 (PDF p. 6)"},{"id":7,"type":"single","stem":"After intubation, breath sounds and ETCO2 were confirmed. Ten minutes later, ETCO2 has risen steadily, there's no chest rise, and the bag hangs empty. What is the MOST likely cause?","options":["Exhausted CO2 absorbent","Increased apparatus dead space","An incompetent expiratory valve","The ventilator was never turned on"],"answer":[3],"explanation":"The lecture's most common hypercarbia cause: intubating, confirming breath sounds and ETCO2, then forgetting to turn the ventilator on, so the patient isn't breathing. No chest rise with rising CO2 points to apnea, not rebreathing.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 20 (PDF p. 10)"},{"id":8,"type":"single","stem":"A cylinder valve has a single pin-index hole in position 7. Which gas does the lecture's chart assign to it?","options":["Medical air","Nitrous oxide","Carbon dioxide","Entonox"],"answer":[3],"explanation":"From the PISS chart: oxygen 2,5; nitrous oxide 3,5; air 1,5; carbon dioxide 1,6; Entonox (50% N2O / 50% O2) uses the single position 7.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 7 (PDF p. 4)"},{"id":9,"type":"single","stem":"What does impedance (Z) include that simple resistance doesn't?","options":["Voltage and current","Power and energy","Only resistance at high voltage","Capacitance and inductance"],"answer":[3],"explanation":"Impedance is the sum of the forces opposing electron movement in an AC circuit: resistance plus capacitance and inductance. For AC circuits, Ohm's law becomes E = I x Z.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 27 (PDF p. 14)"},{"id":10,"type":"single","stem":"A cylinder valve has pin-index holes at positions 1 and 6. Per the lecture's PISS chart, which gas does it hold?","options":["Entonox","Medical air","Oxygen","Carbon dioxide"],"answer":[3],"explanation":"The chart on slide 7: oxygen 2,5; nitrous oxide 3,5; air 1,5; carbon dioxide 1,6; Entonox 7. Air shares position 1 but pairs it with 5.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 7 (PDF p. 4)"},{"id":11,"type":"single","stem":"After induction, the patient is breathing spontaneously, and circuit pressure keeps climbing with each breath. What is the most common cause according to the lecture?","options":["The absorbent is exhausted","The ventilator is running at too high a rate","The O2 flowmeter is off","The APL valve was left closed after induction"],"answer":[3],"explanation":"High breathing-system pressure during spontaneous ventilation can come from an APL that's partly or fully closed (often left closed after induction), kinked tubing to the scavenging interface, or a failed interface positive-pressure relief valve.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 23 (PDF p. 12)"},{"id":12,"type":"select-2","stem":"Which describe the anesthesia machine's main power supply, per the lecture? Select 2.","options":["90-130 V","Radiofrequency current at 500 kHz","Ungrounded equipment chassis","Alternating current at 50-60 Hz","A battery that lasts about 8 hours","220-240 V direct current"],"answer":[0,3],"explanation":"The power cord uses 90-130 V at 50-60 Hz alternating current. The backup battery lasts about 40 minutes (some 1-2 hours), radiofrequency is the ESU, and OR equipment is grounded.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 25 (PDF p. 13)"},{"id":13,"type":"single","stem":"A fire starts on the patient's drapes. Which sequence matches the lecture's response?","options":["Assess the patient, turn off gases, extinguish, remove drapes","Remove drapes, assess the patient, turn off gases, extinguish","Turn off gases, remove drapes and burning materials, extinguish, assess the patient","Extinguish, assess the patient, remove drapes, turn off gases"],"answer":[2],"explanation":"Fire on the patient: turn off gases, remove drapes and burning materials, extinguish flames with water, saline, or an extinguisher, then assess the patient's status, devise a care plan, and assess for smoke inhalation.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 37 (PDF p. 19)"},{"id":14,"type":"single","stem":"During an airway fire, the ETT is pulled and gases are stopped at the same moment. Which numbered elements of the fire triangle do these two actions remove?","options":["Elements 2 and 3","Element 1 only","Elements 1 and 2","Element 2 only"],"answer":[0],"explanation":"Element 2 is the oxidizer (O2, controlled by anesthesia), removed by stopping gases. Element 3 is fuel, and the lecture lists tracheal tubes as fuel, so pulling the tube removes it. Element 1 is the ignition source (the surgeon's cautery or laser).","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slides 33, 36 (PDF p. 17, 18)","imageRef":"hz_fire"},{"id":15,"type":"single","stem":"Heliox and O2 are running, and N2O is then added. Why can the patient still receive a hypoxic mixture despite a working proportioning system?","options":["The proportioning system only links N2O and O2, not other gases","The proportioning system shuts off when helium is detected","Helium blocks the fail-safe valve","The proportioning system only works below 2 L/min"],"answer":[0],"explanation":"The proportioning system functions only between N2O and O2. With helium or air also flowing, O2 can be a small share of the total; the lecture's example is heliox plus N2O dropping O2 below 21%.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 14 (PDF p. 7)"},{"id":16,"type":"single","stem":"In the OR fire triangle, which team member typically controls each element?","options":["Ignition: anesthesia; oxidizer: surgeon; fuel: nursing","Ignition: nursing; oxidizer: anesthesia; fuel: surgeon","Ignition: surgeon; oxidizer: nursing; fuel: anesthesia","Ignition: surgeon; oxidizer: anesthesia; fuel: nursing"],"answer":[3],"explanation":"The ignition source is almost always the surgeon's cautery, lasers, or light cords; the oxidizer is controlled by anesthesia through the ETT, mask, or cannula; and fuel (drapes, gauze, prep) is labeled nursing, though fuel is everywhere. Instructor note: oxidizer (anesthesia) + ignition (surgeon) + fuel (anything).","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 33 (PDF p. 17)"},{"id":17,"type":"single","stem":"Two O2 cylinders hang on a double yoke, one at 1900 psig and one at 800 psig, both open. What is transfilling?","options":["Gas flowing from the pipeline into the cylinders","Liquid N2O moving into the O2 cylinder","Gas flowing from the higher-pressure cylinder into the lower-pressure one","Gas flowing from the machine back out an empty yoke"],"answer":[2],"explanation":"The lecture defines transfilling as gas flowing from a higher-pressure cylinder to a lower-pressure cylinder, which a double hanger yoke can allow. The unidirectional valve in each yoke limits leaking from an empty yoke and lets cylinders be changed during use.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 9 (PDF p. 5)"},{"id":18,"type":"select-2","stem":"Which electrical items should the machine check and your own preparation confirm? Select 2.","options":["That the ESU return pad is on the anesthesia machine","That the vaporizers are electrically powered","That the machine's power is grounded like a home outlet","The backup battery is charged","Which functions (monitors, alarms, ventilator) run on battery","That the battery lasts at least 8 hours"],"answer":[3,4],"explanation":"Instructor notes: make sure the battery is charged (machine check) and know what is powered by the battery; monitors, airway monitors, BP and HR, alarms, and the ventilator may or may not all share the same power source.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 25 (PDF p. 13)"},{"id":19,"type":"single","stem":"With a constant 16 psi at the flow control valve inlet, what happens when the needle valve is opened further?","options":["Resistance rises, so flow decreases","Pressure rises, so flow increases","Flow stays constant, because inlet pressure is fixed","Resistance falls, so flow increases"],"answer":[3],"explanation":"Flow = pressure / resistance. Opening the valve (turning left) enlarges the orifice and decreases resistance, so flow rises; the instructor notes 'Ohm's law can be proven true once again.'","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slides 5, 13 (PDF p. 3, 7)"},{"id":20,"type":"single","stem":"During a closed-system (very low-flow) anesthetic, SpO2 slowly falls. The circuit has no leaks, and the O2 analyzer shows FiO2 steadily dropping. Which highlighted hazard fits?","options":["Disconnected O2 hose at the wall outlet","Closed-system anesthesia with inadequate fresh O2 supply","Incompetent circuit unidirectional valves","Crossed hospital O2 and N2O pipelines upstream"],"answer":[1],"explanation":"With very low flow, O2 added must at least match what the patient consumes; otherwise circuit O2 falls. That's a highlighted item on slide 19. Crossed pipelines would drop FiO2 regardless of flow, and a disconnected hose triggers supply alarms.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 19 (PDF p. 10)"},{"id":21,"type":"select-2","stem":"Which statements about current types are correct? Select 2.","options":["DC is harmless because it flows in one direction","For DC circuits, Ohm's law is written E = I x Z","Impedance applies only to DC circuits","AC reverses direction at regular intervals","AC flows in one direction only","About three times as much DC as AC is needed to cause V-fib"],"answer":[3,5],"explanation":"DC flows in one direction; AC reverses at regular intervals. It takes about three times as much DC as AC to cause V-fib, which doesn't make DC harmless. Impedance applies to AC, where E = I x Z.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 27 (PDF p. 14)"},{"id":22,"type":"single","stem":"During neck surgery with the drape over the face, the low exhaled volume alarm sounds. What does the lecture say is especially common here?","options":["Ventilator malfunction from a failed bellows","Disconnection at the ETT connection under the drape","Absorbent exhaustion from high fresh gas flow","Vaporizer tipping as the table is rotated"],"answer":[1],"explanation":"Circuit leaks and disconnections are especially common with neck surgery when the drape covers the face and the ET tube connection comes loose.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 23 (PDF p. 12)"},{"id":23,"type":"select-3","stem":"A fire isn't going out with initial measures. Which steps does the lecture list? Select 3.","options":["Increase FiO2 to protect the patient","Continue the procedure until the fire department arrives","Use a CO2 fire extinguisher","Activate the fire alarm","Reopen the room door to check on the fire","Turn off the medical gas supply to the room"],"answer":[2,3,5],"explanation":"Failure to extinguish: use a CO2 fire extinguisher, activate the fire alarm, consider evacuating the room (close the door and don't reopen it), and turn off the medical gas supply to the room.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 38 (PDF p. 19)"},{"id":24,"type":"single","stem":"A cylinder regulator has an inlet gauge and an outlet gauge. Which one changes as the cylinder empties?","options":["Both, equally","The outlet gauge","The inlet gauge","Neither, because the regulator holds both steady"],"answer":[2],"explanation":"The regulator converts variable high-pressure input (0 to about 2200 psi) into a constant lower output (about 45 psi). The inlet gauge tracks cylinder pressure and falls as it empties; the outlet stays constant. This was the instructor's question on slide 10.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 10 (PDF p. 5)"},{"id":25,"type":"single","stem":"Why can't an air pipeline hose be connected to the machine's O2 inlet?","options":["The O2 inlet uses the pin-index system to reject air","The fail-safe valve blocks air from entering the O2 line","Each DISS fitting differs in nut size, thread, and internal inlet","Air and O2 hoses differ only in their color coding"],"answer":[2],"explanation":"DISS gives each gas a different diameter inlet and threading; not only is the external nut differently sized and threaded, but internally the inlets are different and non-interchangeable. Color helps, but the physical fit prevents misconnection.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 6 (PDF p. 3)"},{"id":26,"type":"single","stem":"On some older anesthesia machines, the O2 flow control knob can't be turned completely off. Why?","options":["To guarantee a minimal O2 flow","To keep the fail-safe valve open","To allow the flush valve to work","To prevent needle valve damage"],"answer":[0],"explanation":"In some older machines, O2 can't be completely turned off at the control knob, allowing a minimal O2 flow as a safety feature.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 12 (PDF p. 6)"},{"id":27,"type":"single","stem":"A proposed common gas outlet adapter uses a 30 mm conical fitting. Why doesn't it meet workstation standards?","options":["Only 15 mm external fittings are allowed","19 and 30 mm conical fittings are reserved for the scavenging system","The standard requires a 22 mm internal diameter","30 mm is too small for the breathing circuit"],"answer":[1],"explanation":"The standard allows one common gas outlet with a 15 mm internal (female) diameter and a 22 mm external (male) diameter. It can't have a 19 or 30 mm conical fitting because those sizes are specific to scavenging, which prevents misconnection.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 15 (PDF p. 8)"},{"id":28,"type":"single","stem":"On a double-yoke machine where both O2 cylinders share one gauge, one cylinder is empty and the other full. What does the gauge show?","options":["The average of the two cylinder pressures","Only the empty cylinder's pressure, near zero","A single pressure that can't tell the two cylinders apart","Two separate pressures on a split dial face"],"answer":[2],"explanation":"On a single-cylinder system the gauge is upstream of the check valve and shows that cylinder's pressure. In a two-cylinder system the shared gauge location means you can't differentiate the individual cylinder pressures.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 7 (PDF p. 4)"},{"id":29,"type":"single","stem":"A mixture of 50% O2 and 50% N2O is used near an ignition source. How does the lecture rate its fire risk?","options":["It suppresses combustion, since N2O isn't an oxidizer","It supports combustion about as avidly as 100% O2","It's no riskier than room air","It supports combustion about half as much as 100% O2"],"answer":[1],"explanation":"O2 and N2O function equally well as oxidizers, so a 50% O2 / 50% N2O combination would support combustion about as avidly as 100% oxygen. That's why the prevention list says to avoid N2O.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 33 (PDF p. 17)"},{"id":30,"type":"single","stem":"Circuits 2 and 3 in the figure share which feature?","options":["Fresh gas enters near the patient; they need 1.5-2.5 x MV","Fresh gas enters at the bag, so they need only 0.7 x MV","They're designed for spontaneous breathing only","They contain unidirectional valves and a CO2 absorber"],"answer":[0],"explanation":"Circuits 2 and 3 are Mapleson B and C: fresh gas enters near the patient end, and exhaled gas is directed into a blind pouch, so they always permit rebreathing and need FGF of 1.5-2.5 x MV. Controlled ventilation avoids the extra work for a spontaneously breathing patient.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 21 (PDF p. 11)","imageRef":"hz_mapleson"},{"id":31,"type":"single","stem":"A long elbow extension is added between the Y-piece and the ETT for positioning. ETCO2 slowly rises. What is the mechanism?","options":["Increased apparatus dead space","Circuit leak","Incompetent unidirectional valves","Exhausted absorbent"],"answer":[0],"explanation":"Tubing extensions between the Y-piece and patient add apparatus dead space, a delivery-system cause of hypercarbia on slide 20. Exhausted absorbent and bad valves cause rebreathing through the circle; a leak lowers exhaled volume.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 20 (PDF p. 10)"},{"id":32,"type":"single","stem":"Which pair of figures does the lecture give for gas delivery equipment problems?","options":["15 of about 6,000 claims; event incidence estimated at 0.02%","115 of about 60,000 claims; event incidence estimated at 2-4%","1,150 of about 6,000 claims; event incidence estimated at 19%","115 of about 6,000 closed claims; event incidence estimated at 0.23-0.4%"],"answer":[3],"explanation":"The ASA closed claims database recorded 115 cases related to gas delivery equipment out of roughly 6,000 claims, and the incidence of such events has been estimated at 0.23-0.4%. Most adverse events are multifactorial, with human error responsible for the majority.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 17 (PDF p. 9)","discussion":"The lecture audio links the two numbers ('115 of about 6,000, about 0.23-0.4%'), but 115 of 6,000 is about 1.9% of claims. The written notes present 0.23-0.4% as the estimated event incidence, a separate figure."},{"id":33,"type":"select-3","stem":"Which are the early warning signs of a surgical fire listed in the lecture? Select 3.","options":["A fall in SpO2","A sudden rise in ETCO2","A rise in peak airway pressure","A pop","A flash","Smoke"],"answer":[3,4,5],"explanation":"Look for early warning signs of fire: a pop, a flash, or smoke. Then stop the procedure, and each team member immediately carries out their assigned task. The monitor changes listed aren't the lecture's fire warning signs.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 36 (PDF p. 18)"},{"id":34,"type":"single","stem":"Why is the O2 flow control knob larger in diameter with bigger ridges than the N2O and air knobs?","options":["To meet DISS requirements","To allow a tactile safety check in addition to color","To make O2 flow easier to fine-tune","To withstand higher O2 pipeline pressure"],"answer":[1],"explanation":"Knobs are color coded (O2 green in the US) and touch coded, so a provider gets both a visual and a tactile check. The instructor's aviation comparison: someone somewhere once gave a hypoxic mixture by turning the wrong knob.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 13 (PDF p. 7)"},{"id":35,"type":"single","stem":"How does the current needed to cause ventricular fibrillation compare between DC and AC?","options":["About three times more AC than DC is needed","They're equal","About three times more DC than AC is needed","DC can't cause ventricular fibrillation"],"answer":[2],"explanation":"It takes about three times as much DC as AC to cause V-fib, but that doesn't make DC harmless. AC reverses direction at regular intervals, and AC circuits add impedance (E = I x Z).","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 27 (PDF p. 14)"},{"id":36,"type":"single","stem":"An alcohol-based skin prep has pooled under the patient's flank just before draping. What is the correct action?","options":["Use cautery on the lowest setting","Drape immediately so the prep stays sterile","Let the prep dry fully before draping and using cautery","Cover the pool with a dry towel and proceed"],"answer":[2],"explanation":"Flammable prep solutions such as alcohol and acetone can ignite when the ESU is used. The lecture's prevention list starts with allowing flammable skin preparations to dry before draping.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slides 31, 35 (PDF p. 16, 18)"},{"id":37,"type":"single","stem":"A Mapleson C is used with a minute ventilation of 5 L/min. What fresh gas flow range does the lecture recommend to prevent rebreathing?","options":["3.5-5 L/min","5-7.5 L/min","7.5-12.5 L/min","12.5-20 L/min"],"answer":[2],"explanation":"Mapleson B and C always permit rebreathing through their blind-pouch design and need FGF of 1.5-2.5 x minute ventilation: 1.5 x 5 = 7.5 and 2.5 x 5 = 12.5 L/min. 3.5 L/min is the 0.7 x MV Mapleson A value.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 21 (PDF p. 11)"},{"id":38,"type":"single","stem":"Per the lecture audio, which aggravating factors are becoming increasingly common causes of adverse events?","options":["Equipment failures from aging anesthesia machines","Inattention and distraction, often from phones or conversation","Inexperience among senior, long-practicing providers","Failure of hospital pipeline supply systems"],"answer":[1],"explanation":"Inattention and distraction are increasingly common causes, often from phone use or getting pulled into conversation with the surgical team. Haste is another major factor, and fatigue affects nearly everyone.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 18 (PDF p. 9)"},{"id":39,"type":"single","stem":"On these unlabeled valves, which numbered valve has the pin-index holes that fit a nitrous oxide yoke (positions 3 and 5)?","options":["Valve 1","Valve 2","Valve 3","Valve 4"],"answer":[1],"explanation":"Positions 3 and 5 are adjacent, so the N2O valve has its two holes close together, as on valve 2. O2 (2,5), air (1,5), and CO2 (1,6) have holes spaced farther apart.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 7 (PDF p. 4)","imageRef":"hz_piss"},{"id":40,"type":"select-2","stem":"Total power is lost and the battery is exhausted. Which vaporizers can still deliver agent? Select 2.","options":["GE Aladin desflurane cassette","GE Aladin sevoflurane cassette","Variable bypass sevoflurane vaporizer","Tec 6 desflurane vaporizer","Drager D-Vapor desflurane vaporizer","Variable bypass isoflurane vaporizer"],"answer":[2,5],"explanation":"Once the battery is exhausted, only basic functions remain, including emergency O2 usable with a conventional mechanical (variable bypass) vaporizer. Desflurane vaporizers (Tec 6, D-Vapor) and electronic vaporizers like the GE Aladin can't deliver agent without electrical power.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 32 (PDF p. 16)"},{"id":41,"type":"single","stem":"How many common gas outlets does the anesthesia workstation standard allow?","options":["One per vaporizer","One","Two, one for each breathing system","As many as the manufacturer chooses"],"answer":[1],"explanation":"The standard requires only one common gas outlet, with a 15 mm internal and 22 mm external diameter; 19 and 30 mm conical fittings are reserved for scavenging.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 15 (PDF p. 8)"},{"id":42,"type":"select-3","stem":"Which are HYPERCARBIA hazards on the lecture's delivery-system list (as opposed to hypoxemia hazards)? Select 3.","options":["Exhausted CO2 absorbent or channeling","Crossed hospital pipelines","Closed O2 cylinder valve","O2 flowmeter turned off","Increased apparatus dead space","Incorrectly assembled circle system"],"answer":[0,4,5],"explanation":"Hypercarbia hazards: apnea, increased apparatus dead space, missing or incompetent unidirectional valves, incorrectly assembled circle, exhausted absorbent or channeling, and inadequate FGF without absorption. A closed O2 cylinder, crossed pipelines, and a flowmeter left off are hypoxemia hazards on slide 19.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slides 19, 20 (PDF p. 10)"},{"id":43,"type":"single","stem":"Running behind schedule, a new provider extubates a patient who isn't adequately awake. Which aggravating factor from the lecture does this illustrate?","options":["Failure to check equipment","Fatigue","Haste","Lack of familiarity with equipment"],"answer":[2],"explanation":"The instructor's example of haste is exactly this: time pressure, especially early in a career, leading to errors like extubating before a patient is adequately awake. The other listed factors are failure to check equipment, unfamiliarity, inexperience, inattention, distraction, and fatigue.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 18 (PDF p. 9)"},{"id":44,"type":"single","stem":"A device draws 10 A from a 120 V source. Using Ohm's law, what is its resistance?","options":["1.2 ohms","12 ohms","130 ohms","1,200 ohms"],"answer":[1],"explanation":"E = I x R, so R = E / I = 120 V / 10 A = 12 ohms. 1,200 would come from multiplying instead of dividing.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 26 (PDF p. 13)"},{"id":45,"type":"select-3","stem":"Which are IGNITION sources in the OR, per the lecture? Select 3.","options":["Nitrous oxide in the circuit","Paper surgical drapes","Lasers","Electrosurgical unit","Oxygen at high FiO2","Ends of fiberoptic light cords"],"answer":[2,3,5],"explanation":"Ignition sources: the ESU, lasers, and the ends of fiberoptic light cords. O2 and N2O are oxidizers, and drapes are fuel.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 33 (PDF p. 17)"},{"id":46,"type":"single","stem":"On an older machine with a chain linking the O2 and N2O valves, O2 is turned down below 25% of total flow. What happens?","options":["N2O flow decreases too","O2 flow is automatically raised to 50%","An alarm sounds but flows are unchanged","The fail-safe valve closes"],"answer":[0],"explanation":"In older machines, the linkage was a mechanical chain between the O2 and N2O valves (14 and 28 teeth on the gears). If O2 is turned below 25% of total flow, N2O flow decreases as well. Modern machines do this electronically.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 14 (PDF p. 7)"},{"id":47,"type":"single","stem":"During a power failure, about how long does a typical anesthesia machine backup battery last?","options":["About 40 minutes","Indefinitely, while alarms are muted","About 5 minutes","About 8 hours"],"answer":[0],"explanation":"The backup battery usually provides power for approximately 40 minutes (some machines 1-2 hours). Know exactly what runs on battery alone (monitors, alarms, ventilator), and confirm it's charged on the machine check.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 25 (PDF p. 13)"},{"id":48,"type":"single","stem":"The morning machine check was delegated to an anesthesia tech. What does the lecture advise before starting the first case?","options":["Skip it, since delegation makes it the tech's responsibility","Check only the O2 cylinder pressure","Confirm the check was actually completed","Repeat only the vaporizer check"],"answer":[2],"explanation":"Most hypoxemia hazards trace back to an incomplete or skipped machine check. The lecture says to confirm the morning check was actually completed, especially when it's delegated to a tech.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 19 (PDF p. 10)"},{"id":49,"type":"single","stem":"In the lecture's analogy between Ohm's law (E = I x R) and hemodynamics (BP = CO x SVR), which pairing is correct?","options":["Voltage = BP; current = SVR; resistance = cardiac output","Voltage = SVR; current = cardiac output; resistance = BP","Voltage = cardiac output; current = BP; resistance = SVR","Voltage = BP; current = cardiac output; resistance = SVR"],"answer":[3],"explanation":"E = I x R maps onto BP = CO x SVR: voltage corresponds to blood pressure, current to cardiac output, and resistance to systemic vascular resistance.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 26 (PDF p. 13)"},{"id":50,"type":"single","stem":"On this slide, the highlighted hypoxemia hazards share what feature, according to the instructor's notes?","options":["They're usually picked up on the machine check","They can only be detected by pulse oximetry","They're all caused by pipeline failures","They all originate upstream of the workstation"],"answer":[0],"explanation":"The instructor's note: highlighted things are usually picked up on the machine check (crossed hoses, disconnected hose, failed backup O2, empty or closed cylinder, bad valves, circuit leak, inadequate fresh O2, inadequate ventilation). The upstream items (liquid reservoir, crossed hospital pipelines, closed pipeline valves) aren't highlighted.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 19 (PDF p. 10)","imageRef":"hz_hypox"},{"id":51,"type":"single","stem":"Mid-case, the machine switches to battery after a building power failure. What is the best use of the battery window?","options":["Wait for the low-battery alarm before changing anything","Turn off the monitors to save battery for the ventilator","Switch to desflurane, since it's independent of power","Set up a Mapleson for ventilation and a TIVA infusion now"],"answer":[3],"explanation":"The battery buys roughly 40 minutes to 2 hours. The lecture says to use that window to set up alternatives, like a Mapleson for ventilation and an IV infusion such as propofol, so the patient is safely covered well before the battery runs out (generally within about an hour). Des vaporizers need power.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slides 25, 32 (PDF p. 13, 16)"},{"id":52,"type":"select-3","stem":"Which hypoxemia hazards originate upstream of the workstation? Select 3.","options":["Closed pipeline valves","Disconnected O2 hose in the OR","Incompetent circuit unidirectional valves","Liquid O2 reservoir empty or filled with nitrogen","Crossed hospital pipelines","Empty O2 cylinder on the machine"],"answer":[0,3,4],"explanation":"The slide lists these under 'upstream of the workstation': the liquid O2 reservoir, crossed hospital pipelines, and closed pipeline valves. An empty machine cylinder, a disconnected OR hose, and incompetent valves are at the workstation or circuit (and are among the highlighted items a machine check usually catches).","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 19 (PDF p. 10)"},{"id":53,"type":"single","stem":"After a case using an isolated ESU, the patient has a burn under the return pad, which had partly lifted. What explains this?","options":["The pad was placed too close to the surgical site","The isolated ESU leaked standard 60 Hz current to the pad","The ECG pads were placed too close to the return pad","Poor pad contact concentrated the current; isolation doesn't prevent it"],"answer":[3],"explanation":"The return electrode disperses current over a large area. If the pad doesn't make proper contact, current concentrates and can burn. Although the isolated ESU adds safety, it's no foolproof protection against burns from an improperly applied pad. Placing the pad close to the site is recommended.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 31 (PDF p. 16)"},{"id":54,"type":"single","stem":"A device draws 5 A at 120 V for 10 seconds. How much energy does it use?","options":["60 joules","600 joules","6,000 joules","60,000 joules"],"answer":[2],"explanation":"Power P = E x I = 120 V x 5 A = 600 watts. Energy = watts x seconds = 600 x 10 = 6,000 joules (watt-seconds), the same unit used for defibrillator output. 600 is the power in watts, not the energy.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 26 (PDF p. 13)"},{"id":55,"type":"single","stem":"A spontaneously breathing patient on a Mapleson A has a minute ventilation of 6 L/min. What is the minimum fresh gas flow per the lecture?","options":["About 2 L/min","About 4.2 L/min","About 9 L/min","About 15 L/min"],"answer":[1],"explanation":"Mapleson A (Magill) is used with spontaneously breathing patients and needs FGF of at least 0.7 x minute ventilation: 0.7 x 6 = 4.2 L/min. 9-15 L/min is the 1.5-2.5 x MV range for Mapleson B and C.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 21 (PDF p. 11)"},{"id":56,"type":"single","stem":"Why is pipeline O2 pressure (50-55 psi) deliberately set higher than the cylinder regulator output (40-45 psi)?","options":["So the machine draws from the pipeline and keeps the cylinder in reserve","So the fail-safe can sense which source is in use","So both sources mix to keep flow constant","So the cylinder supplies the machine and the pipeline stays in reserve"],"answer":[0],"explanation":"The difference is deliberate: when both are connected, gas is preferentially drawn from the pipeline, leaving the cylinder as backup. That's also why the pipeline must be disconnected to use the cylinder when the pipeline supply is contaminated.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 4 (PDF p. 2)"},{"id":57,"type":"single","stem":"During spontaneous ventilation, circuit pressure rises even though the APL is fully open. What else does the lecture list as a cause?","options":["Kinked tubing between the APL and scavenging interface","A disconnected O2 hose","An open negative-pressure relief valve","High fresh gas flow with an open APL"],"answer":[0],"explanation":"High pressure during spontaneous ventilation can come from APL closure, kinking or occlusion of the tubing between the APL and scavenging interface, or malfunction of the interface's positive-pressure relief valve. Gas that can't leave through the APL backs up into the circuit.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 23 (PDF p. 12)"},{"id":58,"type":"single","stem":"An airway fire flashes in the ETT. What does current teaching say about removing the tube and stopping gas flow?","options":["Stop gases first, then remove the tube","Pour saline first, then decide","Do both simultaneously","Remove the tube first, then stop gases"],"answer":[2],"explanation":"For an airway fire: simultaneously remove the tracheal tube and stop gases or disconnect the circuit, pour saline into the airway, remove burning material, then mask ventilate, assess injury, consider bronchoscopy, and reintubate.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 36 (PDF p. 18)"},{"id":59,"type":"single","stem":"On an older field machine, a freestanding PEEP valve is attached in the wrong position. Where does the lecture say it can cause obstruction?","options":["In the inspiratory limb of a circle system","At the scavenging interface","In the expiratory limb of a circle system","At the common gas outlet"],"answer":[0],"explanation":"A freestanding PEEP valve may cause obstruction if it's incorrectly placed in the inspiratory limb. These valves are rarely used now since PEEP is built into most machines.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 22 (PDF p. 11)"},{"id":60,"type":"select-3","stem":"Which are fire PREPARATION steps, as opposed to response or aftermath steps? Select 3.","options":["Pour saline into the airway","Assign each person a task in advance","Practice responses with fire drills","Preserve the scene for the risk manager","Train personnel in OR fire management","Turn off the medical gas supply to the room"],"answer":[1,2,4],"explanation":"Preparation: train personnel, practice fire drills, ensure equipment is available, identify high-risk situations, decide how to prevent and manage a fire, and assign each person a task. Turning off room gases is a failure-to-extinguish step, saline in the airway is airway fire management, and preserving the scene comes after.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slides 34, 36, 38, 39 (PDF p. 17, 18, 19, 20)"},{"id":61,"type":"single","stem":"A defibrillator delivers 200 joules. How is that energy expressed in the lecture's terms?","options":["200 watt-seconds","200 volts","200 amperes","200 ohms"],"answer":[0],"explanation":"Power (watts) = voltage x current, and electrical work = watts x time. The watt-second (joule) is the unit for energy expended, which is how defibrillator discharge is measured.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 26 (PDF p. 13)"},{"id":62,"type":"select-3","stem":"Which of these are aggravating factors in anesthesia adverse events, per the lecture? Select 3.","options":["Lack of familiarity with equipment","Routine fire drills","Failure to check equipment","Redundant alarm systems","Inattention","Standardized connector sizes"],"answer":[0,2,4],"explanation":"The listed aggravating factors: failure to check equipment, lack of familiarity with equipment, inexperience, haste, inattention, distraction, and fatigue. Standardized connectors, redundant alarms, and fire drills are protective measures.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 18 (PDF p. 9)"},{"id":63,"type":"single","stem":"During a prolonged power failure, why does the machine cut all power when battery voltage falls below about 10 V?","options":["To prevent deep discharge of the battery","To protect the O2 fail-safe valve","To force the ventilator into manual mode","To reset the circuit breakers"],"answer":[0],"explanation":"When battery voltage drops below about 10 V, all power to the machine ceases to prevent deep discharge. Failure of the battery stops the monitors, alarms, and ventilator, so plan an alternative well before that point.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 25 (PDF p. 13)"},{"id":64,"type":"single","stem":"A machine has two flowmeter tubes for O2 connected in series. What is the purpose of the first tube?","options":["Measurement of high flows only","Calibration of the second tube","Accurate measurement of low flows","A backup if the second tube cracks"],"answer":[2],"explanation":"When two flowmeters are present, the first permits accurate measurement of low flows and the second measures higher flows. The Thorpe tube is tapered, narrower at the bottom, with a ball or bobbin float.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 12 (PDF p. 6)"},{"id":65,"type":"single","stem":"ESU current (500 kHz to 1 MHz) can pass across the precordium. Why doesn't it cause ventricular fibrillation?","options":["OR power is ungrounded, which blocks cardiac current","Its high frequency has low tissue penetration and doesn't excite heart cells","The return pad blocks the current from reaching the chest","The ESU uses DC, which needs three times more current"],"answer":[1],"explanation":"The ESU generates radiofrequency current that behaves differently from standard 60 Hz AC: it has low tissue penetration and doesn't excite contractile cells, so it can pass through the precordium without causing V-fib.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 31 (PDF p. 16)"},{"id":66,"type":"single","stem":"A spontaneously breathing patient needs transport, and you plan FGF of 0.7 x minute ventilation. Which numbered circuit is appropriate?","options":["Circuit 1","Circuit 2","Circuit 3","Any of the three at that flow"],"answer":[0],"explanation":"Circuit 1 is the Mapleson A (Magill): fresh gas enters at the bag end, with the relief valve near the patient. It's the circuit for spontaneous breathing and needs FGF of at least 0.7 x MV. Circuits 2 and 3 are Mapleson B and C, which need 1.5-2.5 x MV.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 21 (PDF p. 11)","imageRef":"hz_mapleson"},{"id":67,"type":"select-3","stem":"Which belong in an OR's contingency plan for a prolonged power failure during a desflurane anesthetic? Select 3.","options":["A Mapleson system for ventilation","Waiting for the low-battery alarm before acting","Relying on the Tec 6 vaporizer while on battery","Having the plan in place well before the battery runs out","Switching to an Aladin cassette for agent delivery","An IV anesthetic infusion such as propofol"],"answer":[0,3,5],"explanation":"Every OR needs a contingency plan. Use the battery window to set up a Mapleson for ventilation and a TIVA infusion, and have the patient covered well before the battery is gone (generally within about an hour). The Tec 6 and Aladin both depend on electrical power.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 32 (PDF p. 16)"},{"id":68,"type":"single","stem":"These cylinder valves are shown with their gas labels removed. Which numbered valve belongs to an Entonox cylinder?","options":["Valve 1","Valve 3","Valve 4","Valve 5"],"answer":[3],"explanation":"Entonox uses a single pin-index position (7), and valve 5 is the only one with a single hole. The two-hole valves are O2 (2,5), N2O (3,5), air (1,5), and CO2 (1,6).","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 7 (PDF p. 4)","imageRef":"hz_piss"},{"id":69,"type":"select-2","stem":"Which statements about adverse events in anesthesia practice match the lecture? Select 2.","options":["Most are multifactorial","Human error is responsible for the majority","Most are caused by isolated equipment failures","Most involve a single root cause","Most occur only during induction","Equipment problems are too rare to matter"],"answer":[0,1],"explanation":"Most adverse events are multifactorial, combining system problems, human factors, and technical failures, and human error is responsible for the majority. The instructor stressed that low incidence doesn't mean equipment issues are safe to ignore.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 17 (PDF p. 9)"},{"id":70,"type":"single","stem":"Why does a machine need a proportioning system in addition to the O2 fail-safe valve?","options":["It doesn't function at all on modern electronic machines","It measures inspired O2, which responds too slowly","It only cuts N2O when O2 pressure falls; it can't stop a bad flow ratio","It only works while the machine runs on cylinder O2"],"answer":[2],"explanation":"The pressure-sensor shut-off (fail-safe) only interrupts or reduces N2O when O2 pressure falls; it doesn't prevent a hypoxic mixture reaching the common gas outlet when O2 pressure is normal but flow settings are wrong. The proportioning system addresses the flow ratio.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 14 (PDF p. 7)"},{"id":71,"type":"single","stem":"Which hypercarbia hazard applies to a system WITHOUT carbon dioxide absorption?","options":["Absorbent desiccation","Inadequate fresh gas flow","Channeling in the canister","Exhausted absorbent"],"answer":[1],"explanation":"In a system without CO2 absorption, fresh gas flow is what clears CO2, so inadequate FGF causes rebreathing. Exhausted absorbent and channeling are hazards of systems WITH an absorber.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 20 (PDF p. 10)"},{"id":72,"type":"single","stem":"What protects the machine's AC power supply, battery, and convenience receptacles?","options":["The ESU return pad","Circuit breakers","The backup battery","The line isolation monitor"],"answer":[1],"explanation":"The workstation's electrical portion has several circuit breakers, which generally protect circuits for the AC supply, the battery, and the convenience receptacles. The power cord runs 90-130 V AC at 50-60 Hz.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 25 (PDF p. 13)"},{"id":73,"type":"single","stem":"Which sequence matches the lecture's risk management steps?","options":["Define problems, estimate likelihood, weigh resources, apply solutions, monitor","Monitor, define problems, weigh resources, apply solutions, estimate likelihood","Estimate likelihood, apply solutions, define problems, monitor, weigh resources","Apply solutions, define problems, monitor, estimate likelihood, weigh resources"],"answer":[0],"explanation":"Risk management: define potential problems, estimate the likelihood of occurrence, weigh the benefits of expending available resources, apply solutions, and monitor.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 16 (PDF p. 8)"},{"id":74,"type":"single","stem":"After the machine check, the O2 cylinder is left open. At 2 a.m., the pipeline fails during an emergency case. When does the O2 supply alarm sound?","options":["Immediately when pipeline pressure starts to fall","Only after the cylinder has quietly emptied","Never, because the cylinder takes over permanently","When the fail-safe valve closes the N2O line"],"answer":[1],"explanation":"With the cylinder open, the machine starts drawing from it as soon as pipeline pressure drops, so supply pressure stays up and no alarm sounds until the cylinder is empty. That's why the cylinder should be closed after checking it: the alarm then warns you at the pipeline failure while a full backup is still available.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 4 (PDF p. 2)"},{"id":75,"type":"single","stem":"A circle system is assembled with the fresh gas inlet between the patient and the expiratory unidirectional valve. What is the problem?","options":["The APL can no longer vent","Fresh gas bypasses the patient, promoting rebreathing","The absorber is bypassed entirely","Fresh gas pressure closes the inspiratory valve"],"answer":[1],"explanation":"The circle must be arranged to prevent rebreathing, and three arrangements must be avoided: fresh gas inlet between the patient and expiratory valve, APL between the patient and inspiratory valve, and reservoir bag between the patient and either valve. Misplacing the inlet sends fresh gas out the expiratory side instead of to the patient.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 20 (PDF p. 10)"},{"id":76,"type":"single","stem":"After the workstation battery is fully exhausted, which functions remain available?","options":["The ventilator and monitors on reduced power","Nothing; all O2 delivery stops","Emergency O2 and conventional mechanical vaporizers","Electronic flow control and alarms"],"answer":[2],"explanation":"Once the battery is exhausted, only basic functions remain: emergency oxygen, which can be used with a conventional variable bypass vaporizer. The ventilator, monitors, and alarms are lost.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 32 (PDF p. 16)"},{"id":77,"type":"single","stem":"A machine has an outlet check valve. How must the low-pressure system be tested for leaks?","options":["With the O2 flush while occluding the Y-piece","It can't be tested for leaks","With positive pressure at the common gas outlet","With negative pressure"],"answer":[3],"explanation":"Without a check valve, low-pressure leaks can be found by applying positive pressure at the common gas outlet. With a check valve, positive pressure can't reach the upstream components, so negative pressure must be applied.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 15 (PDF p. 8)"},{"id":78,"type":"single","stem":"Which agent-delivery hazard does the lecture list along with dial design and incorrect filling?","options":["Low O2 supply pressure at the inlet","Crossed pipeline supply hoses","Exhausted CO2 absorbent granules","Liquid agent in the fresh gas piping"],"answer":[3],"explanation":"Anesthetic agent dosage and administration problems: liquid agent in the fresh gas piping, concentration dial design, incorrect filling, and simultaneous use of more than one vaporizer. Tipping a vaporizer can put liquid where it doesn't belong.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 24 (PDF p. 12)"},{"id":79,"type":"select-3","stem":"Which are functions of the cylinder hanger yoke? Select 3.","options":["Ensures unidirectional flow into the machine","Links O2 and N2O flows","Reduces cylinder pressure to about 45 psi","Orients the cylinder","Provides a gas-tight seal","Displays the cylinder's remaining volume"],"answer":[0,3,4],"explanation":"The hanger yoke orients the cylinder, provides a gas-tight seal, and ensures unidirectional flow into the machine; it also contains a filter. Reducing pressure is the regulator's job just distal to the yoke, the gauge shows pressure, and the proportioning system links O2 and N2O.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 9 (PDF p. 5)"},{"id":80,"type":"single","stem":"The machine check keeps failing the leak test, and no single loose component can be found. Per the instructor's notes, what usually fixes it?","options":["Recalibrating the O2 analyzer","Replacing the scavenging interface","Replacing the O2 cylinder","Swapping the breathing circuit"],"answer":[3],"explanation":"Breathing circuit leaks are a common failure point, and the note says swapping the circuit usually fixes a failed leak check. Circuit leaks are one of the highlighted hypoxemia hazards usually caught on the machine check.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 19 (PDF p. 10)"},{"id":81,"type":"select-3","stem":"Which components are part of the lecture's definition of the anesthesia workstation? Select 3.","options":["Wall suction regulator","Anesthetic gas scavenging system","Gas delivery system","Operating room ventilation system","Hospital bulk liquid O2 tank","Anesthesia ventilator"],"answer":[1,2,5],"explanation":"The workstation is defined as the gas delivery system, breathing system, scavenging system, vapor delivery system, ventilator, and associated monitoring and protection devices. The bulk O2 tank and OR ventilation are facility systems upstream of or around the workstation.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 2 (PDF p. 1)"},{"id":82,"type":"single","stem":"Why does the lecture say risk management is especially difficult in anesthesia?","options":["Equipment failures cause the majority of adverse events","Complications are frequent enough to overwhelm reporting","Complications only occur inside the operating room","Complications are rare, so providers get little practice responding"],"answer":[3],"explanation":"The difficulty is the rarity of events: it's hard to develop solutions for events that rarely happen, and that rarity creates its own hazard because providers aren't experienced or trained to respond. Complications also aren't isolated to the OR; they can trace through pre-op, PACU, and the floor.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 16 (PDF p. 8)"},{"id":83,"type":"single","stem":"A capacitor in a DC circuit is connected to a battery. What happens to current flow?","options":["Only a momentary current flows while the plates charge","Current flows continuously through the insulator","Current reverses direction at regular intervals","No current flows at any time"],"answer":[0],"explanation":"A capacitor is two parallel conductors separated by an insulator. In a DC circuit, the plates charge with only a momentary current flow; no further current flows unless a resistance connects the plates and discharges the capacitor.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 28 (PDF p. 14)"},{"id":84,"type":"single","stem":"After an airway fire is controlled, a staff member starts throwing the burned ETT and circuit in the trash. What does the lecture say?","options":["Keep only the ETT; the circuit can be discarded","Discard everything promptly to prevent a second fire","That's fine once photos of the scene are taken","Stop; preserve the scene, including tube, circuit, and drapes"],"answer":[3],"explanation":"Risk management after a fire: preserve the scene, notify the hospital risk manager, follow reporting requirements, treat it as an adverse event, and run fire drills. Leave everything in place, including the ET tube, circuit, and pulled drapes.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 39 (PDF p. 20)"},{"id":85,"type":"single","stem":"How does grounding in the operating room differ from grounding at home?","options":["Both power and equipment are ungrounded in the OR","OR power is ungrounded while equipment is grounded","Both power and equipment are grounded in the OR","OR power is grounded while equipment is ungrounded"],"answer":[1],"explanation":"At home, electrical power is grounded and equipment may or may not be. In the OR it's the opposite: power is usually ungrounded, and the equipment is grounded.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 29 (PDF p. 15)"},{"id":86,"type":"single","stem":"Why is power supplied to most ORs ungrounded?","options":["So OR equipment can run safely without being grounded","To isolate current from ground potential, protecting against macroshock","So the ESU can work without a dispersive return pad","To lower electrical costs for high-draw OR equipment"],"answer":[1],"explanation":"With many devices, cords, and spilled fluids, the OR is an electrically hazardous environment. Ungrounded power isolates current from ground potential, an additional measure of protection from macroshock.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 30 (PDF p. 15)"},{"id":87,"type":"single","stem":"Which items does the lecture list as reported causes of total occlusion of the breathing circuit?","options":["An APL valve left fully open during ventilation","Loose vaporizer filler caps on the manifold","Filters, misconnected humidifiers, and defective tubing","Exhausted absorbent and channeling in the canister"],"answer":[2],"explanation":"Filters in the circuit, incorrectly connected humidifiers, manufacturing defects in tubing, and failure to remove plastic wrapping have all been reported as causes of total breathing-circuit occlusion. Adapters also risk misconnections.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 22 (PDF p. 11)"},{"id":88,"type":"select-2","stem":"Which statements about ESU safety match the lecture? Select 2.","options":["ECG pads should be placed right next to the surgical site","ESU current is standard 60 Hz AC","An isolated ESU doesn't prevent pad-contact burns","Prep solutions don't need to dry before cautery","The return pad should be placed far from the surgical site","Unit won't work unless pencil and pad are both connected"],"answer":[2,5],"explanation":"The ESU requires both the pencil and the return pad to be connected, which acts as a built-in safety check, but an isolated ESU is no foolproof protection against pad burns. Place the pad close to the site and ECG pads far away. ESU current is radiofrequency (500 kHz-1 MHz), and prep must dry first.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 31 (PDF p. 16)"},{"id":89,"type":"single","stem":"In the cylinder regulator described in the lecture, how is output held at about 45 psi?","options":["Two linked diaphragms use negative feedback to close the inlet","The fail-safe valve limits gas flow into the machine","A bimetallic strip responds to cylinder temperature","The provider adjusts a needle valve as pressure falls"],"answer":[0],"explanation":"Immediately distal to the hanger yoke, two diaphragms are connected by a rod. Gas entering pushes on the large diaphragm, which moves the small one to close the high-pressure inlet, a negative feedback loop that holds about 45 psi.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 9 (PDF p. 5)"},{"id":90,"type":"select-3","stem":"Which devices can the ESU's high-frequency energy interfere with, per the lecture? Select 3.","options":["Pulse oximeters","The O2 fail-safe valve","ECG","The pipeline check valves","Variable bypass vaporizers","Implanted cardiac pacemakers"],"answer":[0,2,5],"explanation":"Few things in the OR are immune to the Bovie: its high-frequency energy interferes with everything from the ECG signal to cardiac output computers, pulse oximeters, and implanted pacemakers. Pneumatic and mechanical components like the fail-safe, vaporizers, and check valves aren't affected.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 31 (PDF p. 16)"},{"id":91,"type":"single","stem":"Where should the ESU return pad and the ECG electrodes be placed relative to the surgical site?","options":["Both as far from the site as possible","Both close to the surgical site","Return pad far from the site; ECG pads close to it","Return pad close to the site; ECG pads as far away as feasible"],"answer":[3],"explanation":"It's prudent to place the return plate as close as possible to the operative site, and ECG pads as far from the site as feasible, keeping the current path short and away from monitoring leads.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 31 (PDF p. 16)"},{"id":92,"type":"select-2","stem":"Besides O2, N2O, and air, which pipeline connections on the lecture's DISS chart have their own gas-specific fittings? Select 2.","options":["Waste anesthetic gas disposal (WAGD)","Carbon dioxide for insufflation","Heliox mixture","Helium for heliox","Entonox (N2O/O2)","Suction"],"answer":[0,5],"explanation":"The DISS chart on slide 6 lists oxygen, nitrous oxide, air, suction, and WAGD, each with its own connector. CO2, helium, and Entonox appear on the cylinder (PISS) chart, not the DISS pipeline chart.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 6 (PDF p. 3)"},{"id":93,"type":"single","stem":"Why must each Thorpe tube flowmeter be calibrated for one specific gas?","options":["Each gas has a different critical temperature in the tube","The float material reacts differently with each gas","Gases differ in density and viscosity, which change the float position","Each gas arrives at a different pipeline supply pressure"],"answer":[2],"explanation":"Float height depends on the pressure needed to support it: viscosity governs at low (laminar) flows and density at high (turbulent) flows. Because gases differ in these properties, each flowmeter is gas-specific, though gases with similar densities would read similarly.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 12 (PDF p. 6)"},{"id":94,"type":"single","stem":"A brand-new breathing circuit won't pass gas during the machine check; pressure builds with the flush and nothing reaches the mask. What should be checked first?","options":["Leftover plastic wrapping on a connector","The O2 cylinder pressure","The vaporizer filler cap","The scavenger vacuum setting"],"answer":[0],"explanation":"Occlusions are usually from bent tubing, misconnections, or plastic wrapping not fully removed from breathing system components. Instructor note: watch for unremoved plastic wrapping; the machine check will catch it.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 22 (PDF p. 11)"},{"id":95,"type":"single","stem":"Which fire preparation step is typically done during the surgical time-out?","options":["Testing the ESU on a sponge","Pointing out the fire extinguisher location","Turning off room medical gases","Performing a full fire drill"],"answer":[1],"explanation":"During time-out, staff typically point out the fire extinguisher location, and some teams confirm bovie use, pad placement, and fire-risk precautions out loud. Preparation also includes training, drills, and assigning each person a task.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 34 (PDF p. 17)"},{"id":96,"type":"single","stem":"Besides adequate fresh gas flow, what design requirement does the lecture give for the Mapleson A tubing?","options":["Fitted with a unidirectional valve at the patient end","Short enough that the bag attaches right at the mask","Long enough that exhaled CO2 doesn't reach the reservoir bag","Shorter than the patient's anatomic dead space volume"],"answer":[2],"explanation":"For Mapleson A: FGF at least 0.7 x minute ventilation, AND the hose between the patient and reservoir bag must be long enough that exhaled CO2 doesn't reach the bag.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 21 (PDF p. 11)"},{"id":97,"type":"select-3","stem":"Which are fire-prevention measures listed in the lecture? Select 3.","options":["Tuck drapes tightly around the face during MAC","Use N2O in place of O2 to lower flammability","Configure drapes to avoid buildup of oxidizer","Moisten gauze and sponges near the ignition source","Let prep solutions pool so they stay moist","Avoid N2O"],"answer":[2,3,5],"explanation":"Prevention: let flammable skin prep dry before draping, configure drapes to avoid oxidizer buildup, keep O2 as low as clinically possible, avoid N2O, notify the surgeon when oxidizer and ignition are close, and moisten gauze near the ignition source. N2O is an oxidizer, and tucking drapes traps O2.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 35 (PDF p. 18)"},{"id":98,"type":"single","stem":"Some machines have an outlet check valve and a pressure relief valve near the common gas outlet. What do they protect?","options":["The scavenger, from excessive suction at the interface","The patient's lungs, from O2 flush pressure surges","The hospital pipeline, from backflow of anesthetic gas","The vaporizers, from excess pressure during a downstream obstruction"],"answer":[3],"explanation":"The check valve and pressure relief valve prevent buildup of excessive pressure within the vaporizers in the event of a downstream obstruction.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 15 (PDF p. 8)"},{"id":99,"type":"single","stem":"During facial surgery under MAC, the patient has O2 by nasal cannula and the surgeon is about to use cautery near the face. What does the lecture emphasize?","options":["Switch the cannula to N2O to lower the O2 concentration","Tuck the drapes tightly around the face to contain the O2","Keep FiO2 as low as tolerated and tell the surgeon where O2 flows","Increase O2 flow to create a protective O2 layer"],"answer":[2],"explanation":"Be especially cautious with open O2 delivery near the airway: keep FiO2 as low as clinically possible, avoid N2O (also an oxidizer), configure drapes so oxidizer doesn't build up, and notify the surgeon when oxidizer and ignition source are close.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 35 (PDF p. 18)"},{"id":100,"type":"single","stem":"Per the lecture audio, why can't anesthesia complications be analyzed as isolated OR events?","options":["They can trace through pre-op, PACU, post-op, and the floor","They're never reported outside the operating room","Their causes are always found in the anesthesia equipment","They occur only during induction and emergence phases"],"answer":[0],"explanation":"A complication often isn't isolated to the OR; it can trace through pre-op, PACU, post-op, and the floor. That, plus rarity and limited risk-management training, makes anesthesia risk harder to study.","citation":"Anesthesia Workstation Hazards & Safety (McPherson): slide 16 (PDF p. 8)"}];

const STORE='SRNA_HAZARDS_BANK_2_2026_V1';

function loadDB(){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(x)db={...db,...x}}catch(e){};currentIndex=Math.min(db.current||0,99)}

function mbuIsFlagged(q){return window.MBUStudio?MBUStudio.flagged('haz3',q):false}

function same(a,b){a=[...(a||[])].sort((x,y)=>x-y);b=[...b].sort((x,y)=>x-y);return a.length===b.length&&a.every((v,i)=>v===b[i])}
function renderDashboard(){clearTimeout(autoTimer);window.MBUCalculator?.hide();document.getElementById('quiz').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');const done=Object.keys(db.graded).filter(k=>db.graded[k]).length,good=Object.keys(db.correct).filter(k=>db.correct[k]).length,miss=db.missed.length,score=done?Math.round(good/done*100):0;document.getElementById('cards').innerHTML=`<div class="card"><h3>Practice Set 3</h3><div class="mini">100 questions</div><div class="bar"><span style="width:${done}%"></span></div><div class="mini">${done}/100 completed · ${score}% score · ${miss} missed</div><div class="row" style="margin-top:14px"><button class="btn" onclick="startSet()">${done?'Continue':'Start'} Practice Set 3</button><button class="btn out" ${miss?'':'disabled'} onclick="reviewMissed()">Review Missed</button></div></div>`;document.getElementById('overall').textContent=`Overall: ${done}/100 completed · ${score}% score · ${miss} missed`}

function loadQuestion(){clearTimeout(autoTimer);const q=QUESTIONS[currentIndex],k=String(q.id);saveDB();mbuUpdateFlag(q);document.getElementById('mbuNavigator').innerHTML=QUESTIONS.map((x,i)=>{const graded=!!db.graded[x.id],cl=[i===currentIndex?'cur':'',mbuIsFlagged(x)?'flag':'',graded?(db.correct[x.id]?'ok':'no'):''].filter(Boolean).join(' ');return `<button class="${cl}" onclick="currentIndex=${i};loadQuestion()">${i+1}${mbuIsFlagged(x)?'⚑':''}</button>`}).join('');document.getElementById('set-badge').textContent='PRACTICE SET 3';document.getElementById('progress').textContent=`Question ${currentIndex+1} of 100 · Q${q.id}`;document.getElementById('type').textContent=q.type==='single'?'Single Best Answer':`Select ${q.answer.length} Options`;document.getElementById('stem').textContent=q.stem;const im=document.getElementById('image');if(q.imageSvg){im.classList.remove('hidden');im.innerHTML=q.imageSvg}else if(q.imageRef){im.classList.remove('hidden');im.innerHTML=`<div class="mini"><strong>Figure reference:</strong> ${q.imageRef}</div>`}else{im.classList.add('hidden');im.innerHTML=''}const selected=db.answers[k]||[],graded=!!db.graded[k],opts=document.getElementById('options');opts.innerHTML='';q.options.forEach((txt,i)=>{const b=document.createElement('button');b.className='opt';if(selected.includes(i))b.classList.add('selected');const sk=`${k}_${i}`;if(db.strikes[sk])b.classList.add('strike');b.innerHTML=`<span class="prefix">${String.fromCharCode(65+i)}.</span><span>${txt}</span>`;b.oncontextmenu=e=>{e.preventDefault();if(graded)return;db.strikes[sk]=!db.strikes[sk];b.classList.toggle('strike');saveDB()};if(graded){b.classList.add('locked');if(q.answer.includes(i))b.classList.add('correct');else if(selected.includes(i))b.classList.add('incorrect')}else b.onclick=()=>choose(i);const row=document.createElement('div');row.className='mbu-choice-row';const cross=document.createElement('button');cross.type='button';cross.className='mbu-cross';cross.textContent='✕';cross.setAttribute('aria-label',`Cross out option ${String.fromCharCode(65+i)}`);cross.setAttribute('aria-pressed',String(!!db.strikes[sk]));cross.disabled=graded;cross.onclick=()=>{b.oncontextmenu({preventDefault(){}});cross.setAttribute('aria-pressed',String(!!db.strikes[sk]))};row.append(b,cross);opts.appendChild(row)});const ex=document.getElementById('explain');if(graded){ex.style.display='block';document.getElementById('explain-text').innerHTML=`<strong>Explanation:</strong> ${q.explanation||''}`;document.getElementById('citation').textContent=q.citation?`Source: ${q.citation}`:''}else ex.style.display='none';const submit=document.getElementById('submit-multi'),row=document.getElementById('multi-submit-row');if(!graded){row.style.display='flex';submit.disabled=q.type==='single'?selected.length!==1:selected.length!==q.answer.length;submit.textContent=q.type==='single'?'Submit Answer':`Submit Selections (${selected.length}/${q.answer.length})`}else row.style.display='none';updateStats();document.getElementById('prev').disabled=currentIndex===0;document.getElementById('next').style.visibility=graded||currentIndex<99?'visible':'hidden';window.MBUCalculator?.besideFlag()}
function choose(i){const q=QUESTIONS[currentIndex],k=String(q.id);if(db.graded[k])return;let a=db.answers[k]||[];if(q.type==='single')a=[i];else if(a.includes(i))a=a.filter(x=>x!==i);else if(a.length<q.answer.length)a=[...a,i];db.answers[k]=a;saveDB();loadQuestion()}

<!doctype html>

<style>
:root{--p:#1a365d;--pl:#2b6cb0;--ok:#22543d;--okbg:#c6f6d5;--bad:#742a2a;--badbg:#fed7d7;--bg:#edf2f7;--soft:#f7fafc;--b:#cbd5e0;--t:#2d3748;--mut:#718096}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}body{margin:0;background:var(--bg);color:var(--t);line-height:1.5;padding:20px}.wrap{max-width:1040px;margin:auto}.panel{background:white;border-radius:10px;box-shadow:0 4px 12px #00000012;padding:28px}.hero{display:flex;justify-content:space-between;align-items:end;border-bottom:2px solid var(--b);padding-bottom:18px;margin-bottom:22px}.hero h1{margin:0;color:#1a202c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{border:1px solid var(--b);border-radius:9px;padding:18px;background:#fff}.card h3{margin:0 0 6px}.mini{color:var(--mut);font-size:.9rem}.bar{height:9px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin:12px 0}.bar>span{display:block;height:100%;background:var(--pl)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:6px;background:var(--p);color:white;padding:10px 16px;font-weight:700;cursor:pointer}.btn.out{background:white;color:var(--p);border:1.5px solid var(--p)}.btn.bad{background:#9b2c2c}.btn:disabled{background:#cbd5e0;color:white;border-color:#cbd5e0;cursor:not-allowed}.header{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:2px solid var(--b);padding-bottom:14px;margin-bottom:18px}.badge{background:var(--p);color:#fff;padding:5px 14px;border-radius:999px;font-size:.85rem;font-weight:800}.progress{font-weight:700;color:#4a5568}.stats{display:flex;gap:22px;flex-wrap:wrap;background:var(--soft);border:1px solid var(--b);padding:12px 16px;border-radius:7px;margin-bottom:20px}.type{font-size:.84rem;color:#b7791f;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}.stem{font-size:1.12rem;font-weight:650;color:#1a202c;margin-bottom:18px}.image{display:flex;justify-content:center;margin:15px 0 20px}.image img{max-width:100%;max-height:430px;height:auto;border:1px solid var(--b);border-radius:6px;background:#fff}.options{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}.opt{display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 16px;border:1.5px solid var(--b);border-radius:6px;background:white;text-align:left;font-size:.98rem;cursor:pointer}.opt:hover:not(.locked){background:var(--soft);border-color:var(--pl)}.opt.selected{border-color:var(--p);background:#ebf8ff;font-weight:650}.opt.correct{background:var(--okbg)!important;border-color:var(--ok)!important;color:var(--ok)!important;font-weight:750}.opt.incorrect{background:var(--badbg)!important;border-color:var(--bad)!important;color:var(--bad)!important}.opt.strike{text-decoration:line-through;opacity:.45}.prefix{font-weight:800;min-width:26px}.explain{display:none;margin-top:18px;padding:18px;border-radius:6px;background:#f8fafc;border-left:5px solid var(--p);font-size:.95rem}.cite{margin-top:10px;font-size:.85rem;font-weight:750;color:#4a5568}.controls{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--b);padding-top:16px;margin-top:24px}.hidden{display:none!important}.mbu-choice-row{display:flex;gap:8px;align-items:stretch}.mbu-choice-row .opt{flex:1;min-width:0}.mbu-cross{flex:0 0 44px;border:1px solid #cbd5e0;border-radius:8px;background:#fff;color:#4a5568;font-size:18px;cursor:pointer}.mbu-cross[aria-pressed="true"]{background:#fff5f5;color:#9b2c2c;border-color:#e53e3e}.mbu-cross:disabled{opacity:.5;cursor:default}.missed-box{margin-top:20px;border-top:1px solid var(--b);padding-top:18px}.missed-list{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.qchip{border:1px solid #feb2b2;background:#fff5f5;color:#9b2c2c;border-radius:999px;padding:5px 10px;font-weight:700;cursor:pointer}
@media(max-width:650px){body{padding:10px}.panel{padding:18px}.hero,.header,.controls{align-items:flex-start;flex-direction:column}.controls .row{width:100%}.controls .btn{flex:1}.stats{gap:10px}}
</style>

</head><body class="mbu-bank1-ui"><div class="wrap">
<section id="dashboard" class="panel"><div class="hero mbu-dashboard-header"><div class="mbu-dashboard-title"><h1>Combined Bank Dashboard</h1><div class="mini mbu-dashboard-overall" id="overall">0 / 150 completed</div></div></div><div id="cards" class="grid"></div><div id="missed-review" class="hidden"></div></section>
<section id="quiz" class="panel hidden"><div class="header"><div class="row"><span class="badge" id="set-badge"></span><button class="btn out" id="mbuFlagBtn" onclick="mbuToggleFlag(currentData[currentIndex])">☆ Flag</button><button class="btn out" onclick="mbuReportQuestion(currentData[currentIndex])">Report</button><button class="btn out" onclick="document.getElementById('mbuNavigator').classList.toggle('hidden')">Navigator</button><button class="btn out mbu-return" onclick="goDashboard()">← Combined Home</button></div><div class="progress" id="progress"></div></div>
<div class="stats"><div>Completed: <strong id="completed">0</strong>/<span id="total">0</span></div><div>Score: <strong id="score">0</strong>%</div><div>Missed: <strong id="missed">0</strong></div></div>
<div id="mbuNavigator" class="row hidden" style="flex-wrap:wrap;gap:6px;margin:8px 0 14px;max-height:180px;overflow:auto;padding:3px"></div><div class="type" id="type"></div><div class="stem" id="stem"></div><div class="mbu-crossout-hint">Tip: Right-click an answer to cross it out.</div><div class="image hidden" id="image"></div><div class="options" id="options"></div><div class="row" id="multi-submit-row" style="display:none;margin:4px 0 18px;justify-content:flex-end"><button class="btn" id="submit-multi" onclick="submitAnswer()">Submit Answer</button></div><div class="explain" id="explain"><div id="explain-text"></div><div class="cite" id="citation"></div></div><div class="controls"><button class="btn out" id="prev" onclick="nav(-1)">Previous</button><div class="row"><button class="btn out" onclick="resetCurrent()">Reset</button><button class="btn" id="next" onclick="nav(1)">Next</button></div></div></section>
</div>
<script src="combined-questions.js"></script><script src="../assets/studio-sync.js?v=63"></script><script src="../assets/navigator.js?v=63"></script>
<script>
const STORE='MBU_COMBINED_BANK_2026_V1',BANK_KEY='combined',LETTERS='ABCDEF';
const RAW=window.QUIZ_DATA?.questions||[];
const QUESTIONS=RAW.map((q,i)=>({id:String(q.id||('C'+(i+1))),seq:i+1,set:Math.floor(i/50)+1,type:q.type==='multi'?'multi':'single',n:Number(q.n)||1,stem:String(q.q||''),options:Array.isArray(q.c)?q.c:[],answer:(Array.isArray(q.a)?q.a:[q.a]).map(Number),explanation:String(q.exp||''),disc:q.disc||'',supp:q.supp||'',citation:Array.isArray(q.ref)?q.ref.join('; '):String(q.ref||''),topic:String(q.lec||q.concept||'Combined'),concept:String(q.concept||''),imageId:q.image_id||null}));
const SETS={1:QUESTIONS.slice(0,50),2:QUESTIONS.slice(50,100),3:QUESTIONS.slice(100,150)};
let db=loadDB(),currentSet=null,currentData=[],currentIndex=0,selected=new Set(),graded=false,autoTimer=null;
function blankState(){return{answers:{},graded:{},correct:{},strikes:{},current:0}}
function normalizeState(x){const out=blankState();if(!x||typeof x!=='object')return out;for(const k of ['answers','graded','correct','strikes'])if(x[k]&&typeof x[k]==='object'&&!Array.isArray(x[k]))out[k]=x[k];const c=Number(x.current);out.current=Number.isInteger(c)&&c>=0?c:0;return out}
function loadDB(){let x={sets:{}};try{const raw=localStorage.getItem(STORE);if(raw){const parsed=JSON.parse(raw);if(parsed&&typeof parsed==='object')x=parsed}}catch{};x.sets=x.sets&&typeof x.sets==='object'?x.sets:{};for(let s=1;s<=3;s++)x.sets[s]=normalizeState(x.sets[s]);return x}
let lastSaved='';function saveDB(){const next=JSON.stringify(db);if(next===lastSaved)return;localStorage.setItem(STORE,next);lastSaved=next}
function state(){return db.sets[currentSet]}
function qKey(q){return q.id}
function mbuIsFlagged(q){return MBUStudio.flagged(BANK_KEY,q)}
function mbuToggleFlag(q){MBUStudio.toggleFlag(BANK_KEY,q);loadQuestion()}
function mbuStudioAnswer(q,ok){MBUStudio.answer(BANK_KEY,q,ok)}
function mbuReportQuestion(q){return MBUStudio.report(BANK_KEY,q,{bankLabel:'Combined',set:q.set,questionNumber:q.seq,selected:[...selected]})}
function mbuUpdateFlag(q){const b=document.getElementById('mbuFlagBtn');if(b)b.textContent=mbuIsFlagged(q)?'★ Flagged':'☆ Flag'}
function statsFor(set){const st=db.sets[set],base=SETS[set];let done=0,good=0;for(const q of base){const k=qKey(q);if(st.graded[k]){done++;if(st.correct[k])good++}}return{done,good,missed:done-good,pct:done?Math.round(100*good/done):0}}
function overall(){let done=0,good=0;for(let s=1;s<=3;s++){const x=statsFor(s);done+=x.done;good+=x.good}return{done,good}}
function missedQuestions(){const out=[];for(let s=1;s<=3;s++){const st=db.sets[s];for(const q of SETS[s])if(st.graded[qKey(q)]&&!st.correct[qKey(q)])out.push(q)}return out}
function renderDashboard(){
 clearTimeout(autoTimer);autoTimer=null;document.getElementById('quiz').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');window.MBUCalculator?.hide();
 const o=overall();document.getElementById('overall').textContent=o.done+' / 150 completed';
 document.getElementById('cards').innerHTML=[1,2,3].map(s=>{const x=statsFor(s),started=x.done>0;return '<div class="card"><h3>Practice Set '+s+'</h3><div class="mini">'+x.done+' / 50 completed · '+x.pct+'%</div><div class="bar"><span style="width:'+(x.done*2)+'%"></span></div><div class="row"><button class="btn" onclick="startSet('+s+')">'+(started?'Continue':'Start')+'</button><button class="btn out" onclick="resetSet('+s+')">Reset</button></div></div>'}).join('');
 const m=missedQuestions(),box=document.getElementById('missed-review');box.classList.toggle('hidden',!m.length);box.innerHTML=m.length?'<div class="missed-box"><h3>Missed Questions</h3><div class="mini">'+m.length+' cumulative missed across Combined.</div><div class="row" style="margin-top:10px"><button class="btn out" onclick="location.href=\'studio.html?mode=combined-missed&return=combined\'">Review in Study Studio</button></div></div>':'';
}
function showQuiz(){document.getElementById('dashboard').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');window.scrollTo(0,0)}
function startSet(s){currentSet=s;currentData=SETS[s];const st=db.sets[s];currentIndex=Math.min(Math.max(0,st.current||0),currentData.length-1);showQuiz();loadQuestion()}
function goDashboard(){clearTimeout(autoTimer);autoTimer=null;if(currentSet){db.sets[currentSet].current=currentIndex;saveDB()}renderDashboard();window.scrollTo(0,0)}
let combinedImageSourcePromise=null;
function combinedImageSource(){
 if(!combinedImageSourcePromise)combinedImageSourcePromise=fetch('combined-images.js',{cache:'force-cache'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()});
 return combinedImageSourcePromise
}
async function hydrateCombinedImage(q,host){
 if(!q.imageId){host.innerHTML='';host.classList.add('hidden');return}
 host.classList.remove('hidden');host.innerHTML='<span class="mini">Loading figure…</span>';
 try{
  const src=await combinedImageSource();if(currentData[currentIndex]?.id!==q.id)return;
  const safe=String(q.imageId).replace(/[^A-Za-z0-9_-]/g,'');if(!safe||safe!==String(q.imageId))throw Error('invalid figure key');
  const start=src.indexOf('"'+safe+'"');if(start<0)throw Error('figure key not found');
  const match=src.slice(start).match(/"src"\s*:\s*"data:image\/(?:png|jpeg|gif|webp);base64,([A-Za-z0-9+/=]+)"/);if(!match)throw Error('figure payload not found');
  host.innerHTML='<img src="data:image/png;base64,'+match[1]+'" alt="Question figure">'
 }catch(e){if(currentData[currentIndex]?.id!==q.id)return;host.innerHTML='<span class="mini">Figure could not be loaded.</span>';console.error('Combined figure failed:',q.id,e)}
}
function loadQuestion(){clearTimeout(autoTimer);autoTimer=null;if(!currentData.length){goDashboard();return}const q=currentData[currentIndex],st=state(),k=qKey(q),saved=st.answers[k];selected=new Set(Array.isArray(saved)?saved:[]);graded=!!st.graded[k];
 document.getElementById('set-badge').textContent='COMBINED · PRACTICE SET '+currentSet;document.getElementById('progress').textContent='Question '+(currentIndex+1)+' / '+currentData.length;document.getElementById('type').textContent=(q.type==='multi'?'Select '+q.n:'Select 1')+' · '+q.topic;document.getElementById('stem').textContent=q.stem;
 const img=document.getElementById('image');hydrateCombinedImage(q,img);
 const opts=document.getElementById('options');opts.innerHTML='';q.options.forEach((t,i)=>{const row=document.createElement('div');row.className='mbu-choice-row';const b=document.createElement('button');b.className='opt';b.dataset.i=i;b.innerHTML='<span class="prefix">'+LETTERS[i]+'</span><span></span>';b.lastChild.textContent=t;const cross=document.createElement('button');cross.className='mbu-cross';cross.type='button';cross.textContent='✕';cross.setAttribute('aria-label','Cross out '+LETTERS[i]);const struck=!!st.strikes[k+':'+i];cross.setAttribute('aria-pressed',String(struck));if(struck)b.classList.add('strike');b.onclick=()=>pick(i);b.oncontextmenu=e=>{e.preventDefault();toggleCross(i,b,cross)};cross.onclick=()=>toggleCross(i,b,cross);row.append(b,cross);opts.append(row)});
 restoreAppearance(q);updateLiveStats();renderNavigator();mbuUpdateFlag(q);document.getElementById('prev').disabled=currentIndex===0;document.getElementById('next').disabled=currentIndex===currentData.length-1&&!graded;document.getElementById('next').style.visibility=(graded||currentIndex<currentData.length-1)?'visible':'hidden';window.MBUCalculator?.besideFlag()}
function restoreAppearance(q){const st=state(),k=qKey(q);document.querySelectorAll('#options .opt').forEach(b=>{const i=+b.dataset.i;b.classList.toggle('selected',!graded&&selected.has(i));b.classList.remove('correct','incorrect','missed','locked');if(graded){b.classList.add('locked');if(q.answer.includes(i))b.classList.add('correct');else if(selected.has(i))b.classList.add('incorrect')}});document.querySelectorAll('.mbu-cross').forEach(b=>b.disabled=graded);const row=document.getElementById('multi-submit-row');row.style.display=graded?'none':'flex';document.getElementById('submit-multi').disabled=graded||selected.size!==(q.type==='multi'?q.n:1);const ex=document.getElementById('explain');if(graded){const ok=!!st.correct[k];let text=(ok?'Correct. ':'Incorrect. ')+q.explanation;if(q.disc)text+=' Lecture discrepancy: '+q.disc;if(q.supp)text+=' Beyond the slide: '+q.supp;document.getElementById('explain-text').textContent=text;document.getElementById('citation').textContent=q.citation?'Source: '+q.citation:'';ex.style.display='block'}else ex.style.display='none'}
function pick(i){if(graded)return;const q=currentData[currentIndex];if(q.type==='single')selected=new Set([i]);else{if(selected.has(i))selected.delete(i);else if(selected.size<q.n)selected.add(i)}restoreAppearance(q)}
function toggleCross(i,b,cross){if(graded)return;const q=currentData[currentIndex],st=state(),key=qKey(q)+':'+i;st.strikes[key]=!st.strikes[key];if(!st.strikes[key])delete st.strikes[key];saveDB();b.classList.toggle('strike',!!st.strikes[key]);cross.setAttribute('aria-pressed',String(!!st.strikes[key]))}
function submitAnswer(){if(graded)return;const q=currentData[currentIndex],need=q.type==='multi'?q.n:1;if(selected.size!==need)return;const st=state(),k=qKey(q),chosen=[...selected].sort((a,b)=>a-b),ans=[...q.answer].sort((a,b)=>a-b),ok=chosen.length===ans.length&&chosen.every((v,i)=>v===ans[i]);st.answers[k]=chosen;st.graded[k]=true;st.correct[k]=ok;graded=true;saveDB();mbuStudioAnswer(q,ok);restoreAppearance(q);updateLiveStats();renderNavigator();if(ok&&currentIndex<currentData.length-1)autoTimer=setTimeout(()=>{autoTimer=null;nav(1)},350)}
function updateLiveStats(){const x=statsFor(currentSet);document.getElementById('completed').textContent=x.done;document.getElementById('total').textContent=currentData.length;document.getElementById('score').textContent=x.pct;document.getElementById('missed').textContent=x.missed}
function persistPosition(){if(currentSet)db.sets[currentSet].current=currentIndex;saveDB()}
function renderNavigator(){const st=state(),host=document.getElementById('mbuNavigator');host.innerHTML=currentData.map((q,i)=>{const k=qKey(q),result=st.graded[k]?!!st.correct[k]:null;return MBUNavigator.button({label:i+1,active:i===currentIndex,flagged:mbuIsFlagged(q),result,onClick:'clearTimeout(autoTimer);autoTimer=null;currentIndex='+i+';persistPosition();loadQuestion()'})}).join('')}
function nav(d){clearTimeout(autoTimer);autoTimer=null;const n=currentIndex+d;if(n>=0&&n<currentData.length){currentIndex=n;persistPosition();loadQuestion()}else if(d>0)goDashboard()}
function resetCurrent(){clearTimeout(autoTimer);autoTimer=null;if(!confirm('Reset progress for this quiz view?'))return;db.sets[currentSet]=blankState();currentIndex=0;saveDB();loadQuestion()}
function resetSet(s){if(!confirm('Reset Practice Set '+s+' progress?'))return;db.sets[s]=blankState();saveDB();renderDashboard()}
document.addEventListener('keydown',e=>{if(document.getElementById('quiz').classList.contains('hidden')||graded)return;const q=currentData[currentIndex],i=LETTERS.indexOf(e.key.toUpperCase());if(i>=0&&i<q.options.length){e.preventDefault();if(e.shiftKey){const b=document.querySelector('.opt[data-i="'+i+'"]'),x=b?.parentElement?.querySelector('.mbu-cross');if(b&&x)toggleCross(i,b,x)}else pick(i)}else if(e.key==='Enter'){e.preventDefault();submitAnswer()}});
renderDashboard();
</script><script src="../assets/calculator.js?v=63"></script><script>/* MBU_BUILD:2026-09-26-combined-bank1-parity-v74 */</script><script src="../assets/auto-update.js?v=63"></script></body></html>

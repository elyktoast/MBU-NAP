    "id": 1,
    "type": "single",
    "stem": "Prior to off-site transport of an intubated patient, an oxygen E-cylinder Bourdon gauge reads 950 psig. The transport requires an FiO2 of 1.0 at a constant mechanical minute ventilation of 10 L/min. What is the approximate maximum duration of oxygen delivery available before cylinder exhaustion?",
    "options": [
      "16 minutes",
      "33 minutes",
      "48 minutes",
      "66 minutes"
    ],
    "answer": [
      1
    ],
    "explanation": "At 1900 psig, a full O2 E-cylinder holds ~660 L (Boyle's Law: P1V1 = P2V2). At 950 psig, the cylinder is 50% full (330 L available). At a continuous flow rate of 10 L/min, total time available is 330 L / 10 L/min = 33 minutes.",
    "citation": "Medical Gas Systems in Anesthesia, Slides 12, 13"
  },

const SETS={1:SET1,2:SET2,3:SET3,4:SET4,5:SET5};
const STORE='SRNA_COMBINED_EXAM_SET_1_2026_V1';

let mode=null,currentSet=null,currentIndex=0,currentData=[],autoTimer=null;
function mbuIsFlagged(q){return MBUStudio.flagged(1,q)}

function blankState(){return {answers:{},graded:{},correct:{},strikes:{},current:0}}
function loadDB(){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(x)db=x}catch(e){};for(let s=1;s<=5;s++){if(!db.sets[s])db.sets[s]=blankState();if(!db.missed[s])db.missed[s]=[]}if(!db.test6)db.test6=blankState()}
function saveDB(){localStorage.setItem(STORE,JSON.stringify(db))}
function setState(){return mode==='test6'?db.test6:db.sets[currentSet]}
function missedAll(){let out=[];for(let s=1;s<=5;s++)for(const id of db.missed[s]){const q=SETS[s].find(x=>x.id===id);if(q)out.push({...q,_sourceSet:s})}return out}
function statsFor(s){const st=db.sets[s],done=Object.keys(st.graded).filter(k=>st.graded[k]).length,good=Object.keys(st.correct||{}).filter(k=>st.correct[k]).length;return {done,good,score:done?Math.round(good/done*100):0,miss:db.missed[s].length}}
function renderDashboard(){clearTimeout(autoTimer);window.MBUCalculator?.hide();document.getElementById('quiz').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');let td=0,tg=0;const cards=document.getElementById('cards');cards.innerHTML='';for(let s=1;s<=5;s++){const x=statsFor(s);td+=x.done;tg+=x.good;const c=document.createElement('div');c.className='card';c.innerHTML=`<h3>Practice Set ${s}</h3><div class="mini">100 questions</div><div class="bar"><span style="width:${x.done}%"></span></div><div class="mini">${x.done}/100 completed · ${x.score}% score · ${x.miss} missed</div><div class="row" style="margin-top:14px"><button class="btn" onclick="startSet(${s})">${x.done?'Continue':'Start'} Practice Set ${s}</button><button class="btn out" ${x.miss?'':'disabled'} onclick="reviewSet(${s})">Review Missed</button></div>`;cards.appendChild(c)}const m=missedAll().length;const c=document.createElement('div');c.className='card';c.innerHTML=`<h3>Missed Questions Review</h3><div class="mini">Automatically built from every question missed in Practice Sets 1–5.</div><div class="bar"><span style="width:${m?Math.min(100,Object.keys(db.test6.graded||{}).length/m*100):0}%"></span></div><div class="mini">${m} question${m===1?'':'s'} currently in the missed bank</div><div class="row" style="margin-top:14px"><button class="btn bad" ${m?'':'disabled'} onclick="startTest6()">Review Missed Questions</button></div>`;cards.appendChild(c);document.querySelector('.missed-box').classList.toggle('hidden',m===0);document.getElementById('overall').textContent=`Overall: ${td}/500 completed · ${td?Math.round(tg/td*100):0}% score · ${m} missed`;renderMissed()}
function renderMissed(){const box=document.getElementById('missed-review');box.innerHTML='';for(let s=1;s<=5;s++){const ids=db.missed[s];const d=document.createElement('div');d.style.marginTop='14px';d.innerHTML=`<strong>Practice Set ${s}</strong> <span class="mini">(${ids.length} missed)</span>`;const list=document.createElement('div');list.className='missed-list';if(!ids.length)list.innerHTML='<span class="mini">None</span>';else ids.forEach(id=>{const b=document.createElement('button');b.className='qchip';b.textContent=`Q${id}`;b.onclick=()=>openMissedQuestion(s,id);list.appendChild(b)});d.appendChild(list);box.appendChild(d)}}
function startSet(s){mode='set';currentSet=s;currentData=SETS[s];currentIndex=Math.min(db.sets[s].current||0,99);showQuiz();loadQuestion()}
function reviewSet(s){const ids=db.missed[s];if(!ids.length)return;mode='review';currentSet=s;currentData=SETS[s].filter(q=>ids.includes(q.id));currentIndex=0;showQuiz();loadQuestion()}
function openMissedQuestion(s,id){mode='review';currentSet=s;currentData=SETS[s].filter(q=>db.missed[s].includes(q.id));currentIndex=Math.max(0,currentData.findIndex(q=>q.id===id));showQuiz();loadQuestion()}
function startTest6(){mode='test6';currentSet=6;currentData=missedAll();if(!currentData.length)return;let first=currentData.findIndex(q=>!db.test6.graded[`t6_${q._sourceSet}_${q.id}`]);if(first<0){db.test6=blankState();first=0}currentIndex=first;showQuiz();loadQuestion()}
function showQuiz(){document.getElementById('dashboard').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');window.scrollTo(0,0)}
function keyFor(q){return mode==='set'?String(currentIndex):mode==='review'?`r${currentSet}_${q.id}`:`t6_${q._sourceSet}_${q.id}`}
function loadQuestion(){clearTimeout(autoTimer);if(!currentData.length){goDashboard();return}const q=currentData[currentIndex],st=setState(),k=keyFor(q);mbuUpdateFlag(q);document.getElementById('mbuNavigator').innerHTML=currentData.map((x,i)=>mbuNavButton(i,i+1,i===currentIndex,mbuIsFlagged(x),'currentIndex='+i+';loadQuestion()',(()=>{const ss=setState(),kk=(mode==='set'?String(i):mode==='review'?`r${currentSet}_${x.id}`:`t6_${x._sourceSet}_${x.id}`);return ss.graded&&ss.graded[kk]?(ss.correct&&!!ss.correct[kk]):null})())).join('');if(mode==='set'){db.sets[currentSet].current=currentIndex}else if(mode==='test6'){db.test6.current=currentIndex}saveDB();document.getElementById('set-badge').textContent=mode==='test6'?'MISSED QUESTIONS REVIEW':mode==='review'?`PRACTICE SET ${currentSet}: MISSED REVIEW`:`PRACTICE SET ${currentSet}`;document.getElementById('progress').textContent=`Question ${currentIndex+1} of ${currentData.length}${mode!=='test6'?` · Q${q.id}`:` · Practice Set ${q._sourceSet}, Q${q.id}`}`;document.getElementById('type').textContent=q.type==='single'?'Single Best Answer':`Select ${q.answer.length} Options`;document.getElementById('stem').textContent=q.stem;const im=document.getElementById('image');if(q.imageSvg){im.classList.remove('hidden');im.innerHTML=q.imageSvg}else{im.classList.add('hidden');im.innerHTML=''}const selected=st.answers[k]||[],graded=!!st.graded[k];const opts=document.getElementById('options');opts.innerHTML='';q.options.forEach((txt,i)=>{const b=document.createElement('button');b.className='opt';if(selected.includes(i))b.classList.add('selected');const sk=`${k}_${i}`;if(st.strikes&&st.strikes[sk])b.classList.add('strike');b.innerHTML=`<span class="prefix">${String.fromCharCode(65+i)}.</span><span>${txt}</span>`;b.oncontextmenu=e=>{e.preventDefault();if(graded)return;if(!st.strikes)st.strikes={};st.strikes[sk]=!st.strikes[sk];b.classList.toggle('strike');saveDB()};if(graded){b.classList.add('locked');if(q.answer.includes(i))b.classList.add('correct');else if(selected.includes(i))b.classList.add('incorrect')}else b.onclick=()=>choose(i);const row=document.createElement('div');row.className='mbu-choice-row';const cross=document.createElement('button');cross.type='button';cross.className='mbu-cross';cross.textContent='✕';cross.setAttribute('aria-label',`Cross out option ${String.fromCharCode(65+i)}`);cross.setAttribute('aria-pressed',String(!!(st.strikes&&st.strikes[sk])));cross.disabled=graded;cross.onclick=()=>{b.oncontextmenu({preventDefault(){}});cross.setAttribute('aria-pressed',String(!!st.strikes[sk]))};row.append(b,cross);opts.appendChild(row)});const ex=document.getElementById('explain');if(graded){ex.style.display='block';document.getElementById('explain-text').innerHTML=`<strong>Explanation:</strong> ${q.explanation||''}`;document.getElementById('citation').textContent=q.citation?`Source: ${q.citation}`:''}else ex.style.display='none';const msr=document.getElementById('multi-submit-row'),msb=document.getElementById('submit-multi');if(!graded){msr.style.display='flex';if(q.type==='single'){msb.disabled=selected.length!==1;msb.textContent='Submit Answer'}else{msb.disabled=selected.length!==q.answer.length;msb.textContent=`Submit Selections (${selected.length}/${q.answer.length})`}}else{msr.style.display='none'}updateStats();document.getElementById('prev').disabled=currentIndex===0;document.getElementById('next').disabled=currentIndex===currentData.length-1&&!graded;document.getElementById('next').style.visibility=(graded||currentIndex<currentData.length-1)?'visible':'hidden';window.MBUCalculator?.besideFlag()}
function choose(i){const q=currentData[currentIndex],st=setState(),k=keyFor(q);if(st.graded[k])return;let a=st.answers[k]||[];if(q.type==='single'){a=[i];st.answers[k]=a;saveDB();loadQuestion()}else{if(a.includes(i)){a=a.filter(x=>x!==i)}else{const max=q.answer.length;if(a.length>=max)return;a=[...a,i]}st.answers[k]=a;saveDB();loadQuestion()}}
function submitAnswer(){const q=currentData[currentIndex],st=setState(),k=keyFor(q);if(st.graded[k])return;const a=st.answers[k]||[];if(q.type==='single'){if(a.length!==1)return}else if(a.length!==q.answer.length)return;grade()}
function grade(){const q=currentData[currentIndex],st=setState(),k=keyFor(q),a=(st.answers[k]||[]).slice().sort((x,y)=>x-y),ans=q.answer.slice().sort((x,y)=>x-y),ok=a.length===ans.length&&a.every((v,i)=>v===ans[i]);st.graded[k]=true;if(!st.correct)st.correct={};st.correct[k]=ok;const source=mode==='test6'?q._sourceSet:currentSet;if(mode==='set'&&!ok){const old=`t6_${source}_${q.id}`;delete db.test6.answers[old];delete db.test6.graded[old];if(db.test6.correct)delete db.test6.correct[old];if(db.test6.strikes)for(let i=0;i<q.options.length;i++)delete db.test6.strikes[`${old}_${i}`]}if(ok)db.missed[source]=db.missed[source].filter(id=>id!==q.id);else if(!ok&&(mode==='set'||mode==='review')&&!db.missed[source].includes(q.id))db.missed[source].push(q.id);saveDB();mbuStudioAnswer(q,ok);loadQuestion();if(ok&&currentIndex<currentData.length-1){autoTimer=setTimeout(()=>{currentIndex++;loadQuestion()},650)}}
function updateStats(){const st=setState();let done=0,good=0;for(let i=0;i<currentData.length;i++){const q=currentData[i],k=(mode==='set'?String(i):mode==='review'?`r${currentSet}_${q.id}`:`t6_${q._sourceSet}_${q.id}`);if(st.graded[k]){done++;if(st.correct&&st.correct[k])good++}}document.getElementById('completed').textContent=done;document.getElementById('total').textContent=currentData.length;document.getElementById('score').textContent=done?Math.round(good/done*100):0;document.getElementById('missed').textContent=done-good}
function nav(d){const n=currentIndex+d;if(n>=0&&n<currentData.length){currentIndex=n;loadQuestion()}else if(d>0)goDashboard()}
function goDashboard(){renderDashboard();window.scrollTo(0,0)}
function resetCurrent(){if(!confirm('Reset progress for this quiz view? Saved missed-question history from Sets 1–5 will remain.'))return;if(mode==='set'){db.sets[currentSet]=blankState()}else if(mode==='test6'){db.test6=blankState()}else{const st=db.sets[currentSet];for(const q of currentData){const k=`r${currentSet}_${q.id}`;delete st.answers[k];delete st.graded[k];delete st.correct[k];for(let i=0;i<q.options.length;i++)delete st.strikes[`${k}_${i}`]}}currentIndex=0;saveDB();loadQuestion()}
loadDB();renderDashboard();

:root{--paper:#F2F5F4;--sheet:#fff;--ink:#17252B;--mute:#5B6B71;--rule:#D3DCD9;--o2:#1E7B4F;--o2bg:#E4F3EB;--bad:#B3261E;--badbg:#FBE7E5;--n2o:#1F4E9E;--sel:#E7EEFA;--air:#C9950C;--wagd:#7B3F8C}
@media (prefers-color-scheme:dark){:root{--paper:#0F1719;--sheet:#172226;--ink:#E4ECEA;--mute:#9AAAB0;--rule:#2A3A3F;--o2:#4CC08A;--o2bg:#12301F;--bad:#F2877D;--badbg:#3A1714;--n2o:#7FA6EE;--sel:#1C2B45}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:12px 16px 40px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:6px 0 10px;border-bottom:1px solid var(--rule)}
header h1{font-size:1rem;margin:0;font-weight:650}
.stats{font-size:.88rem;color:var(--mute)}
.stats b{color:var(--ink)}
.bar{height:6px;background:var(--rule);border-radius:3px;margin:10px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--o2);width:0}
.hbtns{display:flex;gap:6px}
button{font:inherit;cursor:pointer;border-radius:6px}
.ghost{background:transparent;border:1px solid var(--rule);color:var(--ink);padding:4px 10px;font-size:.85rem}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:16px 18px}
.qmeta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--mute);margin-bottom:6px}
.stem{font-size:1.06rem;font-weight:560;margin:0 0 10px}
.fig{margin:4px 0 10px}
.fig img{max-width:100%;max-height:300px;display:block;border:1px solid var(--rule);border-radius:4px;background:#fff;cursor:zoom-in}
.fig small{color:var(--mute)}
.ch{display:flex;align-items:stretch;gap:6px;margin:6px 0}
.opt{flex:1;display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--sheet);color:var(--ink);border:1.5px solid var(--rule);padding:8px 12px;line-height:1.35}
.opt .L{font-weight:700;min-width:1.2em;color:var(--mute)}
.opt:hover:not(:disabled){border-color:var(--n2o)}
.opt.sel{border-color:var(--n2o);background:var(--sel)}
.opt.x .t{text-decoration:line-through;opacity:.45}
.opt.ok,.opt.miss{border-color:var(--o2)!important;background:var(--o2bg)!important;color:var(--o2)!important;font-weight:750}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.opt.miss{border-color:var(--o2);border-style:dashed}
.opt:disabled{cursor:default}
.xo{width:34px;border:1px solid var(--rule);background:transparent;color:var(--mute);font-size:.8rem}
.xo[aria-pressed="true"]{color:var(--bad);border-color:var(--bad)}
.act{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.primary{background:var(--n2o);color:#fff;border:0;padding:8px 18px;font-weight:600}
.primary:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:.8rem;color:var(--mute)}
.fb{margin-top:12px;padding:10px 12px;border-radius:6px;font-size:.95rem}
.fb.good{background:var(--o2bg);border-left:4px solid var(--o2)}
.fb.badf{background:var(--badbg);border-left:4px solid var(--bad)}
.fb p{margin:.3rem 0}
.src{font-size:.8rem;color:var(--mute)}
.disc{font-size:.85rem;border-top:1px dashed var(--rule);padding-top:6px;margin-top:6px}
:focus-visible{outline:3px solid var(--n2o);outline-offset:2px}
h2{font-size:1.2rem;margin:.2rem 0 .6rem}
table{border-collapse:collapse;width:100%;font-size:.92rem}
td,th{padding:6px 8px;border-bottom:1px solid var(--rule);text-align:left}
.rv{margin-bottom:16px}
.pill{display:inline-block;font-size:.75rem;padding:1px 7px;border-radius:10px;border:1px solid var(--rule);color:var(--mute);margin-left:6px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;background:#fff}
ul.concepts{columns:2;font-size:.9rem;padding-left:1.1rem}
@media (max-width:600px){ul.concepts{columns:1}}
